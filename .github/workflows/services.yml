# Go 平台服务：静态检查与测试。
name: services

on:
  pull_request:
    paths:
      - "services/**"
      - "contracts/policy/**"
      - "contracts/storage/**"
      - "contracts/apis/**"
      - "packs/application_domains/**"
      - ".github/workflows/services.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      kafka:
        image: apache/kafka:4.1.0          # 默认配置即单节点 KRaft，监听 localhost:9092
        ports: ["9092:9092"]
    env:
      MIAOQIA_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
      MIAOQIA_TEST_KAFKA: localhost:9092
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum

      - name: 格式与静态检查
        working-directory: services
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...

      - name: 测试（含竞态检查；集成测试使用真实 PostgreSQL 与 Kafka）
        working-directory: services
        run: go test -race ./...
