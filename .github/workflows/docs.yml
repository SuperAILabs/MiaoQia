# 文档检查：只改文档的变更也要经过链接与契约一致性检查。规则见 docs/05-delivery/03-engineering-standards.md 第 8 节。
name: docs

on:
  pull_request:
    paths:
      - "**/*.md"
      - "tools/dev/check_doc_links.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: 链接检查器自测
        run: python3 tools/dev/check_doc_links.py --self-test

      - name: 相对链接与锚点
        run: python3 tools/dev/check_doc_links.py

      - name: 空白与行尾
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git diff --check "origin/${{ github.base_ref }}" HEAD -- '*.md'

      - name: 契约检查（文档引用的契约与扩展包保持一致）
        run: uv run --project tools/contracts --python 3.12 --locked mqc check
