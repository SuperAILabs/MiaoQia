# Python 数据面：SDK 测试与语料评测。
name: data

on:
  pull_request:
    paths:
      - "data/**"
      - "tests/contract/**"
      - "tools/dev/**"
      - "deploy/**"
      - "docs/03-architecture/subsystems/README.md"
      - "packs/information_domains/**"
      - "contracts/schemas/**"
      - "contracts/events/**"
      - "contracts/tests/integration.*"
      - "contracts/integration.yaml"
      - "contracts/storage/**"
      - ".github/workflows/data.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: 依赖规则（import-linter）
        working-directory: data
        run: uv run --locked --all-packages lint-imports

      - name: 实例域与扩展包依赖
        run: |
          uv run --project tools/contracts --python 3.12 --locked python tools/dev/gen_local.py --check
          uv run --project data --locked --all-packages python tools/dev/check_python_boundaries.py

      - name: SDK 与信息领域包测试
        working-directory: data
        run: uv run --locked --all-packages --group dev pytest -q sdk/tests subsystems/evidence/tests ../packs/information_domains/procurement/tests ../packs/information_domains/organizations/tests

      - name: INF-PROC 语料评测（Schema 校验 + 关键字段准确率 ≥ 95%）
        working-directory: data
        run: >
          uv run --locked --package miaoqia-sdk mq-corpus check ../packs/information_domains/procurement/corpus
          --extractor miaoqia_pack_procurement.extractors.tender_notice:TenderNoticeExtractor
          --path ../packs/information_domains/procurement/src
          --schema domains/procurement/notice.schema.json
          --min-accuracy 0.95

      - name: 生命周期真实原件与人工契约映射
        working-directory: data
        run: >
          uv run --locked --package miaoqia-sdk mq-corpus check ../packs/information_domains/procurement/corpus
          --reviewed --schema domains/procurement/notice.schema.json

      - name: 企业登记真实原件与人工契约映射
        working-directory: data
        run: >
          uv run --locked --package miaoqia-sdk mq-corpus check ../packs/information_domains/organizations/corpus
          --reviewed --schema domains/organization/registration.schema.json --schema domains/organization/change.schema.json --schema domains/organization/abnormal.schema.json

  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      kafka:
        image: apache/kafka:4.1.0
        ports: ["9092:9092"]
    env:
      MIAOQIA_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
      MIAOQIA_TEST_KAFKA: localhost:9092
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: kernel 测试（集成测试使用真实 PostgreSQL 与 Kafka）
        working-directory: data
        run: uv run --locked --package miaoqia-kernel --group dev pytest -q kernel/tests
