# M0 工程探针与 identity 本地/远程绑定验证（tests/e2e/m0.py）；整体退出另按阶段基线验收。
name: e2e

on:
  pull_request:
    paths:
      - "services/**"
      - "data/**"
      - "deploy/**"
      - "contracts/**"
      - "tools/dev/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m0:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: 启动本地基础组件
        run: deploy/local/up.sh

      - name: 端到端验证
        run: uv run --project data --locked --all-packages python tests/e2e/m0.py

      - name: 进程日志
        if: failure()
        run: tail -n 100 deploy/local/.data/e2e/*.log
