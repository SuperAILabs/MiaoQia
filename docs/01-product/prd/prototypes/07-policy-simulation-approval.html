<style>

  --bad:#ef8a7e; --bad-soft:#3d2421; --off:#5f6a65; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1c2220; --ink:#e3e9e5; --muted:#9aa7a0; --line:#34403b;
  --accent:#5cc3a6; --accent-soft:#1e3a32; --warn:#e0a24a; --warn-soft:#3a2e1a;
  --bad:#ef8a7e; --bad-soft:#3d2421; --off:#5f6a65; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px}

header.top{max-width:1180px;margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline}

.label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.states{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.states button{font:inherit;font-size:.82rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}

.states button:disabled{color:var(--off);cursor:not-allowed;border-style:dashed}
.note{font-size:.82rem;color:var(--muted);margin:0 0 12px}
.stage{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}

.msg{border-radius:6px;padding:10px 12px;font-size:.88rem}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--accent-soft);color:var(--accent)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500}
.pill{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.pill.ok{color:var(--accent)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.off{color:var(--off)}
.skel{height:12px;border-radius:4px;background:var(--line);opacity:.6}
.qr{width:120px;height:120px;border:1px dashed var(--muted);display:grid;place-items:center;font-size:.75rem;color:var(--muted)}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.empty{border:1px dashed var(--line);border-radius:8px;padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.rules{margin-top:18px;font-size:.84rem;color:var(--muted)}
.rules ul{margin:6px 0 0;padding-left:18px}
@media (prefers-reduced-motion:no-preference){.skel{animation:p 1.2s ease-in-out infinite}@keyframes p{50%{opacity:.25}}}
</style>

<header class="top">
  <h1>第7段原型：策略编辑、仿真与审批</h1>
  <p>低保真线框 · 对应 docs/01-product/prd/07-policy-simulation-approval.md · 示例数据</p>
</header>
<div class="wrap">
  <nav class="pages" id="pages" aria-label="页面"></nav>
  <main style="min-width:0">
    <div class="label">状态</div>
    <div class="states" id="states" role="group" aria-label="状态"></div>
    <p class="note" id="note"></p>
    <div class="stage" id="stage"></div>
    <div class="rules" id="rules"></div>
  </main>
</div>

<script>
const ALL=["正常","空态","加载","无权限","过期","失败","部分成功","来源中断","数据未知"];
const L=n=>Array.from({length:n},()=>'<div class="skel"></div>').join('');
const desk=(url,body)=>`<div class="desk"><div class="bar">${url}</div><div class="scr">${body}</div></div>`;
const phone=(t,body)=>`<div class="phone"><div class="bar">${t}</div><div class="scr">${body}</div></div>`;
const rulesTbl=`<div class="tbl"><table><tr><th>子句</th><th>规则</th><th>用到</th><th>数据</th><th>启用</th></tr>
<tr><td>硬条件</td><td>项目标的包含我方产品品类</td><td>档案 · 品类</td><td><span class="pill ok">可用</span></td><td>☑</td></tr>
<tr><td>硬条件</td><td>项目位于服务区域</td><td>档案 · 区域</td><td><span class="pill ok">可用</span></td><td>☑</td></tr>
<tr><td>排除</td><td>我方任一主体即中标方</td><td>档案 · 本企业</td><td><span class="pill ok">可用</span></td><td>☑</td></tr>
<tr><td>加分 +15</td><td>施工许可已发放</td><td>投资项目</td><td><span class="pill off">数据未接入，本版本不生效</span></td><td>☑</td></tr>
<tr><td>加分 +15</td><td>中标方是我方已有客户</td><td>客户清单 48 家</td><td><span class="pill ok">可用</span></td><td>☑</td></tr>
<tr><td>减分 −25</td><td>中标方近一年有较重信用风险</td><td>企业信用</td><td><span class="pill off">数据未接入，本版本不生效</span></td><td>☑</td></tr></table></div>`;
const dist=(a,b)=>`<div class="tbl"><table><tr><th>处置</th><th>生效版本 v3</th><th>草案</th><th>平均每周（草案）</th></tr>
<tr><td>跟进候选</td><td>${a[0]}</td><td>${b[0]}</td><td>${(b[0]/13).toFixed(1)}</td></tr>
<tr><td>复核候选</td><td>${a[1]}</td><td>${b[1]}</td><td>${(b[1]/13).toFixed(1)}</td></tr>
<tr><td>观察</td><td>${a[2]}</td><td>${b[2]}</td><td>${(b[2]/13).toFixed(1)}</td></tr>
<tr><td>排除（默认隐藏）</td><td>${a[3]}</td><td>${b[3]}</td><td>—</td></tr></table></div>`;
const inputs=`<div class="msg warn">候选变更仿真：假设当时就按草案与现在的档案运行的结果，不是当时实际产生的信号。</div><p class="note">窗口 2026-07-19 至 2026-10-16（90 天）· 公共数据集 ds-2026-10-16 · 两侧共用档案上下文版本 41（提交仿真时）· 对比生效版本 v3（策略代次 7）· 模板 A02 0.3.0 · 草案启用领域：采购、企业（投资项目、企业信用未接入）</p>`;
const PAGES=[
{id:"policy",name:"策略页",
 na:{"失败":"只读页面","部分成功":"只读页面","来源中断":"只读本租户数据"},
 rules:["激活只经审批，草案与仿真不改变生效版本","启用领域集合随版本固定，领域上线只提示可升级","每个目标同时最多一份草案、一个进行中的申请"],
 s:{
 "正常":()=>desk("目标 / A02 进入供货 / 策略",`<div class="row" style="justify-content:space-between"><h2>生效版本 v3</h2><span class="pill ok">生效</span></div>
 <p class="note">模板 A02 0.3.0 · 10-12 09:30 激活 · 申请人 王磊 · 批准人 李敏</p>${rulesTbl}
 <div class="card"><div><b>草案（基于 v3）</b> · 修订 2 · 孙浩 10-16 17:05 保存</div><div>改动：大额阈值 500 万 → 300 万；“中标方是已有客户”权重 15 → 20</div><div><span class="pill ok">仿真完成</span> 跟进候选每周约 4.8 条（v3 为 3.6 条）</div><div class="row"><button class="btn">查看仿真报告</button><button class="btn ghost">继续编辑</button></div></div>`),
 "空态":()=>desk("目标 / A02 进入供货 / 策略",`<div class="row" style="justify-content:space-between"><h2>还没有生效版本</h2><span class="pill warn">未激活</span></div><div class="msg ok">首版草案已按模板与你的档案生成。仿真完成后提交首次激活；批准前这个目标不会产生信号。</div><div class="row"><button class="btn">查看首版草案的仿真</button></div>`),
 "加载":()=>desk("目标 / A02 进入供货 / 策略",`<h2>策略</h2>${L(6)}`),
 "无权限":()=>desk("目标（陈晨 · 业务开拓者）",`<div class="empty"><div>你不是这个目标的参与人，看不到它的策略。目标负责人 王磊 可以把你加为参与人。</div></div>`),
 "过期":()=>desk("目标 / A02 进入供货 / 策略",`<div class="msg warn">模板有新版本 0.4.0：新增“合同公告中出现我方品类”加分规则，删除了你曾调整权重的“大额项目”规则。<u>查看差异</u> · <u>基于新模板创建草案</u></div><div class="msg warn">企业信用数据已接入。当前生效版本 v3 中“中标方有较重信用风险”仍不生效；升级后需重新仿真与审批。<u>创建升级草案</u></div>`),
 "数据未知":()=>desk("目标 / A02 进入供货 / 策略",`${rulesTbl}<p class="note">“数据未接入”的规则在本版本中按未知处理：加分、减分不计分。数据接入后需要形成新版本并重新审批才会生效。</p>`)}},
{id:"edit",name:"编辑草案",
 na:{"空态":"草案总基于生效版本或首版","部分成功":"一次保存","来源中断":"编辑只读写本租户数据"},
 rules:["只能调整参数、非锁定规则启停、权重、阈值、通知受众与方式","保存即编译并运行模板样例；编译失败不能仿真","两人同时编辑时后提交者收到版本冲突"],
 s:{
 "正常":()=>desk("A02 进入供货 / 草案 修订 2",`<h2>修改策略</h2><div class="tbl"><table><tr><th>项</th><th>生效版本 v3</th><th>草案</th></tr>
 <tr><td>品类</td><td>随档案</td><td>随档案</td></tr><tr><td>大额阈值</td><td>500 万元</td><td><b>300 万元</b></td></tr>
 <tr><td>加分 · 中标方是已有客户</td><td>+15</td><td><b>+20</b></td></tr><tr><td>跟进阈值 / 丢弃阈值</td><td>60 / 20</td><td>60 / 20</td></tr>
 <tr><td>跟进候选通知</td><td>负责人 · 即时</td><td>负责人 · 即时</td></tr></table></div>
 <div class="row"><button class="btn">保存并仿真</button><button class="btn ghost">放弃草案</button></div>`),
 "加载":()=>desk("A02 进入供货 / 草案",`<h2>正在编译与校验</h2>${L(4)}`),
 "无权限":()=>desk("A02 进入供货 / 策略（只读）",`<p class="note">只读：起草策略需要决策者，或作为本目标参与人的业务开拓者。</p>${L(3)}`),
 "过期":()=>desk("A02 进入供货 / 草案",`<div class="msg warn">王磊 在你编辑期间保存了修订 3（停用了“项目位于服务区域”）。你的修改没有保存。查看差异后基于修订 3 重新编辑。</div><button class="btn">查看差异</button>`),
 "失败":()=>desk("A02 进入供货 / 草案 修订 4",`<div class="msg bad">没有通过校验，不能仿真：<br>· 丢弃阈值 70 必须小于跟进阈值 60<br>· 权重 80 超出 1–50 的范围（加分 · 金额较大）</div><button class="btn ghost">返回修改</button>`),
 "数据未知":()=>desk("A02 进入供货 / 草案",`<div class="msg warn">品类“随档案”，但档案里还没有选择品类。仿真中“项目标的包含我方品类”会全部为未知，所有项目进入复核。先到客户档案选择品类。</div>`)}},
{id:"report",name:"仿真报告",
 na:{},
 rules:["报告固定对应一份草案修订，输入固定，重跑结果相同","报告不自动判定通过，是审批依据","代表样本按查看者权限过滤"],
 s:{
 "正常":()=>desk("仿真报告 · 草案修订 2 对比 v3",`${inputs}${dist([47,112,9,31],[62,104,9,31])}
 <div class="card"><div><b>差异</b>：新增 7 · 移除 0 · 处置变化 8（复核 → 跟进）</div><div class="tbl"><table><tr><th>代表样本</th><th>变化</th><th>原因</th></tr><tr><td>杭州某污水管网改造 EPC 中标结果 · 420 万</td><td>复核 → 跟进</td><td>大额阈值降至 300 万</td></tr><tr><td>苏州某片区供水管道工程 · 360 万</td><td>新增 · 跟进</td><td>已有客户 +20</td></tr></table></div></div>
 <div class="card"><div><b>未知比例最高的规则</b></div><div>施工许可已发放：100% 未知（数据未接入）· 中标方有较重信用风险：100% 未知（数据未接入）· 已识别中标方：12% 未知（低于证据门槛 0.9）</div></div>`),
 "空态":()=>desk("仿真报告 · 草案修订 1（首次激活）",`${inputs}<div class="msg warn">窗口内没有任何项目进入候选。常见原因：品类或区域过窄、金额下限过高。可以调整后重新仿真；也可以照常提交，审批人会看到这条提示。</div>`),
 "加载":()=>desk("仿真报告 · 草案修订 2",`<h2>仿真中</h2><p class="note">正在回放近 90 天的 6,218 条中标结果与合同公告（第 2,940 条）。可以离开本页，完成后会通知你。</p>${L(3)}`),
 "无权限":()=>desk("仿真报告（只读）",`${dist([47,112,9,31],[62,104,9,31])}<p class="note">你可以查看报告；提交激活需要决策者，或作为参与人的业务开拓者。</p>`),
 "过期":()=>desk("仿真报告 · 草案修订 2",`<div class="msg warn">草案已更新为修订 3，这份报告对应旧修订，不能用于提交激活。修订 3 的仿真排队中。</div>`),
 "失败":()=>desk("仿真报告 · 草案修订 2",`<div class="msg bad">仿真没有完成：运行超过 1 小时被中止。草案没有变化，可以重试；重试会复用相同输入。</div><button class="btn">重新仿真</button>`),
 "部分成功":()=>desk("仿真报告 · 代表样本",`<div class="tbl"><table><tr><th>代表样本</th><th>变化</th></tr><tr><td>杭州某污水管网改造 EPC · 420 万</td><td>复核 → 跟进</td></tr><tr><td colspan="2" class="note">另有 3 条样本你没有查看权限，只计入数量</td></tr></table></div>`),
 "来源中断":()=>desk("仿真报告 · 草案修订 2",`<div class="msg warn">公共数据集暂时不可用，仿真已排队，恢复后自动开始。生效版本不受影响。</div>`),
 "数据未知":()=>desk("仿真报告 · 草案修订 1（首次激活）",`<div class="msg warn">候选变更仿真：假设当时就按草案与现在的档案运行的结果，不是当时实际产生的信号。</div><p class="note">窗口 2026-08-28 至 2026-10-16（实际可得 49 天，少于 90 天）· 首次激活，没有对比版本</p><div class="msg warn">“中标方近三年项目中出现过我方品类”需要 3 年历史，当前只覆盖 14 个月，本版本中固定为未知；历史补齐后可升级。</div><div class="msg warn">需复核比例 61%，超过一半。主要原因：“已识别中标方”有 38% 低于证据门槛。</div>`)}},
{id:"request",name:"提交激活申请",
 na:{"空态":"提交页总基于一份报告","部分成功":"一次提交","来源中断":"只写本租户数据"},
 rules:["报告必须对应当前草案修订","提交需 15 分钟内强认证","提交后草案锁定，撤回后才能再编辑","同一目标同时只有一个进行中的申请"],

 "正常":()=>desk("提交激活 · A02 进入供货 · 修订 2",`<div class="field">说明（给审批人）<div class="box">降低大额阈值，试点客户反馈 300–500 万的总包也会采购管材。</div></div><div class="field">审批人<div class="box">目标范围内有批准权的成员：李敏（管理员）、赵强（决策者）</div></div><div class="msg ok">需要验证码确认（强认证）。提交后草案锁定，审批人会收到通知。</div><button class="btn">验证并提交</button>`),
 "加载":()=>desk("提交激活",`<h2>正在提交</h2>${L(2)}`),

let page=PAGES[0], state="正常";
const $=id=>document.getElementById(id);
function render(){
  $("pages").innerHTML=PAGES.map(p=>`<button data-p="${p.id}" aria-current="${p===page}">${p.name}</button>`).join("");
  $("states").innerHTML=ALL.map(s=>{const na=page.na[s];return `<button data-s="${s}" aria-pressed="${s===state}" ${na?`disabled title="${na}"`:""}>${s}</button>`}).join("");
  const nas=Object.entries(page.na).map(([k,v])=>`${k}：${v}`).join("；");
  $("note").textContent=nas?`不适用的状态：${nas}`:"";
  $("stage").innerHTML=(page.s[state]||page.s["正常"])();
  $("rules").innerHTML=`<div class="label">本页规则</div><ul>${page.rules.map(r=>`<li>${r}</li>`).join("")}</ul>`;
}
$("pages").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;page=PAGES.find(p=>p.id===b.dataset.p);state="正常";render()});
$("states").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;state=b.dataset.s;render()});
render();
</script>
