reason: >-
  PRD 第1段渠道安装与停用（F4）、账号绑定（F5）、解绑与免登撤销（F6）、卡片跳转（F7）的服务端切片对 C4a 冻结契约做了追加式修改：
  contracts/identifiers.yaml 新增 ChannelSession 前缀 chs（identity），以及 ChannelInstallation chi、ChannelBinding chb、
  BindingRequest cbr、CardLink lnk（channels）（1.3.0 → 1.4.0）；contracts/apis/identity/openapi.yaml 新增只供 channels 服务主体调用的
  免登会话签发（POST /v1/identity/channel-sessions）、有效会话分页列表（GET，limit/cursor，供对账）与按绑定版本撤销
  （POST /v1/identity/channel-sessions:revoke）及其类型，并在说明中写明免登会话不满足强认证（1.3.0 → 1.4.0）；签发请求带绑定建立时的
  成员版本 member_version，成员退出后（即使已重新加入）退出前的绑定签发为 409 member_rejoined、其会话核验为 401，退出是不随重新加入撤销的生命周期边界。
  mqc compat 对 origin/main 判定 breaking 0：已有路径与类型不变，新增均为追加。channels 的 OpenAPI（0.1.0）与事件
  channels.binding.changed.v1（0.1.0）是新文件，不在 C4a 冻结范围，只记录。网关对渠道免登来源的令牌新增要求
  miaoqia_channel_session 声明并逐次经 identity 核验，这是令牌校验语义的收紧，不改变任何接口结构。
  这里把切片结束时的内容登记为新基线；原冻结记录与修订 1–5 不改。
