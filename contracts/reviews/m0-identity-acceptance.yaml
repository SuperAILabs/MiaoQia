limitations:
- Positive MFA administration uses the shared HTTPS signed test issuer; real Keycloak
  password-login and revocation are tested separately; production MFA ceremony and
  issuer/client policy require deployment evidence
- M0 managed tenant Check supports current user and tenant-root resources; future
  business resources, delegated identities, service accounts, collaborators and multiple
  cells require their own gates
- Revocation applies to new authorization checks after commit; already-admitted requests
  are not forcibly interrupted
- M0 model gateway, shared development deployment/recovery and CI/environment handoff
  remain open; product design is separate
