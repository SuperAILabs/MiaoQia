authorization: 用户要求继续M0工程，优先补齐最小身份生命周期、cell-01路由、正反例/集成测试及工程文档；产品交互和原型不在本次范围。
scope: M0租户创建/停用/恢复、成员加入/退出/角色、命令幂等、最小管理查询、权威cell-01核验；不是整个M0或生产IdP/MFA部署验收。
gates:
- id: M0-IDENTITY-LIFECYCLE
  status: closed
  evidence:
  - Generated OpenAPI request validation; platform operator and tenant admin boundaries;
    signed MFA required
  - 'PostgreSQL transaction: directory + command receipt + lifecycle event + audit;
    rollback on audit fault'
  - 'Idempotency-Key: original response, concurrent creation, conflict and current
    reauthorization'
  - Expected versions, current-version queries and concurrent last-admin preservation
  - Current SQL roles evaluated using the existing OpenFGA model, independent of stale
    persisted role tuples
  - Real Kafka lifecycle and audit relay; original payload schema validation
- id: M0-CELL-ROUTING
  status: closed
  evidence:
  - Local and generated mTLS remote identity.SessionResolver
  - Gateway validates response schema and tenant/cell/subject/state binding
  - Unknown tenant, disabled tenant, removed member and wrong cell fail closed; directory
    SQL fault returns 503
  - 'Real HTTPS Keycloak login: correct cell accepted, wrong cell rejected; removed
    member old and new login tokens rejected'
