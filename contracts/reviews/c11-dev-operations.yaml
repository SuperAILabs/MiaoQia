    owner_roles: [platform_engineering_lead, data_lead_for_source_alerts]
    required: Register named operators, ownership, escalation route and incident runbook. Configure dedicated read-only identities and deployment thresholds, then exercise the authorized alert route and operator response.
  - id: persistent_mainland_rollout
    owner_roles: [platform_engineering_lead, data_lead]
    required: Supply durable storage, backup and index configuration and scoped credentials on the designated permanent VPS, plus per-source publication, retention and access admission for continuous collection.
