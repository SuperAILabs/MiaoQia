    type: https://errors.miaoqia.com/content_unavailable
    title: content_unavailable
    status: 404
    code: content_unavailable
  cases:
  - name: 账号不一致给出收件人
    valid: true
    patch:
    - op: replace
      path: /code
      value: account_mismatch
    - op: replace
      path: /status
      value: 409
    - op: add
      path: /recipient
      value: usr_01JA8ZXXXXXXXXXXXXXXXXXXX1
  - name: 通用不可打开不得夹带标题
    valid: false
    patch:
    - op: add
      path: /object_title
      value: 某燃气项目
  - name: 状态码须为错误
    valid: false
    patch:
    - op: replace
      path: /status
      value: 200
