openapi: 3.1.0
info:
  title: channels 渠道安装、绑定与卡片跳转接口
  version: 0.4.0
  description: >-
    channels 的对外接口（经 gateway，令牌派生租户与主体），PRD 第1段 F4–F7 的服务端切片。首批只有企业微信（wecom）；
    飞书、钉钉随各自适配器追加。租户只来自已验证的令牌，请求体与链接中的租户一律不信任。管理动作（安装、验证、停用、强制解绑）
    经 identity.Guard 的 RequireAdmin：can_manage_members 与15分钟内的强认证（403 forbidden / mfa_required /
    totp_enrollment_required）。渠道回调（安装授权回调、消息回调验签）与渠道内置浏览器的免登入口不带妙洽令牌，不在本契约中：
    它们以 channels 的本地绑定提供，对外路由随网关的未认证入口接入。绑定的权威在 channels：失效即时生效（状态 revoking，
    界面显示“解绑处理中”），identity 确认撤销免登会话且最后一张签发凭据过期（含5秒偏差）后才变为 invalidated。
    无权限与不存在使用同一错误（404 content_unavailable），不返回标题、归属、组织单元或负责人。
    0.2.0（PRD 第5段简报与快捷动作的服务端切片）：追加简报偏好、简报历史与完整简报、本人重新推送、简报链接与管理员的投递统计。
    简报、投递与链接只属于一名成员：他人的、其他租户的与不存在的简报同为 404 briefing_not_found。完整简报的条目是组装时的快照，
    当前处理状态按“当前”叠加并单独标注时间轴；读取时按当前权限再检查各目标区，失去 can_view_signals 的区不返回条目。
    卡片按钮的动作令牌只经渠道回调使用（不在本契约中）；简报链接只指向对象，不携带登录身份。
    0.3.0（PRD 第6段 F9，C-09）：“待我处理”区追加任务条目（kind task，经 pursuit listMyTasks 以收件人本人取数；读取时以本人经
    pursuit getTask 再检查，已不能查看的任务不返回，其余叠加 task_current）。提醒卡片与授权被拒通知上的“查看”是 Web 跟进详情的
    地址（只指向对象、不带令牌，打开时由 pursuit 以当前登录成员授权），不经简报链接。
    0.4.0（C-11）：投递统计追加可选的 notices（渠道通知按种类、状态与原因的计数）；均为追加。
servers:
- url: /
paths:
  /v1/channels/installations:
    get:
      operationId: listInstallations
      summary: 本租户的渠道安装（设置 / 渠道）
      description: >-
        需要 can_manage_members（只读，不要求强认证）。每个渠道至多一条安装记录，含状态与已绑定人数（状态为 bound 的绑定数）。
      x-timeout-ms: 5000
      x-idempotent: true
      responses:
        '200':
          description: 安装列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationList'
        default: &problem
          description: 失败关闭，稳定错误码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: installChannel
      summary: 开始安装渠道（InstallChannel）
      description: >-
        管理员 + 强认证。创建或重新开始本租户在该渠道的安装：状态 authorizing，返回渠道官方授权页地址（一次性 state，10分钟有效）。
        已启用或待验证的安装为 409 channel_already_installed；授权中或已停用的安装重新开始授权（版本加一，此前发出的授权 state 失效）。
        授权回调成功后状态为 pending_verification，并登记安装所属的企业；同一企业同时只能属于一个租户（409 corp_installed_elsewhere，
        在回调时判断）。渠道适配器未接入时 503 channel_unavailable。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - &idempotency
        name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallChannelRequest'
      responses:
        '200':
          description: 安装记录与授权页地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationStarted'
        default: *problem
  /v1/channels/installations/{installationID}/verify:
    post:
      operationId: verifyInstallation
      summary: 确认测试消息，启用渠道（VerifyInstallation）
      description: >-
        管理员 + 强认证。安装须为 pending_verification，且调用者本人已按绑定规则在该安装下完成绑定（状态 bound），
        否则 409 installation_not_pending / 409 verification_binding_required；之后状态为 enabled。按 expected_version 并发控制。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *idempotency
      - &installationID
        name: installationID
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/InstallationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: 已启用的安装
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Installation'
        default: *problem
  /v1/channels/installations/{installationID}/disable:
    post:
      operationId: disableInstallation
      summary: 停用渠道（UninstallChannel）
      description: >-
        管理员 + 强认证。安装变为 disabled，企业登记解除；在同一事务中使该安装下全部 bound 的绑定变为 revoking（原因
        channel_disabled，版本加一，各发布一条 channels.binding.changed.v1），此后不再投递、不再签发免登，消息改投站内。
        提交后逐个同步撤销免登会话，失败的由事件与定时重试送达。已投递的消息不撤回。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *idempotency
      - *installationID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: 已停用的安装
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Installation'
        default: *problem
  /v1/channels/bindings:
    get:
      operationId: listBindings
      summary: 列出渠道绑定（ListBindings）
      description: >-
        管理员（can_manage_members）看到本租户全部绑定，其他成员只看到本人的绑定；均不要求强认证。按创建时间倒序（同一时间按标识倒序）
        分页，每页至多 limit 条（默认且至多500）；还有更早的绑定时 truncated 为 true 并给出 next_cursor（须带相同的 state 过滤，
        只在签发它的租户与调用者内有效，否则 400 invalid_cursor）。revoking 即“解绑处理中”。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - name: state
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/BindingState'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 500
      - name: cursor
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/BindingCursor'
      responses:
        '200':
          description: 绑定列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingList'
        default: *problem
  /v1/channels/bindings:prepare:
    post:
      operationId: prepareBinding
      summary: 打开绑定链接并固定会话（BindAccount 第一步）
      description: >-
        成员在渠道内置浏览器中登录后调用。依次核验：带渠道网页授权码（缺少时 400 channel_browser_required，提示在企业微信中打开）；
        经渠道网页授权取得当前渠道账号（渠道网页授权不可用时 503 channel_oauth_unavailable，授权码无效时 401 channel_oauth_invalid）；
        该账号所在企业是本租户已安装且未停用的企业（否则 403 channel_tenant_mismatch）；链接存在（404 binding_link_not_found）、
        未作废（410 binding_link_voided）、未完成（410 binding_link_used）、未过期（10分钟，410 binding_link_expired）；
        当前渠道账号与链接记录的渠道账号一致（否则 403 channel_identity_mismatch，链接作废）。首次调用把请求固定到本次 Web 会话
        （令牌的 sid）与成员；已固定到其他会话或成员时 409 binding_session_mismatch（链接作废）。返回确认页内容与内容摘要
        confirmation，确认时须原样提交。
      x-timeout-ms: 5000
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindingLinkRequest'
      responses:
        '200':
          description: 确认页内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingPreview'
        default: *problem
  /v1/channels/bindings:confirm:
    post:
      operationId: confirmBinding
      summary: 确认绑定（BindAccount）
      description: >-
        核验同 prepareBinding（未经 prepare 时在此固定会话），另须 confirmation 与固定后的请求内容一致（409 binding_request_changed）。
        通过后在一个事务中写入绑定（状态 bound，版本1，新的绑定标识）并作废链接，发布 channels.binding.changed.v1，提交后在渠道内发送
        “绑定成功”。渠道账号已绑定其他成员时 409 channel_account_already_bound，成员在该渠道已绑定其他账号时 409 member_already_bound。
        已完成的链接：同一固定会话、同一成员、同一渠道账号、同一 confirmation 的重试返回首次结果（outcome already_bound），
        不新建绑定、不再通知；绑定已不再是 bound 时、或其他会话、其他渠道账号、内容改变的请求一律 410 binding_link_used，不产生绑定或通知。
      x-timeout-ms: 5000
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmBindingRequest'
      responses:
        '200':
          description: 绑定结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingConfirmation'
        default: *problem
  /v1/channels/bindings/{bindingID}/unbind:
    post:
      operationId: unbindAccount
      summary: 解绑（UnbindAccount）
      description: >-
        绑定的成员本人可解绑（不要求强认证）；其他调用者须为管理员 + 强认证并给出原因（强制解绑，缺原因 400 reason_required）。
        其他租户的与不存在的绑定都返回 404 binding_not_found。按 expected_version 并发控制；绑定须为 bound（否则 409 binding_not_bound）。
        提交后绑定立即为 revoking（版本加一），新的免登在 channels 处即被拒绝；随后同步调用 identity 撤销，失败时经事件与定时重试。
        identity 确认撤销且最后一张签发凭据过期（加5秒）后，绑定变为 invalidated。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *idempotency
      - name: bindingID
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/BindingID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnbindRequest'
      responses:
        '200':
          description: 解绑后的绑定（revoking，或撤销已确认且凭据已过期时 invalidated）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Binding'
        default: *problem
  /v1/channels/card-links:open:
    post:
      operationId: openCardLink
      summary: 打开卡片详情链接（F7）
      description: >-
        以当前登录成员打开卡片上的短时授权链接，链接只指向对象，不携带登录身份。链接不存在、属于其他租户、对象不存在或当前成员
        无权查看（identity Check can_view）时，统一为 404 content_unavailable，响应不含标题、归属、组织单元或负责人；
        链接发给的是另一成员时 409 account_mismatch（recipient 给出链接的收件人），不切换账号；链接过期时 410 card_link_expired。
      x-timeout-ms: 5000
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenCardLinkRequest'
      responses:
        '200':
          description: 可打开的对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTarget'
        default: *problem
  /v1/channels/briefing-preferences:
    get:
      operationId: getBriefingPreferences
      summary: 本人的简报偏好（GetPreferences）
      description: >-
        有效成员读取本人的简报偏好；从未保存时返回缺省值（version 0）：工作日 07:30、租户时区 Asia/Shanghai、安静时段 21:00–07:00、
        空简报不推送、各目标区条数取应用领域包的缺省值。effective_from 为当前版本开始生效的周期起点（修改从下一期生效）。
      x-timeout-ms: 5000
      x-idempotent: true
      responses:
        '200':
          description: 偏好
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefingPreferences'
        default: *problem
    put:
      operationId: updateBriefingPreferences
      summary: 修改本人的简报偏好（UpdatePreferences）
      description: >-
        按 expected_version 并发控制（从未保存时为 0；不一致时 409 version_conflict，即“偏好已在其他设备修改”）。发送时间为 06:00–10:00
        的整点或半点；时区为 IANA 时区名；发送日为 1（周一）–7（周日）的非空集合；安静时段为整点或半点；各目标区条数须在应用领域包
        声明的范围内（A02 为 5–20），否则 422 invalid_preferences。新版本从“修改时所在周期”的下一期生效：effective_from 为旧偏好下
        修改时刻之后的第一个计划发送时间，新旧周期首尾相接。写入偏好版本与审计。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *idempotency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBriefingPreferencesRequest'
      responses:
        '200':
          description: 新的偏好版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefingPreferences'
        default: *problem
  /v1/channels/briefings:
    get:
      operationId: listBriefings
      summary: 本人的简报历史（ListBriefings）
      description: >-
        只列出调用者本人的简报，按周期终点新到旧；每页至多 limit 条（默认且至多 30）。还有更早的简报时给出 next_cursor：游标是 channels
        签发的不透明值（整个位置载荷连同其 HMAC-SHA256 签名，绑定租户与调用者），签名不符或绑定不一致时 400 invalid_cursor，
        在任何读取之前判断。每期显示周期、组装时间、各区条目数与推送状态。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 30
          default: 30
      - name: cursor
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/BriefingCursor'
      responses:
        '200':
          description: 简报历史
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefingList'
        default: *problem
  /v1/channels/briefings/{briefingID}:
    get:
      operationId: getBriefing
      summary: 完整简报（GetBriefing）
      description: >-
        只属本人：他人的、其他租户的与不存在的简报同为 404 briefing_not_found（管理员也看不到他人的简报内容）。条目内容为组装时的快照
        （content_as_of 为组装时间）；每条的当前处理状态经 detection 以调用者的权限读取，按“当前”叠加（status_as_of）。读取时逐区
        再检查 can_view_signals：已失去访问的区 state 为 no_permission，不返回条目与标题；授权不可用时 503。
      x-timeout-ms: 10000
      x-idempotent: true
      parameters:
      - &briefingID
        name: briefingID
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/BriefingID'
      responses:
        '200':
          description: 完整简报
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Briefing'
        default: *problem
  /v1/channels/briefings/{briefingID}/resend:
    post:
      operationId: resendBriefing
      summary: 重新推送到企业微信（ResendBriefing）
      description: >-
        本人对当日一期（周期终点在成员时区的今天）发起新的投递，不重新组装简报；往期为 409 resend_not_allowed。推送前按当前状态再检查：
        成员有效、绑定为“已绑定”（否则 409 not_bound）、各目标的 can_view_signals（失去访问的区不发送）。新卡片使用新的动作令牌，
        新令牌上的点击是新的操作。同一 Idempotency-Key 重放返回首次的投递。写入审计。
      x-timeout-ms: 10000
      x-idempotent: true
      parameters:
      - *idempotency
      - *briefingID
      responses:
        '200':
          description: 新的投递
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliverySummary'
        default: *problem
  /v1/channels/briefing-links:open:
    post:
      operationId: openBriefingLink
      summary: 打开简报或卡片上的链接（F6）
      description: >-
        链接只指向对象（信号、完整简报、审批），不携带登录身份，7 天有效。以当前登录成员打开：链接发给的是另一成员时 409 account_mismatch
        （不切换账号）；过期时 410 card_link_expired（登录后按当前权限打开同一对象）；链接不存在、属于其他租户、对象不存在或当前成员
        无权查看时统一为 404 content_unavailable，不返回标题、目标归属或负责人。授权按对象所有者：信号经 detection（所属目标的
        can_view_signals），审批经 identity（申请人或批准人），简报为本人。打开后的页面按第4段计量对象查看，链接本身不计量。
      x-timeout-ms: 5000
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenCardLinkRequest'
      responses:
        '200':
          description: 可打开的对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefingLinkTarget'
        default: *problem
  /v1/channels/delivery-stats:
    get:
      operationId: getDeliveryStats
      summary: 投递统计（设置 / 渠道）
      description: >-
        需要 can_manage_members（不要求强认证）。按投递状态与失败原因统计本租户 since 起（默认 7 天内）的投递次数与空简报、部分简报期数，
        不含任何简报条目、标题或收件人。0.4.0：notices 为渠道通知（任务提醒卡片与授权被拒通知，每个收件人一条；转给决策者的提醒按展开后的
        各条计）按种类、状态与原因的计数；原因按状态白名单（不在白名单内的记为 other），不含收件人、跟进、任务或标题。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - name: since
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: 投递统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryStats'
        default: *problem
components:
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          description: 稳定错误代码
        recipient:
          type: string
          description: 仅 account_mismatch：链接的收件人（成员标识）
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
    ChannelKind:
      type: string
      description: 渠道；首批只有企业微信
      enum:
      - wecom
    InstallationID:
      type: string
      description: 渠道安装标识 chi_<ULID>（contracts/identifiers.yaml）
      pattern: ^chi_[0-9A-HJKMNP-TV-Z]{26}$
    BindingID:
      type: string
      description: 渠道绑定标识 chb_<ULID>；重新绑定产生新的标识
      pattern: ^chb_[0-9A-HJKMNP-TV-Z]{26}$
    InstallationState:
      type: string
      description: >-
        authorizing 等待渠道官方授权回调；pending_verification 待验证（管理员本人绑定后确认）；enabled 已启用；disabled 已停用。
        渠道健康检测置位的“异常”尚未实现。
      enum:
      - authorizing
      - pending_verification
      - enabled
      - disabled
    Installation:
      type: object
      additionalProperties: false
      required:
      - id
      - channel
      - state
      - version
      - bound_count
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/InstallationID'
        channel:
          $ref: '#/components/schemas/ChannelKind'
        state:
          $ref: '#/components/schemas/InstallationState'
        version:
          type: integer
          format: int64
          minimum: 1
        corp_id:
          type: string
          description: 安装所属的企业（授权回调后登记）
          pattern: ^[A-Za-z0-9_-]{1,64}$
        corp_name:
          type: string
          maxLength: 120
        bound_count:
          type: integer
          minimum: 0
        rejected_callbacks:
          type: integer
          minimum: 0
          description: 被拒绝的回调数（验签失败、重放、超出时间窗），计入渠道健康
        created_at:
          type: string
          format: date-time
        verified_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
    InstallationList:
      type: object
      additionalProperties: false
      required:
      - installations
      properties:
        installations:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/Installation'
    InstallChannelRequest:
      type: object
      additionalProperties: false
      required:
      - channel
      properties:
        channel:
          $ref: '#/components/schemas/ChannelKind'
    InstallationStarted:
      type: object
      additionalProperties: false
      required:
      - installation
      properties:
        installation:
          $ref: '#/components/schemas/Installation'
        authorize_url:
          type: string
          format: uri
          description: 渠道官方授权页地址（带一次性 state，channels 只保存 state 的摘要），只在首次响应中返回；同一 Idempotency-Key 的重放不含该字段，须以新的键重新开始安装
    VersionRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
    BindingState:
      type: string
      description: bound 已绑定；revoking 失效中（界面“解绑处理中”）；invalidated 已失效（撤销已确认且最后一张签发凭据已过期）
      enum:
      - bound
      - revoking
      - invalidated
    BindingReason:
      type: string
      description: 失效原因：member_unbind 本人解绑；admin_unbind 管理员强制解绑；member_left 成员停用或退出；channel_disabled 渠道停用
      enum:
      - member_unbind
      - admin_unbind
      - member_left
      - channel_disabled
    Binding:
      type: object
      additionalProperties: false
      required:
      - id
      - channel
      - installation_id
      - subject
      - corp_id
      - channel_user_id
      - state
      - version
      - bound_at
      properties:
        id:
          $ref: '#/components/schemas/BindingID'
        channel:
          $ref: '#/components/schemas/ChannelKind'
        installation_id:
          $ref: '#/components/schemas/InstallationID'
        subject:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
        corp_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        channel_user_id:
          type: string
          pattern: ^[A-Za-z0-9_.@-]{1,64}$
        display_name:
          type: string
          maxLength: 120
          description: 渠道账号显示名；不可得时缺省
        state:
          $ref: '#/components/schemas/BindingState'
        version:
          type: integer
          format: int64
          minimum: 1
        reason:
          $ref: '#/components/schemas/BindingReason'
        note:
          type: string
          maxLength: 200
          description: 管理员强制解绑时记录的原因
        bound_at:
          type: string
          format: date-time
        revoking_at:
          type: string
          format: date-time
        invalidated_at:
          type: string
          format: date-time
    BindingCursor:
      type: string
      description: 不透明的翻页游标（base64url），由 BindingList.next_cursor 给出
      pattern: ^[A-Za-z0-9_-]{1,256}$
    BindingList:
      type: object
      additionalProperties: false
      required:
      - bindings
      - truncated
      properties:
        bindings:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Binding'
        truncated:
          type: boolean
        next_cursor:
          $ref: '#/components/schemas/BindingCursor'
    LinkToken:
      type: string
      description: 一次性链接令牌（43位 base64url），channels 只保存其摘要
      pattern: ^[A-Za-z0-9_-]{43}$
    OAuthCode:
      type: string
      description: 渠道网页授权码（只在渠道内置浏览器中取得）
      pattern: ^[A-Za-z0-9_-]{1,256}$
    BindingLinkRequest:
      type: object
      additionalProperties: false
      required:
      - link_token
      properties:
        link_token:
          $ref: '#/components/schemas/LinkToken'
        oauth_code:
          $ref: '#/components/schemas/OAuthCode'
    Confirmation:
      type: string
      description: 绑定请求内容摘要（请求、渠道账号、成员与固定的会话）
      pattern: ^[0-9a-f]{64}$
    BindingPreview:
      type: object
      additionalProperties: false
      required:
      - channel
      - corp_id
      - channel_user_id
      - subject
      - expires_at
      - confirmation
      properties:
        channel:
          $ref: '#/components/schemas/ChannelKind'
        corp_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        corp_name:
          type: string
          maxLength: 120
        channel_user_id:
          type: string
          pattern: ^[A-Za-z0-9_.@-]{1,64}$
        display_name:
          type: string
          maxLength: 120
        subject:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
        expires_at:
          type: string
          format: date-time
        confirmation:
          $ref: '#/components/schemas/Confirmation'
    ConfirmBindingRequest:
      type: object
      additionalProperties: false
      required:
      - link_token
      - confirmation
      properties:
        link_token:
          $ref: '#/components/schemas/LinkToken'
        oauth_code:
          $ref: '#/components/schemas/OAuthCode'
        confirmation:
          $ref: '#/components/schemas/Confirmation'
    BindingConfirmation:
      type: object
      additionalProperties: false
      required:
      - binding
      - outcome
      properties:
        binding:
          $ref: '#/components/schemas/Binding'
        outcome:
          type: string
          description: bound 本次绑定；already_bound 同一请求此前已完成（返回首次结果，不再通知）
          enum:
          - bound
          - already_bound
    UnbindRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: 强制解绑的原因（管理员必填）
    OpenCardLinkRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          $ref: '#/components/schemas/LinkToken'
    CardTarget:
      type: object
      additionalProperties: false
      required:
      - object
      properties:
        object:
          type: string
          description: 链接指向的对象；客户端按对象所有者的接口读取，读取时仍按当前成员权限判断
          pattern: ^(objective:obj|pursuit:pur|research_case:rsc)_[0-9A-HJKMNP-TV-Z]{26}$
    BriefingID:
      type: string
      description: 简报标识 brf_<ULID>
      pattern: ^brf_[0-9A-HJKMNP-TV-Z]{26}$
    DeliveryID:
      type: string
      description: 投递标识 dlv_<ULID>
      pattern: ^dlv_[0-9A-HJKMNP-TV-Z]{26}$
    ClockTime:
      type: string
      description: 当地时间 HH:MM
      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    SectionLimit:
      type: object
      additionalProperties: false
      required:
      - objective_code
      - limit
      properties:
        objective_code:
          type: string
          pattern: ^APP-[A-Z0-9-]{1,32}\.[A-Z0-9]{1,8}$
        limit:
          type: integer
          minimum: 1
          maximum: 50
    BriefingPreferences:
      type: object
      additionalProperties: false
      required:
      - version
      - send_time
      - timezone
      - send_days
      - quiet_start
      - quiet_end
      - push_empty
      - section_limits
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          description: 偏好版本；0 为从未保存（缺省值）
        send_time:
          $ref: '#/components/schemas/ClockTime'
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+-]+){0,2}$
        send_days:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
        quiet_start:
          $ref: '#/components/schemas/ClockTime'
        quiet_end:
          $ref: '#/components/schemas/ClockTime'
        push_empty:
          type: boolean
        section_limits:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/SectionLimit'
        effective_from:
          type: string
          format: date-time
          description: 本版本开始生效的周期起点（缺省值不出现）
        updated_at:
          type: string
          format: date-time
    UpdateBriefingPreferencesRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - send_time
      - timezone
      - send_days
      - quiet_start
      - quiet_end
      - push_empty
      - section_limits
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 0
        send_time:
          $ref: '#/components/schemas/ClockTime'
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z_]+(/[A-Za-z0-9_+-]+){0,2}$
        send_days:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
        quiet_start:
          $ref: '#/components/schemas/ClockTime'
        quiet_end:
          $ref: '#/components/schemas/ClockTime'
        push_empty:
          type: boolean
        section_limits:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/SectionLimit'
    Period:
      type: object
      additionalProperties: false
      description: 简报周期 [start, end)，带成员时区的偏移；timezone 为成员时区
      required:
      - start
      - end
      - timezone
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        timezone:
          type: string
          maxLength: 64
    NoticeKind:
      type: string
      description: 渠道通知的种类：task_due 任务提醒卡片；authorization_rejected 授权被拒时给操作者的通知（0.4.0）
      enum:
      - task_due
      - authorization_rejected
    NoticeState:
      type: string
      description: >-
        pending 待发送（含安静时段延后）；retrying 发送失败、等待退避重试；delivered 渠道已接受；in_app 未绑定或重试时限内仍未送达，
        留在 Web 与站内；cancelled 发送前以收件人本人再检查时取消（0.4.0）
      enum:
      - pending
      - retrying
      - delivered
      - in_app
      - cancelled
    NoticeReason:
      type: string
      description: >-
        按状态白名单：retrying 为 channel_error；in_app 为 not_bound、cutoff；cancelled 为 member_inactive、task_not_visible、
        task_closed、superseded、reassigned、pursuit_not_visible；不在白名单内的为 other；pending 与 delivered 不带原因（0.4.0）
      enum:
      - channel_error
      - not_bound
      - cutoff
      - member_inactive
      - task_not_visible
      - task_closed
      - superseded
      - reassigned
      - pursuit_not_visible
      - other
    DeliveryState:
      type: string
      description: >-
        pending 待发送（含安静时段延后）；retrying 推送失败、等待退避重试；delivered 渠道已接受；in_app 重试截止后仍失败，已在站内；
        cancelled 发送前再检查时取消（成员已退出或绑定已失效），只留在 Web 历史
      enum:
      - pending
      - retrying
      - delivered
      - in_app
      - cancelled
    DeliverySummary:
      type: object
      additionalProperties: false
      required:
      - id
      - briefing_id
      - kind
      - state
      - attempts
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/DeliveryID'
        briefing_id:
          $ref: '#/components/schemas/BriefingID'
        kind:
          type: string
          enum:
          - briefing
          - resend
        state:
          $ref: '#/components/schemas/DeliveryState'
        attempts:
          type: integer
          minimum: 0
        reason:
          type: string
          description: 失败或取消的原因
          enum:
          - channel_error
          - cutoff
          - member_inactive
          - binding_inactive
          - channel_not_enabled
        created_at:
          type: string
          format: date-time
        submitted_at:
          type: string
          format: date-time
          description: 最近一次平台提交
        accepted_at:
          type: string
          format: date-time
          description: 渠道接受（全部消息）
        read_receipts:
          type: string
          description: 渠道不提供已读回执（以打开或动作近似，标明近似）
          enum:
          - unsupported
    PushState:
      type: string
      description: >-
        delivered 已送达（渠道已接受）；pushing 投递中；in_app 推送失败，已在站内；not_pushed 未推送（empty 空简报且偏好不推送，
        not_bound 成员无有效绑定，late 组装晚于当日 12:00）
      enum:
      - delivered
      - pushing
      - in_app
      - not_pushed
    BriefingSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - period
      - assembled_at
      - scheduled_at
      - delayed
      - empty
      - partial
      - item_count
      - push_state
      properties:
        id:
          $ref: '#/components/schemas/BriefingID'
        period:
          $ref: '#/components/schemas/Period'
        assembled_at:
          type: string
          format: date-time
        scheduled_at:
          type: string
          format: date-time
          description: 计划发送时间（周期终点）
        delayed:
          type: boolean
          description: 组装晚于计划时间（推送标“延迟发送（原定 07:30）”）
        empty:
          type: boolean
        partial:
          type: boolean
          description: 有区来源中断或暂不可用
        item_count:
          type: integer
          minimum: 0
        push_state:
          $ref: '#/components/schemas/PushState'
        not_pushed_reason:
          type: string
          enum:
          - empty
          - not_bound
          - late
    BriefingCursor:
      type: string
      description: 不透明的翻页游标（channels 签发，整个载荷连同 HMAC 签名）
      pattern: ^[A-Za-z0-9_-]{1,512}$
    BriefingList:
      type: object
      additionalProperties: false
      required:
      - briefings
      properties:
        briefings:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/BriefingSummary'
        next_cursor:
          $ref: '#/components/schemas/BriefingCursor'
    DisplayLevel:
      type: string
      description: 字段按来源权利逐维取最严格后的展示级别（数据架构第12节）
      enum:
      - full_text
      - excerpt
      - citation_only
      - none
    DisplayField:
      type: object
      additionalProperties: false
      description: >-
        一个来源字段：value 只在展示级别为 full_text 或 excerpt 时出现（excerpt 为截断后的摘录）；citation_only 只给 source_url（“见原文”）；
        none 两者都没有。state 为 known 已知、undisclosed 未公布（金额）、unknown 未能可靠识别。
      required:
      - level
      - state
      properties:
        level:
          $ref: '#/components/schemas/DisplayLevel'
        state:
          type: string
          enum:
          - known
          - undisclosed
          - unknown
        value:
          type: string
          maxLength: 500
        source_url:
          type: string
          format: uri
    ItemUpdate:
      type: object
      additionalProperties: false
      required:
      - recorded_at
      - changed_fields
      - disposition_before
      - disposition_after
      - content_version
      properties:
        recorded_at:
          type: string
          format: date-time
        changed_fields:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 128
        disposition_before:
          type: string
          maxLength: 32
        disposition_after:
          type: string
          maxLength: 32
        content_version:
          type: integer
          format: int64
          minimum: 1
    ItemStatus:
      type: object
      additionalProperties: false
      description: 当前处理状态（叠加，时间轴为“当前”，status_as_of 为读取时间）；查看者已不能查看该信号时不出现
      required:
      - status
      - status_as_of
      properties:
        status:
          type: string
          enum:
          - open
          - triaged
          - converted
          - dismissed
          - closed
        handled_by:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
        handled_at:
          type: string
          format: date-time
        content_updated:
          type: boolean
          description: 组装后信号内容已更新（打开时提示“信号已更新”）
        status_as_of:
          type: string
          format: date-time
    BriefingItem:
      type: object
      additionalProperties: false
      description: >-
        区内的一条（组装时的快照）。kind：signal 完整条目；reference 同一采购项目已在靠前的区完整展示，本区为引用行（打开的仍是本目标
        自己的信号）；approval “待我处理”中的审批（只有标题、提交时间与链接，不在渠道内操作）；task “待我处理”中的跟进任务
        （分派给本人、未完成、截止在下一期简报之前或已逾期；escalated 为无有效负责人的跟进转给决策者的任务；0.3.0）。
      required:
      - kind
      - position
      properties:
        kind:
          type: string
          enum:
          - signal
          - reference
          - approval
          - task
        position:
          type: integer
          minimum: 0
        signal_id:
          type: string
          pattern: ^sig_[0-9A-HJKMNP-TV-Z]{26}$
        content_version:
          type: integer
          format: int64
          minimum: 0
        category:
          type: string
          enum:
          - new
          - updated
        correction:
          type: boolean
        score:
          type: integer
        disposition:
          type: string
          maxLength: 32
        project:
          $ref: '#/components/schemas/DisplayField'
        winner:
          $ref: '#/components/schemas/DisplayField'
        amount:
          $ref: '#/components/schemas/DisplayField'
        region:
          $ref: '#/components/schemas/DisplayField'
        categories:
          $ref: '#/components/schemas/DisplayField'
        reasons:
          type: array
          maxItems: 2
          items:
            type: string
            maxLength: 500
        unknown_count:
          type: integer
          minimum: 0
        same_lot_count:
          type: integer
          minimum: 1
        discovered_at:
          type: string
          format: date-time
          description: 发现时间（信号写入时间 created_at，不是求值时间）
        updates:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ItemUpdate'
        also_matched:
          type: array
          maxItems: 8
          items:
            type: string
            pattern: ^APP-[A-Z0-9-]{1,32}\.[A-Z0-9]{1,8}$
        references:
          type: string
          description: 引用行指向的、完整展示该采购项目的区（目标编号）
          pattern: ^APP-[A-Z0-9-]{1,32}\.[A-Z0-9]{1,8}$
        approval_id:
          type: string
          pattern: ^apr_[0-9A-HJKMNP-TV-Z]{26}$
        approval_type:
          type: string
          maxLength: 64
        submitted_at:
          type: string
          format: date-time
        task_id:
          type: string
          pattern: ^tsk_[0-9A-HJKMNP-TV-Z]{26}$
        pursuit_id:
          type: string
          pattern: ^pur_[0-9A-HJKMNP-TV-Z]{26}$
        objective_id:
          type: string
          pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
        task_title:
          type: string
          maxLength: 120
        due:
          $ref: '#/components/schemas/TaskDue'
        escalated:
          type: boolean
        current:
          $ref: '#/components/schemas/ItemStatus'
        task_current:
          $ref: '#/components/schemas/TaskItemStatus'
    TaskDue:
      type: object
      additionalProperties: false
      description: 任务截止的所填值、精度（day 只到日，minute 精确到分钟）与时区（IANA），只到日的不补成时刻
      required:
      - value
      - precision
      - timezone
      properties:
        value:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2})?$
        precision:
          type: string
          enum:
          - day
          - minute
        timezone:
          type: string
          minLength: 1
          maxLength: 64
    TaskItemStatus:
      type: object
      additionalProperties: false
      description: >-
        任务的当前状态（叠加，时间轴为“当前”，status_as_of 为读取时间）：todo 仍待本人处理；done 已完成；cancelled 已取消；
        reassigned 已不由本人处理（改派或负责人恢复）；pursuit_closed 跟进已关闭。查看者已不能查看该任务时整条不返回。
      required:
      - status
      - status_as_of
      properties:
        status:
          type: string
          enum:
          - todo
          - done
          - cancelled
          - reassigned
          - pursuit_closed
        status_as_of:
          type: string
          format: date-time
    DataAsOf:
      type: object
      additionalProperties: false
      required:
      - domain
      - state
      properties:
        domain:
          type: string
          pattern: ^INF-[A-Z0-9-]{1,32}$
        state:
          type: string
          description: current 正常；interrupted 来源中断；unknown 覆盖信息不可得（不以“正常”代替）
          enum:
          - current
          - interrupted
          - unknown
        as_of:
          type: string
          format: date-time
    BriefingSection:
      type: object
      additionalProperties: false
      description: >-
        一区。kind objective 为一个目标；pending 为“待我处理”（审批与跟进任务）。state：normal 正常；empty 无新信号；source_interrupted 来源中断（条目照常，
        恢复后补齐的信号进入下一期）；unavailable 暂不可用（本期没能取数，窗口顺延到下一期）；objective_inactive 目标未激活；
        no_permission 读取时已失去访问（不返回条目与标题）。window 为覆盖窗口 [start, end)，includes_previous 为含上一期未能生成的部分。
      required:
      - kind
      - order
      - state
      - items
      properties:
        kind:
          type: string
          enum:
          - objective
          - pending
        order:
          type: integer
          minimum: 0
        objective_id:
          type: string
          pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
        objective_code:
          type: string
          pattern: ^APP-[A-Z0-9-]{1,32}\.[A-Z0-9]{1,8}$
        title:
          type: string
          maxLength: 64
        state:
          type: string
          enum:
          - normal
          - empty
          - source_interrupted
          - unavailable
          - objective_inactive
          - no_permission
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        includes_previous:
          type: boolean
        new_count:
          type: integer
          minimum: 0
        updated_count:
          type: integer
          minimum: 0
        handled_count:
          type: integer
          minimum: 0
        backfill_count:
          type: integer
          minimum: 0
        overflow_count:
          type: integer
          minimum: 0
          description: 超出每区条数的条目数（“另有 N 条，在收件箱查看”）
        quota:
          type: integer
          minimum: 0
        data_as_of:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/DataAsOf'
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/BriefingItem'
    Briefing:
      type: object
      additionalProperties: false
      required:
      - id
      - source
      - period
      - assembled_at
      - scheduled_at
      - delayed
      - empty
      - partial
      - rule_version
      - preference_version
      - content_as_of
      - sections
      - deliveries
      properties:
        id:
          $ref: '#/components/schemas/BriefingID'
        source:
          type: string
          description: 简报来源（日常简报定义，如 BRF-TENDER-DAILY）
          pattern: ^BRF-[A-Z0-9-]{1,64}$
        period:
          $ref: '#/components/schemas/Period'
        assembled_at:
          type: string
          format: date-time
        scheduled_at:
          type: string
          format: date-time
        delayed:
          type: boolean
        empty:
          type: boolean
        partial:
          type: boolean
        rule_version:
          type: string
          maxLength: 64
        preference_version:
          type: integer
          format: int64
          minimum: 0
        content_as_of:
          type: string
          format: date-time
          description: 条目内容的时间轴：组装时
        status_as_of:
          type: string
          format: date-time
          description: 当前处理状态的时间轴：读取时
        sections:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/BriefingSection'
        deliveries:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/DeliverySummary'
    BriefingLinkTarget:
      type: object
      additionalProperties: false
      required:
      - kind
      - id
      properties:
        kind:
          type: string
          enum:
          - signal
          - briefing
          - approval
        id:
          type: string
          pattern: ^(sig|brf|apr)_[0-9A-HJKMNP-TV-Z]{26}$
        from_signal:
          type: boolean
          description: 从信号打开（第4段对象页带“来自信号”上下文）
    DeliveryStats:
      type: object
      additionalProperties: false
      required:
      - since
      - deliveries
      - empty_briefings
      - partial_briefings
      properties:
        since:
          type: string
          format: date-time
        deliveries:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required:
            - state
            - count
            properties:
              state:
                $ref: '#/components/schemas/DeliveryState'
              reason:
                type: string
                maxLength: 64
              count:
                type: integer
                minimum: 0
        empty_briefings:
          type: integer
          minimum: 0
        partial_briefings:
          type: integer
          minimum: 0
        notices:
          type: array
          maxItems: 64
          description: 渠道通知的计数（0.4.0）；服务端总是返回，没有通知时为空数组
          items:
            type: object
            additionalProperties: false
            required:
            - kind
            - state
            - count
            properties:
              kind:
                $ref: '#/components/schemas/NoticeKind'
              state:
                $ref: '#/components/schemas/NoticeState'
              reason:
                $ref: '#/components/schemas/NoticeReason'
              count:
                type: integer
                minimum: 0
