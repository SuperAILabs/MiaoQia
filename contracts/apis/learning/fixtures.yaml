    code: simulation_not_found
  cases:
  - name: 非错误HTTP状态
    valid: false
    patch:
    - op: replace
      path: /status
      value: 200
- schema: SimulationID
  base: sim_01JA8ZXXXXXXXXXXXXXXXXXXX1
