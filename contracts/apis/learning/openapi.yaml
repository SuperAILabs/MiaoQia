openapi: 3.1.0
info:
  title: learning 接口
  version: 0.4.0
  description: >-
    策略仿真（PRD 第7段 F3，docs/01-product/prd/07-policy-simulation-approval.md；规格见 docs/03-architecture/subsystems/learning.md）。
    草案：随第7段首个实现切片提交，未冻结。租户、cell 与调用主体来自请求上下文。仿真是候选变更仿真（反事实）：回答“如果当时就按这份
    草案和现在的档案运行，会产生哪些信号”，结果不是当时实际产生的信号，不进入收件箱与历史信号。数据集与信息领域服务状态经端口读取；
    生产数据集（M1 已启用来源的公共事实）与领域状态（domain-intelligence GetCoverage）适配器尚未接入，缺省“未接入”实现使仿真失败
    （dataset_unavailable / domain_status_unavailable）；测试与演示使用标明为夹具的内存数据集（inputs.dataset_fixture 为 true）。
    授权经 identity 的 Check：查看报告为目标的 can_view，发起仿真为目标的 can_draft_policy。错误为 application/problem+json 与稳定 code。
    0.2.0 起提供反馈汇总（PRD 第3段 F7）：learning 消费 detection.signal.detected.v1 与 detection.signal.triaged.v1 维护租户反馈集
    （以操作标识幂等），汇总只读、不创建草案或提案。
    0.3.0 起代表样本按查看者本人的权限过滤（PRD 第7段 F3 第5条、用例11）：每次读取（simulatePolicy 与 getSimulation 的响应）按当前
    调用者判断每条样本对应的公共事实能否查看（与对象页相同：租户上的 can_search_public，以及对象所在信息领域与区域在租户数据覆盖内），
    无权的样本不返回，只计入同一列表的 *_withheld 数量；同一运行对不同查看者可返回不同样本，保存的报告不变。权限判断不可用时
    全部样本按未返回计数，并给出提示 samples_unavailable，不当作有权。
    0.4.0 起提供跟进结果汇总（PRD 第6段 F7 第5条、用例42，C-10）：getOutcomeSummary 按 pursuit.outcome.recorded.v1 写入的本租户结果集，
    分时点评估与事后统计汇总当前结果（追加式修订按记录链取统计截至时的当前记录），只读、不生成报告记录。
servers:
- url: /internal
paths:
  /v1/learning/simulations:
    post:
      operationId: simulatePolicy
      summary: 发起或复用仿真（SimulatePolicy）
      description: >-
        需要目标的 can_draft_policy，按目标所有者 customer-context 的当前口径判断（移除参与人在其本地提交后立即撤权，不等待 identity 同步）。按（目标、草案修订、对比版本与策略代次、上下文版本、数据集版本、启用领域集合、窗口）计算输入键：
        已有相同输入的完成运行时直接返回它（相同输入的重试不重复计算）；否则同步运行并返回结果。修订未通过校验时 409 policy_invalid；
        修订不存在或目标无权查看时 404 simulation_target_not_found。草案保存后 learning 也会消费 customer_context.policy.drafted.v1 自动仿真。
      x-timeout-ms: 60000
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatePolicyRequest'
      responses:
        '200':
          description: 仿真运行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        default: &problem
          description: 失败关闭，稳定错误码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/learning/simulations/{simulationID}:
    get:
      operationId: getSimulation
      summary: 仿真报告（GetSimulationReport）
      description: >-
        需要目标的 can_view（同样按 customer-context 的当前口径）；授权或 customer-context 不可用时 503，不当作无权限；无权限、其他租户的与不存在的运行返回同一 404 simulation_not_found。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - name: simulationID
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SimulationID'
      responses:
        '200':
          description: 仿真运行与报告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        default: *problem
  /v1/learning/objectives/{objectiveID}/feedback-summary:
    get:
      operationId: getFeedbackSummary
      summary: 反馈汇总（GetFeedbackSummary）
      description: >-
        需要目标的 can_view_signals（按 customer-context 的当前口径）；不能查看目标与不存在同为 404 objective_not_found，能查看而没有
        can_view_signals 为 403 forbidden，授权不可用为 503。口径（PRD 第3段 F7 第1条）：窗口为发现时间在统计截至时间之前 30 天内的信号；
        取各成员的当前反馈（撤回的不计）；只有基于信号当前内容版本的反馈参与计数，基于更新前版本的单列（stale_feedback）。反馈率的
        分子为至少有一条当前版本相关性反馈的非排除信号数，分母为窗口内的非排除信号数；相关、不相关与分歧按信号计（同时有相关与
        不相关为分歧）；原因分布在计为不相关（排除有误）的信号中按原因标签计信号数。样本（相关 + 不相关 + 分歧）少于 20 时不给出
        比例（ratio 字段不出现），只给数量。反馈只用于评估与改进建议，不会自动修改策略。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - name: objectiveID
        in: path
        required: true
        schema:
          type: string
          pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
      responses:
        '200':
          description: 反馈汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackSummary'
        default: *problem
  /v1/learning/objectives/{objectiveID}/outcome-summary:
    get:
      operationId: getOutcomeSummary
      summary: 跟进结果汇总（评估报告的结果部分，0.4.0）
      description: >-
        需要能查看目标（customer-context 的当前口径；不能查看与不存在同为 404 objective_not_found）且在目标所在单元上能查看全部跟进
        （identity 的 org_unit#can_view_unit_pursuits；只凭参与关系查看个别跟进的成员 403 forbidden，不按聚合泄露其看不到的跟进）；
        授权不可用为 503。口径（learning.md 第8.1节）：只计记录时间不晚于 as_of（缺省为当前时间）的结果记录，每个跟进取此时记录链上的
        当前记录（被同样不晚于 as_of 的修订取代的不计，计入 superseded）；有获知时间且获知时间在 [from, as_of) 内的计入时点评估
        （point_in_time），获知时间晚于 as_of 的不计（计入 known_after_as_of）；没有获知时间的只计入事后统计（post_hoc，按记录时间在
        [from, as_of) 内）。金额按（类型、币种、取值性质）分别合计，不同类型、币种与性质不相加、不换算；贡献关系分别计数，不计算
        “妙洽带来的金额”。只用于本租户的评估。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - name: objectiveID
        in: path
        required: true
        schema:
          type: string
          pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: as_of
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: 结果汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeSummary'
        default: *problem
components:
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          description: 稳定错误代码
    SimulationID:
      type: string
      pattern: ^sim_[0-9A-HJKMNP-TV-Z]{26}$
    SimulatePolicyRequest:
      type: object
      additionalProperties: false
      required:
      - objective_id
      - revision
      properties:
        objective_id:
          type: string
          pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
        revision:
          type: integer
          format: int64
          minimum: 1
    Disposition:
      type: string
      enum:
      - no_signal
      - excluded
      - watch_signal
      - review_candidate
      - pursue_candidate
    DomainCode:
      type: string
      pattern: ^INF-[A-Z0-9]{2,16}$
    SimulationInputs:
      type: object
      additionalProperties: false
      description: >-
        报告的固定输入。purpose 恒为 counterfactual_candidate（候选变更仿真，非当时实际信号）。窗口默认近90天，可得历史不足时按实际可得截断，
        window_start/window_end 为实际覆盖起止；两侧共用同一数据集版本、上下文快照版本与逐个事件的逻辑求值时间。对比一侧为仿真时的
        生效版本（首次激活时 compare_version 为 0，没有对比一侧）。enabled_domains 为按仿真时各信息领域服务状态确定的草案启用领域集合，
        随草案保存；excluded_domains 为目标需要但未启用的领域及其状态。
      required:
      - purpose
      - dataset_version
      - dataset_fixture
      - window_days
      - window_start
      - window_end
      - context_version
      - org_unit_id
      - revision
      - template_id
      - template_version
      - generation
      - enabled_domains
      - excluded_domains
      - compare_version
      properties:
        purpose:
          type: string
          const: counterfactual_candidate
        dataset_version:
          type: string
          minLength: 1
          maxLength: 64
        dataset_fixture:
          type: boolean
          description: 为 true 时数据集是夹具（测试与演示），不是生产公共事实
        window_days:
          type: integer
          minimum: 1
          maximum: 366
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        context_version:
          type: integer
          format: int64
          minimum: 1
        org_unit_id:
          type: string
          minLength: 1
          maxLength: 64
        revision:
          type: integer
          format: int64
          minimum: 1
        template_id:
          type: string
          pattern: ^TPL-[A-Z0-9-]{1,64}$
        template_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        generation:
          type: integer
          format: int64
          minimum: 0
          description: 仿真时目标的策略代次（对比一侧的基准）
        enabled_domains:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/DomainCode'
        excluded_domains:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required:
            - domain
            - status
            properties:
              domain:
                $ref: '#/components/schemas/DomainCode'
              status:
                type: string
                enum:
                - not_live
                - unknown
        compare_version:
          type: integer
          format: int64
          minimum: 0
        compare_enabled_domains:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/DomainCode'
    DispositionCounts:
      type: object
      additionalProperties: false
      required:
      - pursue_candidate
      - review_candidate
      - watch_signal
      - excluded
      - no_signal
      properties:
        pursue_candidate:
          type: integer
          minimum: 0
        review_candidate:
          type: integer
          minimum: 0
        watch_signal:
          type: integer
          minimum: 0
        excluded:
          type: integer
          minimum: 0
        no_signal:
          type: integer
          minimum: 0
    WeeklyRates:
      type: object
      additionalProperties: false
      description: 平均每周数量（窗口实际天数折算，保留两位小数）
      required:
      - pursue_candidate
      - review_candidate
      - watch_signal
      properties:
        pursue_candidate:
          type: number
          minimum: 0
        review_candidate:
          type: number
          minimum: 0
        watch_signal:
          type: number
          minimum: 0
    SimulationSample:
      type: object
      additionalProperties: false
      description: 代表样本（公共事实）。按金额倒序、时间倒序、事实标识确定性抽样
      required:
      - fact_id
      - fact_type
      - occurred_at
      - draft
      properties:
        fact_id:
          type: string
          minLength: 1
          maxLength: 64
        fact_type:
          type: string
          pattern: ^[a-z]+\.[a-z_]+$
        occurred_at:
          type: string
          format: date-time
        title:
          type: string
          maxLength: 500
        amount_cny:
          type: integer
          format: int64
          minimum: 0
        draft:
          $ref: '#/components/schemas/Disposition'
        active:
          $ref: '#/components/schemas/Disposition'
    SimulationDiff:
      type: object
      additionalProperties: false
      description: >-
        相对生效版本的差异：added 草案产生信号（跟进候选、复核候选、观察）而生效版本没有；removed 反之；changed 两侧都产生信号但处置不同。
        排除与无信号都不算信号。各附至多20条代表样本
      required:
      - added
      - removed
      - changed
      - added_samples
      - removed_samples
      - changed_samples
      properties:
        added:
          type: integer
          minimum: 0
        removed:
          type: integer
          minimum: 0
        changed:
          type: integer
          minimum: 0
        added_samples: &samples
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/SimulationSample'
        removed_samples: *samples
        changed_samples: *samples
        added_withheld: &withheld
          type: integer
          minimum: 0
          description: 该列表中当前查看者无权查看、未返回的代表样本数
        removed_withheld: *withheld
        changed_withheld: *withheld
    UnknownReason:
      type: string
      description: >-
        规则未知的原因：data_not_connected 所需数据的信息领域未启用；below_evidence_threshold 字段证据低于模板门槛；
        not_linked 未关联本企业（档案没有我方主体）；field_missing 事实中缺少该字段
      enum:
      - data_not_connected
      - below_evidence_threshold
      - not_linked
      - field_missing
    RuleStats:
      type: object
      additionalProperties: false
      description: 草案一侧逐条规则的命中比例（在范围内被求值的事件中，三者之和为1）与未知原因计数
      required:
      - id
      - clause
      - true_ratio
      - false_ratio
      - unknown_ratio
      - unknown_reasons
      properties:
        id:
          type: string
          pattern: ^[A-Z][A-Z0-9-]{0,63}$
        clause:
          type: string
          enum:
          - require
          - exclude
          - watch
          - boost
          - penalize
        true_ratio:
          type: number
          minimum: 0
          maximum: 1
        false_ratio:
          type: number
          minimum: 0
          maximum: 1
        unknown_ratio:
          type: number
          minimum: 0
          maximum: 1
        unknown_reasons:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required:
            - reason
            - count
            properties:
              reason:
                $ref: '#/components/schemas/UnknownReason'
              count:
                type: integer
                minimum: 1
    SimulationHint:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          enum:
          - example_mismatch
          - hard_condition_disabled
          - review_majority
          - zero_results
          - coverage_insufficient
          - fact_types_not_connected
          - samples_unavailable
        detail:
          type: string
          maxLength: 2000
    SimulationReport:
      type: object
      additionalProperties: false
      required:
      - evaluated
      - distribution
      - weekly
      - rules
      - top_unknown_rules
      - hints
      properties:
        evaluated:
          type: integer
          minimum: 0
          description: 窗口内被回放的事件数
        distribution:
          $ref: '#/components/schemas/DispositionCounts'
        weekly:
          $ref: '#/components/schemas/WeeklyRates'
        compare_distribution:
          $ref: '#/components/schemas/DispositionCounts'
        diff:
          $ref: '#/components/schemas/SimulationDiff'
        samples:
          type: array
          maxItems: 20
          description: 首次激活（没有对比一侧）时草案产生信号的代表样本
          items:
            $ref: '#/components/schemas/SimulationSample'
        samples_withheld:
          type: integer
          minimum: 0
          description: samples 中当前查看者无权查看、未返回的代表样本数
        rules:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/RuleStats'
        top_unknown_rules:
          type: array
          maxItems: 5
          description: 未知比例最高的规则（未知比例为0的不列）
          items:
            type: string
            pattern: ^[A-Z][A-Z0-9-]{0,63}$
        hints:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/SimulationHint'
    SimulationRun:
      type: object
      additionalProperties: false
      required:
      - id
      - objective_id
      - revision
      - status
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/SimulationID'
        objective_id:
          type: string
          pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
        revision:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum:
          - running
          - completed
          - failed
        failure_reason:
          type: string
          enum:
          - dataset_unavailable
          - domain_status_unavailable
          - context_unavailable
          - policy_unavailable
          - timeout
        inputs:
          $ref: '#/components/schemas/SimulationInputs'
        report:
          $ref: '#/components/schemas/SimulationReport'
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    FeedbackReasonCount:
      type: object
      additionalProperties: false
      description: 一个原因标签的信号数与可能相关的规则、参数（取自应用领域包的 relates，只作提示）
      required:
      - result
      - code
      - signals
      - rules
      - params
      properties:
        result:
          type: string
          enum:
          - irrelevant
          - exclusion_wrong
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        signals:
          type: integer
          minimum: 1
        rules:
          type: array
          maxItems: 16
          items:
            type: string
            pattern: ^[RXWBP]-[A-Z0-9-]+$
        params:
          type: array
          maxItems: 16
          items:
            type: string
            pattern: ^[a-z][a-z0-9_]{0,63}$
    FeedbackSummary:
      type: object
      additionalProperties: false
      required:
      - objective_id
      - as_of
      - window_start
      - window_end
      - min_sample
      - sample
      - sample_sufficient
      - signals
      - relevance
      - stale_feedback
      - exclusions
      - reasons
      properties:
        objective_id:
          type: string
          pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
        as_of:
          type: string
          format: date-time
          description: 统计截至时间
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        last_feedback_at:
          type: string
          format: date-time
          description: 已计入的最近一次反馈的提交时间（事件处理滞后时早于最新反馈）
        min_sample:
          type: integer
          minimum: 1
        sample:
          type: integer
          minimum: 0
        sample_sufficient:
          type: boolean
        signals:
          type: object
          additionalProperties: false
          description: 窗口内的非排除信号
          required:
          - total
          - with_feedback
          - without_feedback
          properties:
            total:
              type: integer
              minimum: 0
            with_feedback:
              type: integer
              minimum: 0
            without_feedback:
              type: integer
              minimum: 0
            feedback_rate:
              type: number
              minimum: 0
              maximum: 1
        relevance:
          type: object
          additionalProperties: false
          required:
          - relevant
          - irrelevant
          - disagreement
          properties:
            relevant:
              type: integer
              minimum: 0
            irrelevant:
              type: integer
              minimum: 0
            disagreement:
              type: integer
              minimum: 0
            relevant_ratio:
              type: number
              minimum: 0
              maximum: 1
            irrelevant_ratio:
              type: number
              minimum: 0
              maximum: 1
            disagreement_ratio:
              type: number
              minimum: 0
              maximum: 1
        stale_feedback:
          type: integer
          minimum: 0
          description: 基于更新前内容版本的当前反馈条数（不计入相关、不相关与反馈率）
        exclusions:
          type: object
          additionalProperties: false
          description: 窗口内的排除信号
          required:
          - total
          - with_feedback
          - correct
          - wrong
          - disagreement
          properties:
            total:
              type: integer
              minimum: 0
            with_feedback:
              type: integer
              minimum: 0
            correct:
              type: integer
              minimum: 0
            wrong:
              type: integer
              minimum: 0
            disagreement:
              type: integer
              minimum: 0
        reasons:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/FeedbackReasonCount'
    OutcomeResultCounts:
      type: object
      additionalProperties: false
      required:
      - success
      - failure
      - abandoned
      properties:
        success:
          type: integer
          minimum: 0
        failure:
          type: integer
          minimum: 0
        abandoned:
          type: integer
          minimum: 0
    OutcomeReasonCount:
      type: object
      additionalProperties: false
      required:
      - result
      - reason_code
      - count
      properties:
        result:
          type: string
          enum:
          - success
          - failure
          - abandoned
        reason_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        count:
          type: integer
          minimum: 1
    OutcomeContributionCount:
      type: object
      additionalProperties: false
      required:
      - contribution
      - count
      properties:
        contribution:
          type: string
          enum:
          - first_alert
          - decision_basis
          - self_found
          - external_notice
          - undetermined
        count:
          type: integer
          minimum: 1
    OutcomeAmountTotal:
      type: object
      additionalProperties: false
      description: 同一金额类型、币种与取值性质的合计（十进制文本）；不同组之间不相加、不换算
      required:
      - type
      - currency
      - nature
      - total
      - count
      properties:
        type:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,63}$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        nature:
          type: string
          enum:
          - actual
          - estimate
          - customer_stated
        total:
          type: string
          pattern: ^-?[0-9]{1,24}(\.[0-9]{1,4})?$
        count:
          type: integer
          minimum: 1
    OutcomeSection:
      type: object
      additionalProperties: false
      required:
      - total
      - results
      - reasons
      - contributions
      - amounts
      properties:
        total:
          type: integer
          minimum: 0
          description: 计入本部分的跟进数（每个跟进一条当前记录）
        results:
          $ref: '#/components/schemas/OutcomeResultCounts'
        reasons:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/OutcomeReasonCount'
        contributions:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/OutcomeContributionCount'
        amounts:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/OutcomeAmountTotal'
    OutcomeSummary:
      type: object
      additionalProperties: false
      description: 跟进结果汇总（0.4.0）：时点评估与事后统计分开给出，不合并
      required:
      - objective_id
      - as_of
      - point_in_time
      - post_hoc
      - superseded
      - known_after_as_of
      properties:
        objective_id:
          type: string
          pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
        from:
          type: string
          format: date-time
        as_of:
          type: string
          format: date-time
          description: 统计截至时间（不含）
        point_in_time:
          $ref: '#/components/schemas/OutcomeSection'
        post_hoc:
          $ref: '#/components/schemas/OutcomeSection'
        superseded:
          type: integer
          minimum: 0
          description: 已被截至时间之前的修订取代、不计入的记录数
        known_after_as_of:
          type: integer
          minimum: 0
          description: 当前记录的获知时间晚于截至时间、不计入时点评估的跟进数
