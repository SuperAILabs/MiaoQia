        合成后的完整策略文档（services/kernel/policy 的 Policy 的 JSON 形式：模板 + 参数值 + 启停、权重、阈值与通知覆盖），
        结构以策略 DSL 第3节为准；接收方按 kernel/policy 编译后求值。除 id 与 version 外的字段原样传递
      additionalProperties: true
