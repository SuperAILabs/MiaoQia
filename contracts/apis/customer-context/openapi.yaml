      - state
      - template_id
      - template_version
      - form
      - rules
      - enabled_domains
      - simulation_id
      - approval_id
      - requested_by
      - approved_by
      - activated_at
      - source_revision
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        state:
          type: string
          enum:
          - active
          - superseded
        template_id:
          type: string
          pattern: ^TPL-[A-Z0-9-]{1,64}$
        template_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        form:
          $ref: '#/components/schemas/PolicyForm'
        rules:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/PolicyRule'
        enabled_domains:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/DomainCode'
        simulation_id:
          type: string
          pattern: ^sim_[0-9A-HJKMNP-TV-Z]{26}$
        approval_id:
          type: string
          pattern: ^apr_[0-9A-HJKMNP-TV-Z]{26}$
        requested_by:
          $ref: '#/components/schemas/Subject'
        approved_by:
          $ref: '#/components/schemas/Subject'
        activated_at:
          type: string
          format: date-time
          description: 首次激活的业务时间（回滚重新生效不改变它）
        source_revision:
          type: integer
          format: int64
          minimum: 1
    PolicyRequest:
      type: object
      additionalProperties: false
      description: >-
        激活或回滚申请在本子系统的执行记录（审批本身在 identity）。pending 待审批；executed 已激活或已回滚；failed 批准后执行前
        核验未通过（基准已变、草案修订不一致、目标已停用），未执行；rejected、withdrawn、expired、invalidated 未经执行关闭。
      required:
      - approval_id
      - kind
      - state
      - object_version
      - simulation_id
      - baseline_version
      - baseline_generation
      - requested_by
      properties:
        approval_id:
          type: string
          pattern: ^apr_[0-9A-HJKMNP-TV-Z]{26}$
        kind:
          type: string
          enum:
          - activation
          - rollback
        state:
          type: string
          enum:
          - pending
          - executed
          - failed
          - rejected
          - withdrawn
          - expired
          - invalidated
        object_version:
          type: integer
          format: int64
          minimum: 1
          description: 激活为草案修订号；回滚为目标版本号
        simulation_id:
          type: string
          pattern: ^sim_[0-9A-HJKMNP-TV-Z]{26}$
        baseline_version:
          type: integer
          format: int64
          minimum: 0
        baseline_generation:
          type: integer
          format: int64
          minimum: 0
        backfill_days:
          type: integer
          minimum: 0
          maximum: 30
        requested_by:
          $ref: '#/components/schemas/Subject'
        decided_by:
          $ref: '#/components/schemas/Subject'
        reason:
          type: string
          maxLength: 2000
          description: 驳回原因，或执行失败、失效的原因代码
    Policy:
      type: object
      additionalProperties: false
      required:
