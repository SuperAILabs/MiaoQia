openapi: 3.1.0
info:
  title: customer-context 接口
  version: 0.7.0
  description: >-
    客户档案、上下文版本与快照、目标配置（PRD 第2段，docs/01-product/prd/02-profile-and-objectives.md；
    规格见 docs/03-architecture/subsystems/customer-context.md）。草案：随第2段首个实现切片提交，未冻结。
    租户、cell 与调用主体来自请求上下文，不出现在业务参数中；档案与目标命令只经外部网关，
    上下文版本与快照读取经 mTLS 内部端口。组织单元为 identity 的 OrgUnit：租户根单元为保留值 root，其他单元为
    unt_<ULID>（contracts/identifiers.yaml），不属于本租户的单元返回 404 org_unit_not_found。授权经 identity 的 Check：
    目标的查看、调整与参与人管理在目标资源上判断（含仅凭参与关系的查看），参与关系由本子系统经 identity 的
    SyncResourceParticipants 同步。错误为 application/problem+json 与稳定 code。
    0.3.0 起提供策略（PRD 第7段）：策略页、草案保存与放弃、版本历史与规则级差异、激活与回滚申请（经 identity 审批，
    批准后由本子系统消费 identity.approval.decided.v1 执行），以及供 learning 读取的仿真输入（内部端口）。
    0.4.0 起（PRD 第3段）：内部端口的生效策略读取（GetActivePolicies，detection 每批求值前读取策略代次）；目标访问判断追加
    can_view_signals 与 can_feedback（detection 的信号收件箱与反馈按本子系统的口径授权）；策略状态带策略标识 pol_。
    0.5.0 起（PRD 第6段）：目标访问判断追加 can_assign（单元关系 can_assign_unit_objectives，或本地当前版本的负责人/参与人且
    identity 判断通过），响应追加目标所在单元、模板与状态（可选字段，供 pursuit 确定推进所在单元与结果原因代码）。
    0.6.0 起（PRD 第5段 F7，C-08）：生效策略读取的每个目标追加可选的负责人 owner 与参与人 participants（目标当前版本的值），
    供 channels 按策略 route 的 notify 受众（objective_owner、objective_members）确定即时通知的收件人；收件人在发送前仍以本人再检查访问。
    0.7.0 起（PRD 第6段 F1 第2条，C-14）：目标的分派规则 getAssignmentRules / updateAssignmentRules（按顺序的规则，按区域与品类匹配信号，
    选出目标的负责人或参与人作为候选负责人；分派配置版本独立于目标版本），生效策略读取的每个目标追加可选的 assignment（分派配置版本与规则），
    detection 生成信号时据此算出候选负责人写入信号。候选只是建议，不授予访问；使用方以候选本人再检查。
servers:
- url: /internal
paths:
  /v1/customer-context/profile:
    get:
      operationId: getProfile
      summary: 读取当前档案（GetProfile）
      description: 需要 can_view_profile。从未保存过档案时返回版本 0 与空内容。
      x-timeout-ms: 5000
      x-idempotent: true
      responses:
        '200':
          description: 当前档案版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        default: &problem
          description: 失败关闭，稳定错误码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      operationId: updateProfile
      summary: 保存档案（UpdateProfile）
      description: >-
        需要 can_edit_profile。整份替换档案内容并形成新的档案版本；expected_version 与当前版本不一致时返回
        409 version_conflict，不覆盖他人修改。保存在同一事务中递增租户上下文版本、写入该版本的根单元快照、
        审计与 customer_context.profile.updated.v1。同一 Idempotency-Key 重放返回首次结果，键相同而请求不同返回
        409 idempotency_conflict。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - &idempotency
        name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 新的档案版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        default: *problem
  /v1/customer-context/context-version:
    get:
      operationId: getContextVersion
      summary: 租户当前上下文版本（GetContextVersion）
      description: >-
        读主库。detection 每批求值前读取；资质有效期跨过到期日后，本调用在返回前先形成新的上下文版本
        （快照中该资质改为过期），保证返回后开始的求值不使用过期判定。调用方为用户时需要 can_view_profile；
        服务主体需要 identity 授予的 can_read_context（identity 的服务授权清单登记 detection、learning、research、assessment）。
      x-timeout-ms: 5000
      x-idempotent: true
      responses:
        '200':
          description: 当前版本；从未保存档案时为 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextVersion'
        default: *problem
  /v1/customer-context/context-snapshot:
    get:
      operationId: getContextSnapshot
      summary: 客户上下文快照（GetContextSnapshot）
      description: >-
        按（租户、组织单元、上下文版本）返回合成快照，同一键永远返回同一结果；缺省版本为当前版本。
        字段与求值语义见 contracts/schemas/intelligence/context-snapshot.schema.json（本接口的 ContextSnapshot 与之一致，测试校验）。
        授权同 getContextVersion。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - name: org_unit_id
        in: query
        required: true
        schema: &unit
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^(root|unt_[0-9A-HJKMNP-TV-Z]{26})$
      - name: context_version
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: 快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSnapshot'
        default: *problem
  /v1/customer-context/objective-templates:
    get:
      operationId: listObjectiveTemplates
      summary: 可启用目标（ListObjectiveTemplates）
      description: >-
        需要 can_view_profile。按档案的价值链角色列出 APP-TENDER 目标目录：角色模板默认与可选目标的并集可启用，
        未到开放阶段或没有策略模板的目标照常列出并给出不可启用原因；未选角色时全部不可启用。
      x-timeout-ms: 5000
      x-idempotent: true
      responses:
        '200':
          description: 目标目录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectiveTemplateList'
        default: *problem
  /v1/customer-context/objectives:
    get:
      operationId: listObjectives
      summary: 目标列表
      description: >-
        返回调用者可查看（can_view）的目标：调用者在目标所在单元（含上级继承）有 can_list_objectives（决策者、研究分析者、
        租户管理员）的目标，以及本地参与人副本中包含调用者且经 identity 判断 can_view 的目标（仅凭参与关系 ◐）。
      x-timeout-ms: 5000
      x-idempotent: true
      responses:
        '200':
          description: 目标列表（每个单元每个模板至多一个，数量有界）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectiveList'
        default: *problem
    post:
      operationId: enableObjective
      summary: 启用目标（EnableObjective）
      description: >-
        需要目标单元上的 can_create_objective。创建状态为未激活（inactive）的目标；首次激活经第7段仿真与审批，
        激活前不产生信号。同一单元同一模板只启用一次，重复启用返回 409 objective_exists 并在 detail 中给出已有目标标识。
        负责人与参与人合计不超过 50 个不同主体，超出返回 422 too_many_participants，命令不生效。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *idempotency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableObjectiveRequest'
      responses:
        '200':
          description: 新目标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Objective'
        default: *problem
  /v1/customer-context/objectives/{objectiveID}:
    get:
      operationId: getObjective
      summary: 目标详情
      description: >-
        需要 can_view；无权限与不存在同样返回 404 objective_not_found。单元上的决策者、研究分析者与管理员按目标所在单元判断；
        仅凭参与关系的查看还要求调用者是目标当前版本的负责人或参与人，移除或改派在命令提交后立即生效，不等待参与关系同步。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - &objectiveID
        name: objectiveID
        in: path
        required: true
        schema:
          type: string
          pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
      responses:
        '200':
          description: 目标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Objective'
        default: *problem
    put:
      operationId: configureObjective
      summary: 调整目标（ConfigureObjective）
      description: >-
        负责人与参与人需要 can_manage_participants，参数需要 can_edit；整份替换并带 expected_version。
        负责人与参与人合计不超过 50 个不同主体，超出返回 422 too_many_participants，命令不生效。
        参数是下一份策略草案的输入，不改变已生效的策略版本（第7段）。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *objectiveID
      - *idempotency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureObjectiveRequest'
      responses:
        '200':
          description: 调整后的目标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Objective'
        default: *problem
  /v1/customer-context/objectives/{objectiveID}/state:
    put:
      operationId: setObjectiveState
      summary: 停用或重新启用目标（DisableObjective）
      description: >-
        需要 can_edit。disabled 停用（不再产生新信号，已有信号、跟进与反馈保留）；inactive 只能从已停用重新启用，
        重新启用后须按第7段重新激活。生效（active）只由策略激活设置，本接口不接受。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *objectiveID
      - *idempotency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetObjectiveStateRequest'
      responses:
        '200':
          description: 目标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Objective'
        default: *problem
  /v1/customer-context/objectives/{objectiveID}/assignment:
    get:
      operationId: getAssignmentRules
      summary: 读取目标的分派规则（C-14）
      description: >-
        需要 can_view；无权限与不存在同样返回 404 objective_not_found。字段按调用者的级别白名单返回：能管理参与人（can_manage_participants）
        或能分派跟进（can_assign）的成员得到 view=full（规则全文、更新时间）；其他能查看目标的成员得到 view=summary（只有版本与规则条数，
        不出现规则与候选人）。从未配置时 version 为 0、rule_count 为 0、没有 updated_at（view=full 时 rules 为空数组）；已配置的版本
        从 1 开始（配置为空规则也是 1 及以上），因此“从未配置”（目标的信号记为分派规则不可用 rules_unavailable）与“已配置但规则为空”
        （信号记为没有候选 none）可以区分。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *objectiveID
      responses:
        '200':
          description: 分派规则
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentRules'
        default: *problem
    put:
      operationId: updateAssignmentRules
      summary: 替换目标的分派规则（C-14）
      description: >-
        需要 can_manage_participants 与 can_edit（目标单元的决策者，与调整负责人和参与人相同）。整份替换并带 expected_version（分派配置
        版本，从未配置时为 0），不一致返回 409 version_conflict。规则按顺序匹配，第一条命中的规则给出候选负责人；没有条件的规则匹配全部信号。
        每条规则的 assignee 须是目标当前版本的负责人或参与人（与目标在同一锁下核对），并在写入前以其本人判断仍是本租户有效成员且能查看
        该目标的信号，否则 422 assignee_no_access，不写入、不授予任何权限；区域须是有效的行政区划代码（422 invalid_region），品类须属于
        已安装行业包（422 unknown_category）。同一 Idempotency-Key 重放返回首次结果，包括首次的确定失败（4xx）；键相同而请求不同返回
        409 idempotency_conflict；暂时失败（503）不固定在键上。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *objectiveID
      - *idempotency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssignmentRulesRequest'
      responses:
        '200':
          description: 替换后的分派规则（view=full）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentRules'
        default: *problem
  /v1/customer-context/objectives/{objectiveID}/policy:
    get:
      operationId: getPolicy
      summary: 策略页（GetPolicy）
      description: >-
        需要目标的 can_view（与 GetObjective 同一口径，无权限与不存在同样 404 objective_not_found）。返回策略代次、生效版本、
        当前草案（修订、表单、逐条规则、编译与样例结果、最近一次仿真及是否过期、是否被进行中的激活申请锁定）与最近一次申请。
        草案的仿真在“草案再保存或生效版本、策略代次在仿真后变化”时标为过期（stale）。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *objectiveID
      responses:
        '200':
          description: 策略
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        default: *problem
  /v1/customer-context/objectives/{objectiveID}/policy/draft:
    put:
      operationId: draftPolicyChange
      summary: 保存策略草案（DraftPolicyChange）
      description: >-
        需要 can_draft_policy（目标所在范围的决策者，或参与本目标的业务开拓者；参与关系按本地当前负责人与参与人求交）。
        整份表单替换草案并形成新修订：expected_version 为策略页的 draft_version（每次保存或放弃加一，0 表示从未有过草案），
        不一致返回 409 version_conflict，不覆盖他人修改；草案被进行中的激活申请锁定时 409 draft_locked；目标已停用时
        409 objective_disabled。表单中未知规则 422 unknown_rule、改动锁定规则 422 rule_locked、给非加减分规则设权重
        422 invalid_weight、参数不合法按第2段参数规则 422；这些情况不保存。编译失败、drop_below 不小于 pursue_at 时草案照常保存，
        valid 为 false 并逐条给出 issues，不能仿真与申请。编译通过后运行模板样例，期望不一致的列在 example_mismatches，不阻止保存。
        每次保存发布 customer_context.policy.drafted.v1（learning 据此自动仿真）。同一 Idempotency-Key 重放返回首次结果。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *objectiveID
      - *idempotency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftPolicyRequest'
      responses:
        '200':
          description: 保存后的策略
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        default: *problem
  /v1/customer-context/objectives/{objectiveID}/policy/draft:discard:
    post:
      operationId: discardPolicyDraft
      summary: 放弃草案（DiscardPolicyDraft）
      description: >-
        需要 can_draft_policy。删除当前草案（修订保留供审计），不影响生效版本；草案被进行中的激活申请锁定时 409 draft_locked，
        没有草案时 409 no_draft，expected_version 不一致时 409 version_conflict。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *objectiveID
      - *idempotency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscardPolicyDraftRequest'
      responses:
        '200':
          description: 放弃后的策略
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        default: *problem
  /v1/customer-context/objectives/{objectiveID}/policy/versions:
    get:
      operationId: listPolicyVersions
      summary: 版本历史（ListPolicyVersions）
      description: >-
        需要 can_view。按版本号倒序分页，每页至多 limit 条（默认且至多 100）；还有更早的版本时 truncated 为 true 并给出
        next_cursor（只对同一目标有效，否则 400 invalid_cursor）。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *objectiveID
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: cursor
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PolicyCursor'
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyVersionList'
        default: *problem
  /v1/customer-context/objectives/{objectiveID}/policy/versions/{version}:
    get:
      operationId: getPolicyVersion
      summary: 读取策略版本
      description: 需要 can_view。不存在的版本 404 policy_version_not_found。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *objectiveID
      - name: version
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: 策略版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyVersion'
        default: *problem
  /v1/customer-context/objectives/{objectiveID}/policy/diff:
    get:
      operationId: diffPolicyVersions
      summary: 规则级差异（DiffPolicyVersions）
      description: >-
        需要 can_view。from 与 to 为 v<版本号> 或 draft（当前草案）；不存在时 404 policy_version_not_found / no_draft。
        给出模板版本、规则（新增、删除、启停、权重）、参数、阈值、通知与启用领域集合的差异；停用的硬条件（require）标 highlight。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *objectiveID
      - name: from
        in: query
        required: true
        schema: &policyRef
          type: string
          pattern: ^(v[1-9][0-9]{0,17}|draft)$
      - name: to
        in: query
        required: true
        schema: *policyRef
      responses:
        '200':
          description: 差异
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDiff'
        default: *problem
  /v1/customer-context/objectives/{objectiveID}/policy/activation-requests:
    post:
      operationId: requestPolicyActivation
      summary: 提交激活申请（RequestPolicyActivation）
      description: >-
        需要 can_request_activation（参与关系口径同 can_draft_policy）与15分钟内的强认证（由 identity 核对，403 mfa_required）。
        核对：目标未停用（409 objective_disabled）；草案存在、expected_version 与 revision 是当前草案（409 version_conflict）、
        已通过校验（409 draft_invalid）、未被锁定（409 draft_locked）；simulation_id 是该修订已完成的仿真（409 simulation_not_ready，
        失败的仿真同样不能用），且其对比版本与策略代次等于当前生效版本与代次（409 simulation_stale）；目标没有进行中的申请
        （409 approval_in_progress）。backfill_days 只用于首次激活（尚无生效版本），缺省为 30；非首次激活给出时 422 backfill_not_allowed。
        之后经 identity.RequestApproval 创建审批（类型 policy_activation，绑定草案修订、仿真运行与申请时的生效版本和策略代次），
        草案锁定为待审批。同一 Idempotency-Key 的重放返回首次结果，不产生第二个审批请求。草案在提交期间被他人改动时，
        已创建的审批请求随即失效（identity CloseApproval，object_changed），本次返回 409 version_conflict。
      x-timeout-ms: 10000
      x-idempotent: true
      parameters:
      - *objectiveID
      - *idempotency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPolicyActivationRequest'
      responses:
        '200':
          description: 申请
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRequest'
        default: *problem
  /v1/customer-context/objectives/{objectiveID}/policy/rollback-requests:
    post:
      operationId: requestPolicyRollback
      summary: 提交回滚申请（RequestPolicyRollback）
      description: >-
        需要 can_request_activation 与强认证。target_version 须是曾经生效过、且不是当前生效版本的版本（404 policy_version_not_found、
        409 already_active）；目标未停用；没有进行中的申请（409 approval_in_progress，含草案的激活申请）。绑定目标版本、
        该版本激活时的仿真运行与申请时的生效版本和策略代次；不绑定、不锁定草案。同一 Idempotency-Key 重放返回首次结果。
      x-timeout-ms: 10000
      x-idempotent: true
      parameters:
      - *objectiveID
      - *idempotency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPolicyRollbackRequest'
      responses:
        '200':
          description: 申请
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRequest'
        default: *problem
  /v1/customer-context/objectives/{objectiveID}/policy/simulation-input:
    get:
      operationId: getPolicySimulationInput
      summary: 仿真输入（内部）
      description: >-
        只经 mTLS 内部端口，供有 can_read_context 的服务主体（learning）读取：草案修订的合成文档与校验结果，以及读取时的
        生效版本（对比一侧，含其合成文档与启用领域集合）与策略代次。修订不存在时 404 policy_revision_not_found。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *objectiveID
      - name: revision
        in: query
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: 仿真输入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySimulationInput'
        default: *problem
  /v1/customer-context/active-policies:
    get:
      operationId: getActivePolicies
      summary: 生效策略与策略代次（内部，GetActivePolicies）
      description: >-
        只经 mTLS 内部端口，供有 can_read_context 的服务主体（detection）每批求值前读取（用户主体 403 forbidden）。读主库，
        返回本租户每个有生效版本的目标：目标状态、所在单元、策略标识、策略代次、生效版本的合成文档与固定的启用领域集合，以及
        本代次的生效时间（激活或回滚的业务时间）。激活与回滚在同一事务中写入生效版本并递增代次，因此本调用返回后开始的求值
        使用新代次（PRD 第7段第5节生效边界）；policy.activated / rolled_back 事件只用于提前刷新。只有目标状态为 active 的条目
        产生新信号：停用（disabled）与重新启用后尚未再次激活（inactive）的目标保留原生效版本，调用方不得据此求值。
        按目标标识升序分页，每页至多 limit 条（默认且至多 200）；还有更多时给出 next_cursor（游标为上一页最后一个目标标识）。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 200
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
      responses:
        '200':
          description: 生效策略
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivePolicyList'
        default: *problem
  /v1/customer-context/objectives/{objectiveID}/access:
    get:
      operationId: getObjectiveAccess
      summary: 目标访问判断（内部）
      description: >-
        只经 mTLS 内部端口，供以用户请求上下文转交的子系统（learning 的仿真接口、detection 的信号收件箱与反馈）按本子系统的口径判断用户对目标的关系：
        可经参与关系获得的权限按“单元关系，或目标当前版本的负责人/参与人且 identity 判断通过”放行，移除参与人在本地提交后立即撤权，
        不等待 identity 同步。调用者须为用户主体（否则 403 forbidden）；不能查看目标与目标不存在同样 404 objective_not_found；
        授权服务不可用为 503 identity_unavailable（失败关闭）。allowed 为 relation 中被允许的部分（总含 can_view）。
        0.5.0 起响应带目标所在单元 org_unit_id、模板 template_id 与状态 state（调用者能查看目标时才返回）。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *objectiveID
      - name: relation
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/ObjectiveRelation'
      responses:
        '200':
          description: 被允许的关系
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectiveAccess'
        default: *problem
components:
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          description: 稳定错误代码
    ObjectiveRelation:
      type: string
      description: 目标上可判断的关系（customer-context.md 第6节，口径见 objectiveRelations）
      enum:
      - can_view
      - can_edit
      - can_manage_participants
      - can_draft_policy
      - can_request_activation
      - can_view_signals
      - can_feedback
      - can_assign
    ObjectiveAccess:
      type: object
      additionalProperties: false
      required:
      - objective_id
      - allowed
      properties:
        objective_id:
          type: string
          pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
        allowed:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ObjectiveRelation'
        org_unit_id: *unit
        template_id:
          type: string
          pattern: ^APP-[A-Z0-9-]{1,32}\.[A-Z0-9]{1,8}$
        state:
          type: string
          enum:
          - inactive
          - active
          - disabled
    ProfileEntity:
      type: object
      additionalProperties: false
      description: 我方主体（集团客户的一个法人），关联公共组织 org_
      required:
      - org_id
      - qualifications_complete
      properties:
        org_id: &orgID
          type: string
          pattern: ^org_[0-9A-HJKMNP-TV-Z]{26}$
        org_unit_id: *unit
        qualifications_complete:
          type: boolean
          description: 该主体已声明“资质已录全”；未声明时未录入的资质为未知
    Qualification:
      type: object
      additionalProperties: false
      description: 客户录入的资质来源观察；同一主体、资质类型与证书编号只录一条
      required:
      - org_id
      - code
      - certificate_no
      properties:
        org_id: *orgID
        code:
          type: string
          description: 行业包资质模板代码，例如 Q-BM-ISO9001
          pattern: ^Q-[A-Z0-9-]{1,62}$
        grade:
          type: string
          minLength: 1
          maxLength: 32
        certificate_no:
          type: string
          minLength: 1
          maxLength: 64
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
          description: 有效期最后一天（含，Asia/Shanghai 日历日）；模板声明有有效期的资质必填
    ProfileContent:
      type: object
      additionalProperties: false
      required:
      - subject_type
      - entities
      - value_chain_roles
      - industry_packs
      - offering_categories
      - brands
      - service_regions
      - qualifications
      properties:
        subject_type:
          type: string
          enum:
          - organization
          description: 主体类型；M2 只支持企业
        entities:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ProfileEntity'
          description: 我方主体列表；为空表示尚未关联本企业，快照中不出现 org_ids
        value_chain_roles:
          type: array
          uniqueItems: true
          maxItems: 16
          items:
            type: string
            pattern: ^ROLE-[A-Z0-9-]{1,32}$
        industry_packs:
          type: array
          uniqueItems: true
          maxItems: 16
          items:
            type: string
            pattern: ^IND-[A-Z0-9-]{1,48}$
        offering_categories:
          type: array
          uniqueItems: true
          maxItems: 500
          items:
            type: string
            pattern: ^CAT-[A-Z0-9-]{1,60}$
        brands:
          type: array
          uniqueItems: true
          maxItems: 200
          items:
            type: string
            minLength: 1
            maxLength: 64
        service_regions:
          type: array
          uniqueItems: true
          maxItems: 500
          items:
            type: string
            pattern: ^[0-9]{6}$
        qualifications:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Qualification'
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - content
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 0
        content:
          $ref: '#/components/schemas/ProfileContent'
    Profile:
      type: object
      additionalProperties: false
      required:
      - version
      - context_version
      - content
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          description: 档案版本；0 表示从未保存
        context_version:
          type: integer
          format: int64
          minimum: 0
          description: 保存该版本时形成的租户上下文版本
        content:
          $ref: '#/components/schemas/ProfileContent'
    ContextVersion:
      type: object
      additionalProperties: false
      required:
      - context_version
      - profile_version
      properties:
        context_version:
          type: integer
          format: int64
          minimum: 0
        profile_version:
          type: integer
          format: int64
          minimum: 0
    EntityQualifications:
      type: object
      additionalProperties: false
      required:
      - qualifications
      - qualifications_pending
      - qualifications_complete
      properties:
        qualifications:
          type: object
          propertyNames:
            minLength: 1
          additionalProperties:
            type: string
            enum:
            - valid
            - expired
        qualifications_pending:
          type: array
          uniqueItems: true
          maxItems: 20
          items:
            type: string
            minLength: 1
        qualifications_complete:
          type: boolean
    ContextPolicyView:
      type: object
      additionalProperties: false
      required:
      - offering_categories
      - service_regions
      - brands
      properties:
        org_ids:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 10
          items: *orgID
        offering_categories:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        service_regions:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: ^[0-9]{6}$
        brands:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        entities:
          type: object
          minProperties: 1
          maxProperties: 10
          propertyNames:
            pattern: ^org_[0-9A-HJKMNP-TV-Z]{26}$
          additionalProperties:
            $ref: '#/components/schemas/EntityQualifications'
    ContextSnapshot:
      type: object
      additionalProperties: false
      required:
      - tenant_id
      - org_unit_id
      - context_version
      - unit_chain
      - policy_view
      properties:
        tenant_id:
          type: string
          pattern: ^tnt_[0-9A-HJKMNP-TV-Z]{26}$
        org_unit_id:
          type: string
          minLength: 1
        context_version:
          type: integer
          format: int64
          minimum: 1
        unit_chain:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        policy_view:
          $ref: '#/components/schemas/ContextPolicyView'
    ObjectiveTemplateParam:
      type: object
      additionalProperties: false
      required:
      - name
      - type
      - configurable
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        type:
          type: string
          minLength: 1
          maxLength: 64
        default_from:
          type: string
          description: 随档案的字段，例如 profile.offering_categories
          maxLength: 128
        default_number:
          type: integer
          format: int64
        default_values:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
        configurable:
          type: boolean
          description: 可否改为本目标值；本切片只支持整数与品类、区域列表
    ObjectiveTemplate:
      type: object
      additionalProperties: false
      required:
      - template_id
      - version
      - name
      - say
      - release_stage
      - enableable
      - requires_domains
      - params
      properties:
        template_id: &templateID
          type: string
          pattern: ^APP-[A-Z0-9-]{1,32}\.[A-Z0-9]{1,8}$
        version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        name:
          type: string
          minLength: 1
        say:
          type: string
          minLength: 1
        release_stage:
          type: string
          pattern: ^M[0-9]$
          description: 租户可启用的阶段（覆盖矩阵 release.stage）
        enableable:
          type: boolean
        unavailable_reason:
          type: string
          enum:
          - not_released
          - role_not_selected
          - no_policy_template
        default_for_roles:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: ^ROLE-[A-Z0-9-]{1,32}$
        requires_domains:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: ^INF-[A-Z0-9-]{1,32}$
        policy_template_id:
          type: string
          pattern: ^TPL-[A-Z0-9-]{1,64}$
        policy_template_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        params:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ObjectiveTemplateParam'
    ObjectiveTemplateList:
      type: object
      additionalProperties: false
      required:
      - value_chain_roles
      - templates
      properties:
        value_chain_roles:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: ^ROLE-[A-Z0-9-]{1,32}$
        templates:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/ObjectiveTemplate'
    ObjectiveParam:
      type: object
      additionalProperties: false
      description: >-
        参数取值来源：profile 随档案（default_from 的字段）、default 模板默认值、objective 本目标值。
        本目标值的品类与区域须是档案取值或其下级（档案的子集），整数须满足模板 min/max。
      required:
      - source
      properties:
        source:
          type: string
          enum:
          - profile
          - default
          - objective
        values:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 500
          items:
            type: string
            minLength: 1
            maxLength: 64
        number:
          type: integer
          format: int64
    ObjectiveParams:
      type: object
      maxProperties: 32
      propertyNames:
        pattern: ^[a-z][a-z0-9_]{0,63}$
      additionalProperties:
        $ref: '#/components/schemas/ObjectiveParam'
    Subject:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
    EnableObjectiveRequest:
      type: object
      additionalProperties: false
      required:
      - template_id
      - org_unit_id
      properties:
        template_id: *templateID
        org_unit_id: *unit
        owner:
          $ref: '#/components/schemas/Subject'
        participants:
          type: array
          description: >-
            参与人，可以包含负责人。负责人与参与人合计的不同主体数即同步到 identity 的
            参与关系数，最多 50（与 SyncResourceParticipants 的单次上限一致，负责人同时是参与人只计一次）；
            超出时命令返回 422 too_many_participants，不入库、不产生事件。
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/Subject'
        params:
          $ref: '#/components/schemas/ObjectiveParams'
    ConfigureObjectiveRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - owner
      - participants
      - params
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
        owner:
          $ref: '#/components/schemas/Subject'
        participants:
          type: array
          description: >-
            参与人，可以包含负责人。负责人与参与人合计的不同主体数即同步到 identity 的
            参与关系数，最多 50（与 SyncResourceParticipants 的单次上限一致，负责人同时是参与人只计一次）；
            超出时命令返回 422 too_many_participants，不入库、不产生事件。
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/Subject'
        params:
          $ref: '#/components/schemas/ObjectiveParams'
    SetObjectiveStateRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - state
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
        state:
          type: string
          enum:
          - inactive
          - disabled
    Objective:
      type: object
      additionalProperties: false
      required:
      - id
      - template_id
      - template_version
      - policy_template_id
      - policy_template_version
      - org_unit_id
      - state
      - owner
      - participants
      - params
      - version
      properties:
        id:
          type: string
          pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
        template_id: *templateID
        template_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        policy_template_id:
          type: string
          pattern: ^TPL-[A-Z0-9-]{1,64}$
        policy_template_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        org_unit_id: *unit
        state:
          type: string
          enum:
          - inactive
          - active
          - disabled
          description: 未激活 / 生效 / 已停用
        owner:
          $ref: '#/components/schemas/Subject'
        participants:
          type: array
          description: >-
            参与人，可以包含负责人。负责人与参与人合计的不同主体数即同步到 identity 的
            参与关系数，最多 50（与 SyncResourceParticipants 的单次上限一致，负责人同时是参与人只计一次）；
            超出时命令返回 422 too_many_participants，不入库、不产生事件。
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/Subject'
        params:
          $ref: '#/components/schemas/ObjectiveParams'
        version:
          type: integer
          format: int64
          minimum: 1
    ObjectiveList:
      type: object
      additionalProperties: false
      required:
      - objectives
      properties:
        objectives:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Objective'
    PolicyDisposition:
      type: string
      description: 处置（策略 DSL 第4节）
      enum:
      - no_signal
      - excluded
      - watch_signal
      - review_candidate
      - pursue_candidate
    PolicyRuleID:
      type: string
      pattern: ^[A-Z][A-Z0-9-]{0,63}$
    PolicyRuleOverride:
      type: object
      additionalProperties: false
      description: >-
        对模板规则的覆盖：enabled 启停（锁定规则不可改）；weight 只用于加分与减分规则，1–50 的正整数（PRD 第7段第13节第5项）。
        表单未列出的规则取模板缺省（启用、模板权重）。
      required:
      - id
      - enabled
      properties:
        id:
          $ref: '#/components/schemas/PolicyRuleID'
        enabled:
          type: boolean
        weight:
          type: integer
          minimum: 1
          maximum: 50
    PolicyThresholds:
      type: object
      additionalProperties: false
      description: 处置阈值；drop_below 须小于 pursue_at（不满足时草案保存但不通过校验）
      required:
      - base_score
      - pursue_at
      - drop_below
      properties:
        base_score:
          type: integer
          minimum: 0
          maximum: 1000
        pursue_at:
          type: integer
          minimum: 0
          maximum: 1000
        drop_below:
          type: integer
          minimum: 0
          maximum: 1000
    PolicyNotify:
      type: object
      additionalProperties: false
      description: >-
        某一处置的通知受众与方式。受众只能是目标负责人 objective_owner、全部参与人 objective_members，或目标范围内的业务角色
        role:<角色>（不含租户管理员）；不能引入目标外成员。实际发送由 channels 逐人检查访问权限。
      required:
      - audience
      - mode
      properties:
        audience:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
