        next_cursor:
          type: string
          pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
    ActivePolicy:
      type: object
      additionalProperties: false
      description: >-
        一个目标的生效策略（读取时的当前代次）。owner 与 participants（0.6.0，C-08）为目标当前版本的负责人与参与人：channels 据此确定
        route 受众 objective_owner / objective_members 的即时通知候选收件人，发送前仍以收件人本人再检查目标与信号的访问
      required:
      - objective_id
      - objective_code
      - objective_state
      - org_unit_id
      - policy_id
      - generation
      - version
      - template_id
      - template_version
      - enabled_domains
      - document
      - effective_at
      properties:
        objective_id:
          type: string
          pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
        objective_code:
          type: string
          pattern: ^APP-[A-Z0-9-]{1,32}\.[A-Z0-9]{1,8}$
        objective_state:
          type: string
          enum:
          - inactive
          - active
          - disabled
        org_unit_id: *unit
        policy_id:
          type: string
          pattern: ^pol_[0-9A-HJKMNP-TV-Z]{26}$
        generation:
          type: integer
          format: int64
          minimum: 1
        version:
          type: integer
          format: int64
          minimum: 1
        template_id:
          type: string
          pattern: ^TPL-[A-Z0-9-]{1,64}$
        template_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        enabled_domains:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/DomainCode'
        document:
          $ref: '#/components/schemas/PolicyDocument'
        effective_at:
          type: string
          format: date-time
          description: 本代次生效（激活或回滚执行）的业务时间
        owner:
          $ref: '#/components/schemas/Subject'
        participants:
          type: array
          description: 目标当前版本的参与人（0.6.0，C-08；可以包含负责人），route 受众 objective_members 为负责人与参与人
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/Subject'
        assignment:
          $ref: '#/components/schemas/ActiveAssignment'
    ActiveAssignment:
      type: object
      additionalProperties: false
      description: >-
        目标当前的分派配置（0.7.0，C-14）：只在目标配置过分派规则时出现，版本从 1 开始，规则按顺序（可以为空：已配置为空规则，信号记为
        没有候选 none）。detection 生成信号时用同一次读取中的负责人与参与人过滤规则（assignee 已不是负责人或参与人的规则跳过），第一条命中的
        规则给出候选负责人，都不命中为 none；没有本字段（目标从未配置分派规则，或旧版本的提供方）时信号记为“分派规则不可用”rules_unavailable
      required:
      - version
      - rules
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        rules:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AssignmentRule'
    AssignmentRule:
      type: object
      additionalProperties: false
      description: >-
        一条分派规则（C-14）：regions 与 categories 都是可选条件，同时给出时须都满足；regions 按行政区划包含（与策略 region.within 一致，
        000000 为全国），categories 按行业包品类代码及其上级（与 category.any_match 一致），信号任一品类命中即满足；两者都不给出时匹配全部信号。
        按区域、品类之外的条件（我方主体、组织单元）尚未提供（缺口 C-22）
      required:
      - assignee
      properties:
        assignee:
          $ref: '#/components/schemas/Subject'
        regions:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 50
          items:
            type: string
            pattern: ^[0-9]{6}$
        categories:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 50
          items:
            type: string
            pattern: ^CAT-[A-Z0-9-]{1,60}$
    AssignmentRules:
      type: object
      additionalProperties: false
      description: >-
        目标的分派规则（C-14）。view 为字段级别：full 带规则与更新时间；summary 只带版本与规则条数（不出现规则与候选人）
      required:
      - objective_id
      - version
      - rule_count
      - view
      properties:
        objective_id:
          type: string
          pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
        version:
          type: integer
          format: int64
          minimum: 0
        rule_count:
          type: integer
          minimum: 0
          maximum: 50
        view:
          type: string
          enum:
          - full
          - summary
        rules:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AssignmentRule'
        updated_at:
          type: string
          format: date-time
    UpdateAssignmentRulesRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - rules
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 0
        rules:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AssignmentRule'
