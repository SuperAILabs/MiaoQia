          - open
          - triaged
          - converted
          - dismissed
          - closed
    CommandResult:
      type: object
      additionalProperties: false
      description: >-
        命令的结果（固定在操作标识上）：created 已创建、existing_linked 已存在 · 已关联、existing 已存在、succeeded 成功、no_change 无变化。
        pursuit 为调用者当前能查看时的跟进摘要；不能查看已有跟进时只有 existing_owner。authorization 为返回时的授权状态：effective 已生效、
        syncing 授权同步中、cleaning 已撤销而授权清理中。
      required:
      - operation_id
      - result
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationID'
        result:
          type: string
          enum:
          - created
          - existing_linked
          - existing
          - succeeded
          - no_change
        pursuit:
          $ref: '#/components/schemas/PursuitSummary'
        existing_owner:
          $ref: '#/components/schemas/Subject'
        not_written:
          type: array
          maxItems: 5
          uniqueItems: true
          description: 已存在时请求中没有写入的内容
          items:
            type: string
            enum:
            - owner
            - collaborators
            - first_task
            - note
        authorization:
          type: string
          enum:
          - effective
          - syncing
          - cleaning
        task:
          $ref: '#/components/schemas/Task'
        outcome:
          $ref: '#/components/schemas/Outcome'
        signal_restoration:
          type: string
          description: 撤销创建时信号的去向由 detection 按有效关联集合决定（异步）；此处只说明已排队解除的关联数
          maxLength: 200
    OrgID:
      type: string
      description: 组织标识（持续跟踪的对象）
      pattern: ^org_[0-9A-HJKMNP-TV-Z]{26}$
    SiblingHint:
      type: object
      additionalProperties: false
      description: >-
        同一目标、同一采购项目（同一事实类型与主体）上另一家中标方的进行中跟进；跟进目标不含标包标识，尚不能缩小到同一标包（PRD 第6段 F2 第1条、用例12，0.3.0）。按查看者对那个跟进的当前权限分级投影
        （白名单）：visibility 为 full 时给出跟进标识、中标方、负责人、负责人是否有效与创建时间；为 owner_only（不能查看那个跟进）时只给
        负责人，其他字段不出现。
      required:
      - visibility
      - owner
      properties:
        visibility:
          type: string
          enum:
          - full
          - owner_only
        owner:
          $ref: '#/components/schemas/Subject'
        pursuit_id:
          $ref: '#/components/schemas/PursuitID'
        winner_org_id:
          $ref: '#/components/schemas/OrgID'
        owner_valid:
          type: boolean
        created_at:
          type: string
          format: date-time
    CreateDefaults:
      type: object
      additionalProperties: false
      description: >-
        创建面板的默认负责人（0.3.0）。owner_source 为 candidate（分派规则的候选，此刻有效）或 self（调用者本人）；candidate_state 为
        valid（候选有效）、none（信号上没有候选或请求不带信号）、no_access（候选已不是租户有效成员或不能查看该目标的信号）、
        rules_unavailable（分派规则未接入）。candidate 只在 valid 时出现。
      required:
      - objective_id
      - owner
      - owner_source
      - candidate_state
      properties:
        objective_id:
          $ref: '#/components/schemas/ObjectiveID'
        signal_id:
          $ref: '#/components/schemas/SignalID'
        owner:
          $ref: '#/components/schemas/Subject'
        owner_source:
          type: string
          enum:
          - candidate
          - self
        candidate_state:
          type: string
          enum:
          - valid
          - none
          - no_access
          - rules_unavailable
        candidate:
          $ref: '#/components/schemas/Subject'
    TrackingState:
      type: string
      description: 持续跟踪的状态：tracking 跟踪中、paused 已暂停、stopped 已停止
      enum:
      - tracking
      - paused
      - stopped
    Cadence:
      type: object
      additionalProperties: false
      description: 周期：每周 weekday（1 为周一 … 7 为周日）的 time（HH:MM），按 timezone（IANA）计算
      required:
      - weekday
      - time
      - timezone
      properties:
        weekday:
          type: integer
          minimum: 1
          maximum: 7
        time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z]+(/[A-Za-z0-9_+-]+){0,2}$
