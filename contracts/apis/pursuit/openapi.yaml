openapi: 3.1.0
info:
  title: pursuit 跟进接口
  version: 0.4.0
  description: >-
    pursuit 的对外接口（经 gateway，令牌派生租户与主体），PRD 第6段跟进的服务端切片（docs/01-product/prd/06-pursuit-follow-up.md；
    规格见 docs/03-architecture/subsystems/pursuit.md）。草案：随第6段首个实现切片提交，未冻结。M2 只有交易型跟进（deal）；
    持续跟踪、阶段与公开截止时间绑定随后续切片追加。
    授权：创建与关联在目标上实时判断 can_assign（customer-context 的口径）；推进上的查看、更新与改派按“单元关系
    （org_unit#can_view_unit_pursuits / can_edit_unit_pursuits），或 pursuit 本地期望关系中的负责人/协作者且 identity 判断推进通过”放行：
    授权同步完成前新负责人不能操作，改派后原负责人立即不能以负责人身份操作，决策者不受同步影响。他租户、不存在与无权查看的跟进、任务
    同为 404 pursuit_not_found / task_not_found，不返回负责人、目标对象或是否存在。
    操作与尝试分开：operation_id 固定一次用户意图（Web 为打开表单时生成，渠道为动作令牌标识），提交后的确定结果（已创建、已存在、
    成功、无变化与确定失败）固定在操作标识上；Idempotency-Key 是一次尝试，同键重发返回该尝试的结果（含失败），暂时失败（503，未提交）
    用新键、同一操作标识重试。固定的结果每次返回前按调用者当前的权限重新投影（无权查看已有跟进时只返回负责人）。
    时间：截止时间与获知时间保存所填的值、精度（day 只到日，minute 精确到分钟）与时区（IANA），只到日的不补成时刻；
    返回的 *_at 为平台记录时间（UTC）。翻页游标由 pursuit 签名（整个载荷），只在签发它的租户、调用者与视图内有效，篡改为 400 invalid_cursor。
    部分接口另经内部端口（/internal 前缀）供 channels 以点击者（经有效绑定核验的收件人本人）的用户主体调用：卡片上的“跟进”
    （createPursuit，channel 为 wecom）与提醒卡片的“完成”（completeTask、reopenTask、getTask）；channel 为 wecom 的请求只接受内部端口。
    0.2.0（C-09 渠道侧）：内部端口另提供 listMyTasks（简报“待我处理”中的任务，以收件人本人读取）与 getPursuit（授权被拒的操作者
    通知发送前、以及链接打开时以本人再检查）；TaskView 追加 viewer_escalated（跟进无有效负责人、任务转给调用者所在单元的决策者）。
    0.3.0（C-10）：持续跟踪（PRD 第6段 F10：createTracking、listTracking、getTracking、pauseTracking、resumeTracking、stopTracking、
    updateTrackingMembers、listTrackingPeriods、getTrackingPeriod；持续型跟进与交易型共用跟进标识与授权口径，交易型的接口对持续型的标识
    为 404）；创建面板的默认负责人 getCreateDefaults（分派规则的候选，缺省为本人）；Pursuit 追加 sibling_hints（同一采购项目其他中标方的
    进行中跟进，按查看者权限分级投影）；TimelineEntry 的 kind 追加持续跟踪的变化。均为追加。
    0.4.0（C-11、C-12 部分）：只改说明，结构不变。转交（viewer_escalated 与 listMyTasks 的 escalated）在“任务负责人已不在团队中”之外，
    追加“任务负责人仍在团队中、但此刻不满足写入准入（以负责人本人判断：能否更新、授权同步与本人角色的授予版本），且该任务当前截止版本
    已有一条转给决策者的提醒发出”；负责人本人判断不可用时 503（失败关闭，不当作转交也不当作未转交）。内部端口另提供 getTracking
    （授权被拒通知的操作者为持续跟踪时，以操作者本人再检查）。
servers:
- url: /
paths:
  /v1/pursuit/pursuits:
    get:
      operationId: listPursuits
      summary: 跟进列表（ListPursuits）
      description: >-
        只列调用者可查看的跟进（无权限时为空列表而不是拒绝）。view：mine 我负责的、collaborating 我协作的、team 团队的（按单元关系
        can_view_unit_pursuits 或本人参与）、closed 已关闭的。进行中的按“无有效负责人置顶，再按下一个截止升序，没有截止的排后”排列；
        已关闭的按关闭时间倒序。每页至多 limit 条（默认且至多 50）；还有更多时给出 next_cursor（签名，须带相同的 view 与 objective_id）。
        已撤销的跟进不出现。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - name: view
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ListView'
      - name: objective_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ObjectiveID'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - name: cursor
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Cursor'
      responses:
        '200':
          description: 一页跟进
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PursuitList'
        default: &problem
          description: 失败关闭，稳定错误码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createPursuit
      summary: 创建跟进（CreatePursuit）
      description: >-
        从信号（signal_id 与所见内容版本）或手动（target）创建交易型跟进。检查（任一不通过即不写入，结果固定在操作标识上）：目标上的
        can_assign（无权 403 forbidden，目标不可见 404 objective_not_found）；信号属于本租户与该目标（否则 404 signal_not_found）、内容版本
        与所见一致（409 signal_updated，带 signal_current）、不是排除信号（422 not_applicable）、未关闭（409 signal_closed）；负责人与协作者
        是租户有效成员且能查看该目标的信号（否则 422 assignee_no_access，不自动授予权限）。同一目标、同一目标对象已有进行中的跟进时不创建：
        请求带信号且该信号尚未关联到它时新增关联，结果 existing_linked；否则 existing；两种情况请求中的负责人、协作者、任务与说明都不写入
        （not_written 列出）。跟进、负责人、协作者、第一项任务、信号关联与授权同步请求在一个本地事务中写入；identity 中的参与关系由授权
        同步写入，authorization 为返回时的授权状态。渠道（channel 为 wecom）创建的负责人为点击者本人、没有任务。
      x-timeout-ms: 10000
      x-idempotent: true
      parameters:
      - &idempotency
        name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePursuitRequest'
      responses:
        '200':
          description: 已创建、已存在 · 已关联或已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        default: *problem
  /v1/pursuit/pursuits/{pursuitID}:
    get:
      operationId: getPursuit
      summary: 跟进详情（GetPursuit）
      description: >-
        需要推进的 can_view（见 info.description）。含负责人与协作者、任务、信号关联、当前结果与修订历史、时间线（按平台记录时间）。
        每次读取都按当前权限判断，不以创建或上次读取时的权限为准。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - &pursuitID
        name: pursuitID
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/PursuitID'
      responses:
        '200':
          description: 跟进详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pursuit'
        default: *problem
  /v1/pursuit/pursuits/{pursuitID}/void:
    post:
      operationId: voidPursuit
      summary: 撤销创建（VoidPursuit）
      description: >-
        只有创建者、创建后 10 分钟内、跟进版本仍为创建时的版本（没有改派、任务、关闭或新的信号关联）时可撤销：跟进转为已撤销（保留记录），
        任务与提醒取消，全部有效关联解除（各发布 pursuit.pursuit.signal_unlinked.v1），期望参与关系清空并排队授权同步。非创建者 403 forbidden；
        超过 10 分钟 409 void_window_expired；版本已变 409 conflict（带 current）；只接受 Web（channel 为 web）。撤销不能再撤销。
      x-timeout-ms: 10000
      x-idempotent: true
      parameters:
      - *idempotency
      - *pursuitID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: 已撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        default: *problem
  /v1/pursuit/pursuits/{pursuitID}/assign:
    post:
      operationId: assignPursuit
      summary: 改派负责人与设置协作者（Assign）
      description: >-
        需要推进的 can_manage_team。负责人与协作者须为租户有效成员且能查看该目标的信号（否则 422 assignee_no_access）。效果已成立（负责人与
        协作者都不变）为 no_change，不写记录、不通知；否则版本不一致 409 conflict（带 current）。改派本地提交即生效，新负责人在授权同步完成后
        才能操作并收到一次通知。授权同步失败（超过 24 小时）的跟进只允许决策者改派。
      x-timeout-ms: 10000
      x-idempotent: true
      parameters:
      - *idempotency
      - *pursuitID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequest'
      responses:
        '200':
          description: 已改派或无变化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        default: *problem
  /v1/pursuit/pursuits/{pursuitID}/tasks:
    post:
      operationId: createTask
      summary: 新增任务（CreateTask）
      description: >-
        需要推进的 can_edit；任务负责人缺省为跟进负责人，须为跟进的负责人或协作者（否则 422 invalid_assignee）。按跟进版本并发控制。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *idempotency
      - *pursuitID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '200':
          description: 已新增
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        default: *problem
  /v1/pursuit/pursuits/{pursuitID}/close:
    post:
      operationId: closePursuit
      summary: 关闭并记录结果（ClosePursuit）
      description: >-
        需要推进的 can_edit。结果与原因代码必填（取自目标所属应用领域包的结果定义），原因要求说明时须写说明；成功与失败须有获知时间
        （可只到日）；金额条目须带币种与取值性质（422 invalid_outcome）。关闭取消未完成任务的提醒，不改变信号；发布
        pursuit.outcome.recorded.v1 与 pursuit.pursuit.closed.v1。M2 不支持重新打开。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *idempotency
      - *pursuitID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseRequest'
      responses:
        '200':
          description: 已关闭
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        default: *problem
  /v1/pursuit/pursuits/{pursuitID}/outcomes:
    post:
      operationId: reviseOutcome
      summary: 修订结果（RecordOutcome）
      description: >-
        需要推进的 can_edit，跟进已关闭。追加新的结果记录，引用被取代的当前记录（supersedes 须为当前结果，否则 409 conflict）并写原因；
        旧记录保留。可更正贡献关系。发布 pursuit.outcome.recorded.v1。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *idempotency
      - *pursuitID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviseOutcomeRequest'
      responses:
        '200':
          description: 已追加
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        default: *problem
  /v1/pursuit/tasks/{taskID}:
    get:
      operationId: getTask
      summary: 读取任务（提醒卡片发送前的再检查）
      description: >-
        需要任务所属推进的 can_view；viewer_can_edit 为调用者当前能否更新（与写命令同一准入：含授权同步与本地负责人判断），
        viewer_is_assignee 为调用者是否仍是任务负责人（且仍是跟进的有效负责人或协作者），viewer_escalated 为任务已转给调用者处理
        （跟进无有效负责人或任务负责人已不在团队中；或任务负责人仍在团队中但此刻不满足写入准入、且当前截止版本已有转给决策者的提醒发出
        （0.4.0）；且调用者在单元上有 can_edit_unit_pursuits）。负责人本人的判断不可用时 503。他租户、不存在与无权查看同为
        404 task_not_found。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - &taskID
        name: taskID
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/TaskID'
      responses:
        '200':
          description: 任务与调用者的当前权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        default: *problem
  /v1/pursuit/tasks/{taskID}/update:
    post:
      operationId: updateTask
      summary: 修改任务（UpdateTask）
      description: >-
        需要推进的 can_edit。修改标题或截止时间（写原因可选）；截止时间改变时截止版本加一，取消旧提醒、按新时间重建。效果已成立为 no_change；
        否则任务版本不一致 409 conflict（带 current）。已完成、已取消或跟进已关闭的任务 409 task_closed。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *idempotency
      - *taskID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: 已修改或无变化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        default: *problem
  /v1/pursuit/tasks/{taskID}/complete:
    post:
      operationId: completeTask
      summary: 完成任务（CompleteTask）
      description: >-
        需要推进的 can_edit。已完成为 no_change；否则任务版本不一致 409 conflict。完成取消未发送的提醒；完成后 10 秒（Web）或 10 分钟
        （渠道）内可撤销（reopenTask）。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *idempotency
      - *taskID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTaskRequest'
      responses:
        '200':
          description: 已完成或无变化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        default: *problem
  /v1/pursuit/tasks/{taskID}/reopen:
    post:
      operationId: reopenTask
      summary: 撤销完成（ReopenTask）
      description: >-
        撤销本人的一次完成（target_operation_id）：在撤销时限内、任务版本仍为完成后的版本时恢复为待办、恢复完成前的截止与未发送的提醒；
        之后有改动 409 conflict；超过时限 409 undo_window_expired；不是本人的完成或不是成功的完成 404 operation_not_found。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *idempotency
      - *taskID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReopenTaskRequest'
      responses:
        '200':
          description: 已撤销完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        default: *problem
  /v1/pursuit/my-tasks:
    get:
      operationId: listMyTasks
      summary: 待我处理的任务（ListMyTasks）
      description: >-
        分派给调用者、未完成、截止在 before 之前（缺省为不限）或已逾期的任务（跟进进行中、调用者当前能更新），按截止时间升序；
        调用者在单元上有 can_edit_unit_pursuits 时另含该单元内转给决策者的任务（escalated，与 getTask 的 viewer_escalated 同一口径：
        任务负责人已不在团队中；或仍在团队中但此刻不满足写入准入、且当前截止版本已有转给决策者的提醒发出，0.4.0）。每页至多 limit 条（默认且至多 100），
        next_cursor 为签名游标。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - name: before
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: cursor
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Cursor'
      responses:
        '200':
          description: 一页任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTaskList'
        default: *problem
  /v1/pursuit/create-defaults:
    get:
      operationId: getCreateDefaults
      summary: 创建面板的默认负责人（0.3.0，C-10）
      description: >-
        需要目标上的 can_assign（无权 403 forbidden，目标不可见 404 objective_not_found）。给出 Web 创建面板的默认负责人（PRD 第6段 F1 第2条、
        第13节第5项）：带 signal_id 时取该信号上由目标的分派规则给出的候选负责人，候选此刻仍是租户有效成员且能查看该目标的信号（以候选本人
        判断）时默认候选；没有候选、候选无访问或分派规则不可用时默认调用者本人，candidate_state 说明原因。只是默认值：createPursuit 不带
        owner 时仍以调用者本人为负责人，选用候选须在请求中写明 owner（写入前照常检查被分派人）。候选不因被建议而获得访问；只有候选有效时
        才返回其标识。信号不可见、他租户或不属于该目标为 404 signal_not_found；判断不可用为 503（不当作无访问）。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - name: objective_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ObjectiveID'
      - name: signal_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SignalID'
      responses:
        '200':
          description: 默认负责人
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDefaults'
        default: *problem
  /v1/pursuit/tracking:
    get:
      operationId: listTracking
      summary: 持续跟踪列表（0.3.0，C-10）
      description: >-
        只列调用者可查看的持续跟踪（与跟进相同的授权口径；无权时为空列表而不是拒绝），按创建时间倒序。每页至多 limit 条（默认且至多 50），
        next_cursor 为签名游标（须带相同的 objective_id，只在签发它的租户与调用者内有效，篡改为 400 invalid_cursor）。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - name: objective_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ObjectiveID'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - name: cursor
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Cursor'
      responses:
        '200':
          description: 一页持续跟踪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingList'
        default: *problem
    post:
      operationId: createTracking
      summary: 创建持续跟踪（0.3.0，C-10；PRD 第6段 F10）
      description: >-
        需要目标上的 can_assign（决策者或参与该目标的业务开拓者）。为一组组织（企业清单之外手选的组织标识）创建持续型跟进：名称、对象集合、
        周期（缺省每周一 08:00，Asia/Shanghai）与负责人（缺省调用者本人；须为租户有效成员且能查看该目标的信号，否则 422 assignee_no_access，
        不自动授予权限）。创建即进入跟踪中，第一期从创建时起到下一个周期时点。负责人经授权同步获得参与关系（与交易型跟进相同）。
        结果固定在操作标识上（created）。
      x-timeout-ms: 10000
      x-idempotent: true
      parameters:
      - *idempotency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrackingRequest'
      responses:
        '200':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingCommandResult'
        default: *problem
  /v1/pursuit/tracking/{pursuitID}:
    get:
      operationId: getTracking
      summary: 持续跟踪详情（0.3.0，C-10）
      description: >-
        需要推进的 can_view（同跟进）；每次读取按当前权限判断。他租户、不存在、无权查看与交易型跟进的标识同为 404 pursuit_not_found。
        另经内部端口供 channels 以授权被拒通知的操作者本人再检查（0.4.0）。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *pursuitID
      responses:
        '200':
          description: 持续跟踪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tracking'
        default: *problem
  /v1/pursuit/tracking/{pursuitID}/pause:
    post:
      operationId: pauseTracking
      summary: 暂停持续跟踪（PauseTracking，0.3.0）
      description: >-
        需要推进的 can_edit（与跟进的写命令同一准入）。跟踪中 → 已暂停：暂停期间不生成变化简报，进行中的一期不再结束（不补）。已暂停为
        no_change；已停止 409 invalid_transition；否则版本不一致 409 conflict。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *idempotency
      - *pursuitID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: 已暂停或无变化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingCommandResult'
        default: *problem
  /v1/pursuit/tracking/{pursuitID}/resume:
    post:
      operationId: resumeTracking
      summary: 恢复持续跟踪（ResumeTracking，0.3.0）
      description: >-
        需要推进的 can_edit。已暂停 → 跟踪中：下一期从恢复时起到恢复后的下一个周期时点，不补暂停期间的各期。跟踪中为 no_change；
        已停止 409 invalid_transition；否则版本不一致 409 conflict。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *idempotency
      - *pursuitID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: 已恢复或无变化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingCommandResult'
        default: *problem
  /v1/pursuit/tracking/{pursuitID}/stop:
    post:
      operationId: stopTracking
      summary: 停止持续跟踪（StopTracking，0.3.0）
      description: >-
        需要推进的 can_edit。跟踪中或已暂停 → 已停止：不再生成变化简报，已有各期保留。已停止为 no_change；否则版本不一致 409 conflict。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *idempotency
      - *pursuitID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: 已停止或无变化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingCommandResult'
        default: *problem
  /v1/pursuit/tracking/{pursuitID}/members:
    post:
      operationId: updateTrackingMembers
      summary: 修改持续跟踪的对象集合（0.3.0）
      description: >-
        需要推进的 can_edit。以完整集合替换对象集合，成员版本加一；集合不变为 no_change；已停止 409 invalid_transition；否则版本不一致
        409 conflict。已结束的各期保留其当期成员快照，修改只影响之后结束的期。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *idempotency
      - *pursuitID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingMembersRequest'
      responses:
        '200':
          description: 已修改或无变化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingCommandResult'
        default: *problem
  /v1/pursuit/tracking/{pursuitID}/periods:
    get:
      operationId: listTrackingPeriods
      summary: 持续跟踪的各期（0.3.0）
      description: >-
        需要推进的 can_view；按期序号倒序，每页至多 limit 条（默认且至多 50），next_cursor 为签名游标（绑定租户、调用者与该跟踪）。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *pursuitID
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - name: cursor
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Cursor'
      responses:
        '200':
          description: 一页各期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingPeriodList'
        default: *problem
  /v1/pursuit/tracking/{pursuitID}/periods/{seq}:
    get:
      operationId: getTrackingPeriod
      summary: 持续跟踪的一期（0.3.0）
      description: >-
        需要推进的 can_view（读取时按当前权限判断，不以该期结束时的负责人为准）。返回该期的实际期间、当期成员快照与对比基准；对象集合之后的
        修改不影响已结束的期。不存在的期 404 period_not_found。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *pursuitID
      - name: seq
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: 一期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingPeriod'
        default: *problem
components:
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          description: 稳定错误代码
        current:
          $ref: '#/components/schemas/PursuitState'
          description: conflict 时为跟进（与任务）的当前值
        signal_current:
          $ref: '#/components/schemas/SignalVersion'
          description: signal_updated 与 signal_closed 时为信号的当前内容版本与状态
    PursuitID:
      type: string
      pattern: ^pur_[0-9A-HJKMNP-TV-Z]{26}$
    TaskID:
      type: string
      pattern: ^tsk_[0-9A-HJKMNP-TV-Z]{26}$
    OutcomeID:
      type: string
      pattern: ^otc_[0-9A-HJKMNP-TV-Z]{26}$
    ObjectiveID:
      type: string
      pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
    SignalID:
      type: string
      pattern: ^sig_[0-9A-HJKMNP-TV-Z]{26}$
    Subject:
      type: string
      description: 成员（IdP 主体）
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
    OperationID:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{7,191}$
    Cursor:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: ^[A-Za-z0-9_-]+$
    ListView:
      type: string
      enum:
      - mine
      - collaborating
      - team
      - closed
    Channel:
      type: string
      description: 入口：web（含 H5）或 wecom（企业微信卡片，只经内部端口）
      enum:
      - web
      - wecom
    LocalTime:
      type: object
      additionalProperties: false
      description: >-
        所填或原始的时间：day 为日期（YYYY-MM-DD，只到日的截止是该日期在所填时区的当日结束前），minute 为所填时区的本地时刻（YYYY-MM-DDTHH:MM）。
        精度与取值格式不一致、时区不是有效的 IANA 名称时 422 invalid_time。
      required:
      - value
      - precision
      - timezone
      properties:
        value:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2})?$
        precision:
          type: string
          enum:
          - day
          - minute
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z]+(/[A-Za-z0-9_+-]+){0,2}$
    Target:
      type: object
      additionalProperties: false
      description: >-
        跟进的目标对象：信号的求值单位（事实类型、主体与部分）与中标方。从信号创建时取信号上的值；手动创建时取用户在对象页选的对象。
        同一目标、同一目标对象同时只有一个进行中的跟进。
      required:
      - fact_type
      - subject_id
      properties:
        fact_type:
          type: string
          pattern: ^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$
        subject_id:
          type: string
          pattern: ^[a-z]{2,3}_[0-9A-HJKMNP-TV-Z]{26}$
        part_id:
          type: string
          pattern: ^[a-z]{2,3}_[0-9A-HJKMNP-TV-Z]{26}$
        winner_org_id:
          type: string
          pattern: ^org_[0-9A-HJKMNP-TV-Z]{26}$
    TaskInput:
      type: object
      additionalProperties: false
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        assignee:
          $ref: '#/components/schemas/Subject'
        due:
          $ref: '#/components/schemas/LocalTime'
        note:
          type: string
          maxLength: 500
    CreatePursuitRequest:
      type: object
      additionalProperties: false
      description: 从信号创建时带 signal_id 与 seen_content_version、不带 target；手动创建时只带 target（否则 400 invalid_request）
      required:
      - operation_id
      - objective_id
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationID'
        objective_id:
          $ref: '#/components/schemas/ObjectiveID'
        signal_id:
          $ref: '#/components/schemas/SignalID'
        seen_content_version:
          type: integer
          format: int64
          minimum: 0
        target:
          $ref: '#/components/schemas/Target'
        owner:
          $ref: '#/components/schemas/Subject'
        collaborators:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Subject'
        first_task:
          $ref: '#/components/schemas/TaskInput'
        note:
          type: string
          maxLength: 500
        channel:
          $ref: '#/components/schemas/Channel'
    VersionRequest:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - expected_version
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationID'
        expected_version:
          type: integer
          format: int64
          minimum: 1
    AssignRequest:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - expected_version
      - owner
      - collaborators
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationID'
        expected_version:
          type: integer
          format: int64
          minimum: 1
        owner:
          $ref: '#/components/schemas/Subject'
        collaborators:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Subject'
        reason:
          type: string
          maxLength: 500
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - expected_version
      - task
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationID'
        expected_version:
          type: integer
          format: int64
          minimum: 1
        task:
          $ref: '#/components/schemas/TaskInput'
    UpdateTaskRequest:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - expected_version
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationID'
        expected_version:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 120
        due:
          $ref: '#/components/schemas/LocalTime'
        clear_due:
          type: boolean
          description: 删除截止时间（与 due 互斥）
        reason:
          type: string
          maxLength: 500
    CompleteTaskRequest:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - expected_version
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationID'
        expected_version:
          type: integer
          format: int64
          minimum: 1
        channel:
          $ref: '#/components/schemas/Channel'
    ReopenTaskRequest:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - target_operation_id
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationID'
        target_operation_id:
          $ref: '#/components/schemas/OperationID'
        channel:
          $ref: '#/components/schemas/Channel'
    Amount:
      type: object
      additionalProperties: false
      description: 金额条目：不同类型、取值性质与币种的金额分别显示，不相加、不换算
      required:
      - type
      - currency
      - value
      - nature
      - source
      properties:
        type:
          type: string
          description: 金额类型（取自应用领域包的结果定义，例如 own_supply_amount）
          pattern: ^[a-z][a-z0-9_]{1,63}$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        value:
          type: string
          description: 十进制文本，不换算
          pattern: ^-?[0-9]{1,15}(\.[0-9]{1,4})?$
        nature:
          type: string
          enum:
          - actual
          - estimate
          - customer_stated
        source:
          type: string
          enum:
          - public_fact
          - customer_document
          - verbal
        source_ref:
          type: string
          maxLength: 200
    OutcomeInput:
      type: object
      additionalProperties: false
      required:
      - result
      - reason_code
      properties:
        result:
          type: string
          enum:
          - success
          - failure
          - abandoned
        reason_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        note:
          type: string
          maxLength: 1000
        known_at:
          $ref: '#/components/schemas/LocalTime'
        known_channel:
          type: string
          enum:
          - public_notice
          - miaoqia_signal
          - buyer_or_prime_notice
          - customer_system
          - other
        amounts:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Amount'
        event_anchor:
          type: object
          additionalProperties: false
          required:
          - kind
          - at
          properties:
            kind:
              type: string
              enum:
              - public_event
              - customer_event
            at:
              $ref: '#/components/schemas/LocalTime'
            fact_ref:
              type: string
              maxLength: 200
            basis:
              type: string
              maxLength: 500
        contribution:
          $ref: '#/components/schemas/Contribution'
    Contribution:
      type: string
      description: 贡献关系（只说明链上发生过什么，不计算金额）；关闭时由系统判定，修订时可更正
      enum:
      - first_alert
      - decision_basis
      - self_found
      - external_notice
      - undetermined
    CloseRequest:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - expected_version
      - outcome
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationID'
        expected_version:
          type: integer
          format: int64
          minimum: 1
        outcome:
          $ref: '#/components/schemas/OutcomeInput'
    ReviseOutcomeRequest:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - supersedes
      - outcome
      - reason
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationID'
        supersedes:
          $ref: '#/components/schemas/OutcomeID'
        outcome:
          $ref: '#/components/schemas/OutcomeInput'
        reason:
          type: string
          minLength: 1
          maxLength: 500
    Authorization:
      type: object
      additionalProperties: false
      description: >-
        授权同步：desired_version 为本地期望参与关系的版本，applied_version 为 identity 已应用的版本。state 为 effective（已生效）、
        syncing（授权同步中）或 failed（超过 24 小时未成功，只允许决策者改派或关闭）。
      required:
      - state
      - desired_version
      - applied_version
      properties:
        state:
          type: string
          enum:
          - effective
          - syncing
          - failed
        desired_version:
          type: integer
          format: int64
          minimum: 1
        applied_version:
          type: integer
          format: int64
          minimum: 0
        pending_since:
          type: string
          format: date-time
    Task:
      type: object
      additionalProperties: false
      required:
      - id
      - pursuit_id
      - title
      - assignee
      - status
      - version
      - deadline_version
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/TaskID'
        pursuit_id:
          $ref: '#/components/schemas/PursuitID'
        title:
          type: string
          maxLength: 120
        assignee:
          $ref: '#/components/schemas/Subject'
        due:
          $ref: '#/components/schemas/LocalTime'
        due_at:
          type: string
          format: date-time
          description: 截止的时间点（只到日的为该日在所填时区的次日 00:00，UTC），用于排序与逾期判断
        note:
          type: string
          maxLength: 500
        status:
          type: string
          enum:
          - todo
          - done
          - cancelled
        pursuit_closed:
          type: boolean
          description: 跟进已关闭（任务保持原状态，提醒已取消）
        version:
          type: integer
          format: int64
          minimum: 1
        deadline_version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    TaskView:
      type: object
      additionalProperties: false
      required:
      - task
      - objective_id
      - pursuit_state
      - viewer_can_edit
      - viewer_is_assignee
      properties:
        task:
          $ref: '#/components/schemas/Task'
        objective_id:
          $ref: '#/components/schemas/ObjectiveID'
        pursuit_state:
          $ref: '#/components/schemas/PursuitStatus'
        viewer_can_edit:
          type: boolean
        viewer_is_assignee:
          type: boolean
        viewer_escalated:
          type: boolean
          description: 任务已转给调用者处理（无有效负责人的跟进转给单元的决策者，0.2.0；负责人仍在团队中但写入准入不满足、且已发出转交提醒，0.4.0）
    PursuitStatus:
      type: string
      enum:
      - open
      - closed
      - voided
    SignalLink:
      type: object
      additionalProperties: false
      required:
      - link_id
      - signal_id
      - seen_content_version
      - method
      - state
      - linked_at
      properties:
        link_id:
          type: string
          pattern: ^psl_[0-9A-HJKMNP-TV-Z]{26}$
        signal_id:
          $ref: '#/components/schemas/SignalID'
        seen_content_version:
          type: integer
          format: int64
          minimum: 0
        method:
          type: string
          enum:
          - create
          - link_existing
        state:
          type: string
          enum:
          - active
          - removed
        linked_at:
          type: string
          format: date-time
    Outcome:
      type: object
      additionalProperties: false
      required:
      - id
      - result
      - reason_code
      - amounts
      - contribution
      - recorded_by
      - recorded_at
      properties:
        id:
          $ref: '#/components/schemas/OutcomeID'
        result:
          type: string
          enum:
          - success
          - failure
          - abandoned
        reason_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        note:
          type: string
          maxLength: 1000
        known_at:
          $ref: '#/components/schemas/LocalTime'
        known_channel:
          type: string
          enum:
          - public_notice
          - miaoqia_signal
          - buyer_or_prime_notice
          - customer_system
          - other
        amounts:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Amount'
        event_anchor:
          type: object
          additionalProperties: false
          required:
          - kind
          - at
          properties:
            kind:
              type: string
              enum:
              - public_event
              - customer_event
            at:
              $ref: '#/components/schemas/LocalTime'
            fact_ref:
              type: string
              maxLength: 200
            basis:
              type: string
              maxLength: 500
        contribution:
          $ref: '#/components/schemas/Contribution'
        supersedes:
