    Authorization:
      type: object
      additionalProperties: false
      description: >-
        授权同步：desired_version 为本地期望参与关系的版本，applied_version 为 identity 已应用的版本。state 为 effective（已生效）、
        syncing（授权同步中）或 failed（超过 24 小时未成功，只允许决策者改派或关闭）。
      required:
      - state
      - desired_version
      - applied_version
      properties:
        state:
          type: string
          enum:
          - effective
          - syncing
          - failed
        desired_version:
          type: integer
          format: int64
          minimum: 1
        applied_version:
          type: integer
          format: int64
          minimum: 0
        pending_since:
          type: string
          format: date-time
