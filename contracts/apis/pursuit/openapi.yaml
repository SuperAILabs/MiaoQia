    MyTaskList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MyTask'
        next_cursor:
          $ref: '#/components/schemas/Cursor'
    PursuitState:
      type: object
      additionalProperties: false
      description: 冲突时的当前值
      required:
      - pursuit_id
      - state
      - version
      - owner
      properties:
        pursuit_id:
          $ref: '#/components/schemas/PursuitID'
        state:
          $ref: '#/components/schemas/PursuitStatus'
        version:
          type: integer
          format: int64
          minimum: 1
        owner:
          $ref: '#/components/schemas/Subject'
        task_id:
          $ref: '#/components/schemas/TaskID'
        task_status:
          type: string
          enum:
          - todo
          - done
          - cancelled
        task_version:
          type: integer
          format: int64
          minimum: 1
        outcome_id:
          $ref: '#/components/schemas/OutcomeID'
        changed_by:
          type: string
          maxLength: 128
        changed_at:
          type: string
          format: date-time
    SignalVersion:
      type: object
      additionalProperties: false
      required:
      - content_version
      - status
      properties:
        content_version:
          type: integer
          format: int64
          minimum: 0
        status:
          type: string
          enum:
          - open
          - triaged
          - converted
          - dismissed
          - closed
    CommandResult:
      type: object
      additionalProperties: false
      description: >-
        命令的结果（固定在操作标识上）：created 已创建、existing_linked 已存在 · 已关联、existing 已存在、succeeded 成功、no_change 无变化。
        pursuit 为调用者当前能查看时的跟进摘要；不能查看已有跟进时只有 existing_owner。authorization 为返回时的授权状态：effective 已生效、
        syncing 授权同步中、cleaning 已撤销而授权清理中。
      required:
      - operation_id
      - result
      properties:
        operation_id:
          $ref: '#/components/schemas/OperationID'
        result:
          type: string
          enum:
          - created
          - existing_linked
          - existing
          - succeeded
          - no_change
        pursuit:
          $ref: '#/components/schemas/PursuitSummary'
        existing_owner:
          $ref: '#/components/schemas/Subject'
        not_written:
          type: array
          maxItems: 5
          uniqueItems: true
          description: 已存在时请求中没有写入的内容
          items:
            type: string
            enum:
            - owner
            - collaborators
            - first_task
            - note
        authorization:
          type: string
          enum:
          - effective
          - syncing
          - cleaning
        task:
          $ref: '#/components/schemas/Task'
        outcome:
          $ref: '#/components/schemas/Outcome'
        signal_restoration:
          type: string
          description: 撤销创建时信号的去向由 detection 按有效关联集合决定（异步）；此处只说明已排队解除的关联数
          maxLength: 200
