              type: string
              enum:
              - public_event
              - customer_event
            at:
              $ref: '#/components/schemas/LocalTime'
            fact_ref:
              type: string
              maxLength: 200
            basis:
              type: string
              maxLength: 500
        contribution:
          $ref: '#/components/schemas/Contribution'
    Contribution:
      type: string
      description: 贡献关系（只说明链上发生过什么，不计算金额）；关闭时由系统判定，修订时可更正
      enum:
      - first_alert
      - decision_basis
      - self_found
      - external_notice
      - undetermined
    CloseRequest:
      type: object
      additionalProperties: false
