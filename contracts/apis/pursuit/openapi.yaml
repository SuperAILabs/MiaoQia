          required:
          - kind
          - channel
          properties:
            kind:
              type: string
              enum:
              - signal
              - manual
            signal_id:
              $ref: '#/components/schemas/SignalID'
            seen_content_version:
              type: integer
              format: int64
              minimum: 0
            channel:
              $ref: '#/components/schemas/Channel'
        previous_pursuit_id:
          $ref: '#/components/schemas/PursuitID'
        state:
          $ref: '#/components/schemas/PursuitStatus'
        owner:
          $ref: '#/components/schemas/Subject'
        owner_valid:
          type: boolean
        collaborators:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Subject'
        note:
          type: string
          maxLength: 500
        created_by:
          $ref: '#/components/schemas/Subject'
        created_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
        authorization:
          $ref: '#/components/schemas/Authorization'
        tasks:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Task'
        links:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/SignalLink'
        outcomes:
          type: array
          maxItems: 100
          description: 结果记录（追加式，按记录时间升序；最后一条为当前结果）
          items:
            $ref: '#/components/schemas/Outcome'
        timeline:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/TimelineEntry'
        viewer_can_edit:
          type: boolean
        viewer_can_manage_team:
          type: boolean
        viewer_can_void:
