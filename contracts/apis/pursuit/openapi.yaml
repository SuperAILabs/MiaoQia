    Amount:
      type: object
      additionalProperties: false
      description: 金额条目：不同类型、取值性质与币种的金额分别显示，不相加、不换算
      required:
      - type
      - currency
      - value
      - nature
      - source
      properties:
        type:
          type: string
          description: 金额类型（取自应用领域包的结果定义，例如 own_supply_amount）
          pattern: ^[a-z][a-z0-9_]{1,63}$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        value:
          type: string
          description: 十进制文本，不换算
          pattern: ^-?[0-9]{1,15}(\.[0-9]{1,4})?$
        nature:
          type: string
          enum:
          - actual
          - estimate
          - customer_stated
        source:
          type: string
          enum:
          - public_fact
          - customer_document
          - verbal
        source_ref:
          type: string
          maxLength: 200
    OutcomeInput:
      type: object
      additionalProperties: false
      required:
      - result
      - reason_code
      properties:
        result:
          type: string
          enum:
          - success
          - failure
          - abandoned
        reason_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        note:
          type: string
          maxLength: 1000
        known_at:
          $ref: '#/components/schemas/LocalTime'
        known_channel:
