openapi: 3.1.0
info:
  title: 采购中标公告研究
  version: '0.0.0'
paths:
  /v1/research/a02:
    post:
      operationId: ResearchAwardNotice
      x-timeout-ms: 20000
      x-idempotent: true
      description: 交互式 Cell 会话，使用当前组织单元权限和来源权利核验固定中标公告。同步返回证据报告。
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AwardResearchRequest'}
      responses:
        '200':
          description: 固定中标公告的证据报告
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AwardResearchReport'}
        default:
          description: 可识别的请求或依赖错误
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  schemas:
    AwardResearchRequest:
      type: object
      additionalProperties: false
      required: [org_unit_id, notice]
      properties:
        org_unit_id: {type: string, pattern: '^(root|unt_[0-9A-HJKMNP-TV-Z]{26})$'}
        notice: &notice
          type: object
          additionalProperties: false
          required: [id, version]
          properties:
            id: {type: string, pattern: '^ntc_[0-9A-HJKMNP-TV-Z]{26}$'}
            version: {type: integer, format: int64, minimum: 1}
    AwardResearchReport:
      type: object
      additionalProperties: false
      required: [template, notice, facts, inferences, unknowns, recommendations, partial, reads_used, model_calls_used]
      properties:
        template: {type: string, const: 'research.a02-award@1'}
        notice: *notice
        facts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, winner_name, citation]
            properties:
              field: {type: string, pattern: '^/lots/[0-9]+/bid_results/[0-9]+/bidder/name_raw$'}
              winner_name: &string {type: string, minLength: 1}
              citation:
                type: object
                additionalProperties: false
                required: [evidence_ref, snapshot_ref, source_id, source_key, observed_at, locator, quote]
                properties:
                  evidence_ref: *string
                  snapshot_ref: *string
                  source_id: *string
                  source_key: *string
                  observed_at: {type: string, format: date-time}
                  quote: *string
                  locator:
                    type: object
                    additionalProperties: false
                    required: [block]
                    properties:
                      block: &index {type: integer, minimum: 0}
                      block_end: *index
                      char_start: *index
                      char_end: *index
                      row: *index
                      col: *index
        inferences: {type: array, items: *string}
        unknowns:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [topic, reason]
            properties: {topic: *string, reason: *string}
        recommendations: {type: array, items: *string}
        partial: {type: boolean}
        reads_used: {type: integer, minimum: 0, maximum: 16}
        model_calls_used: {type: integer, const: 0}
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri}
        title: *string
        code: *string
        status: {type: integer, minimum: 400, maximum: 599}
