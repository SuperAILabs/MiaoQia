      value: tnt_01JA8ZXXXXXXXXXXXXXXXXXXX1
  - name: 公告不是计量对象
    valid: false
    patch:
    - op: replace
      path: /target
      value: ntc_01JA8ZXXXXXXXXXXXXXXXXXXX1
