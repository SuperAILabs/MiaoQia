  base:
    meter_key: mtr:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    kind: object_view
    target: pp_01JA8ZXXXXXXXXXXXXXXXXXXX1
    metering_day: '2026-10-25'
    time_zone: Asia/Shanghai
    outcome: counted
    used: 1
    limit: 2000
    resets_at: '2026-10-25T16:00:00Z'
  cases:
