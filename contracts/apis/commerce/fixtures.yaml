- schema: ViewKind
  base: evidence_view
  cases:
  - name: 未知种类
    valid: false
    instance: export
- schema: ViewMeterRequest
  base:
    kind: object_view
    target: org_01JA8ZXXXXXXXXXXXXXXXXXXX1
  cases:
  - name: 证据查看
    valid: true
    patch:
    - op: replace
      path: /kind
      value: evidence_view
    - op: replace
      path: /target
      value: ev_01JA8ZXXXXXXXXXXXXXXXXXXX1
  - name: 不接受请求体中的租户
    valid: false
