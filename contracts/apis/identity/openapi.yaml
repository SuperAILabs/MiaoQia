openapi: 3.1.0
info:
  title: identity 内部接口
  version: 1.3.0
  description: >-
    identity接口。授权Check、会话核验、组织单元读取与资源参与关系同步经mTLS内部端口；生命周期、组织单元、成员与邀请命令仅经外部网关。
    平台运营命令与成员读取要求已签名的 amr=mfa；租户管理命令（成员、单元、邀请）要求15分钟内的强认证：访问令牌带 amr=mfa 与
    IdP 签发的 auth_time，且 identity 时钟下 auth_time 距今不超过15分钟（含边界、未来偏差至多5秒），刷新令牌不改变 auth_time，
    渠道免登会话（miaoqia_session_source=channel）与未知会话来源一律不满足。不满足时为 403 mfa_required；IdP 明确该账号尚未登记
    TOTP 时为 403 totp_enrollment_required（客户端先引导登记，原动作不执行）。租户来自上下文，cell归属来自identity目录。组织单元标识为租户根单元的保留值 root 或 unt_<ULID>
    （contracts/identifiers.yaml）；Check 的资源可为本租户的 tenant、org_unit 与已登记的业务资源（objective、pursuit、research_case）。
servers:
- url: /internal
paths:
  /v1/authz:check:
    post:
      operationId: checkAuthorization
      summary: 授权决策（Check）
      description: >-
        判断主体是否对资源具有关系（动作）。主体缺省为请求上下文中的调用主体；带租户上下文时显式主体只能是调用主体本身。
        用户按identity目录中的当前成员状态、租户与单元角色判断；服务主体按identity登记的服务授权判断（例如 tenant 的 can_read_context）。
        org_unit 与业务资源须属于上下文租户，否则为拒绝。只读、幂等，可安全重试；单次超时5秒，暂时性失败最多3次。
      x-timeout-ms: 5000
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRequest'
      responses:
        '200':
          description: 决策结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResult'
        default:
          description: 错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/tenants:
    post:
      operationId: createTenant
      x-timeout-ms: 5000
      x-idempotent: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        default:
          description: 失败关闭，稳定错误码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,128}$
  /v1/tenants/{tenantID}/state:
    put:
      operationId: setTenantState
      x-timeout-ms: 5000
      x-idempotent: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        default:
          description: 失败关闭，稳定错误码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTenantStateRequest'
      parameters:
      - &id002
        name: tenantID
        in: path
        required: true
        schema: &id004
          type: string
          pattern: ^tnt_[0-9A-HJKMNP-TV-Z]{26}$
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,128}$
  /v1/identity/members/{subject}:
    put:
      operationId: putMember
      x-timeout-ms: 5000
      x-idempotent: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          description: 失败关闭，稳定错误码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutMemberRequest'
      parameters:
      - &id001
        name: subject
        in: path
        required: true
        schema: &id003
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,128}$
    get:
      operationId: getMember
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *id001
      responses:
        '200':
          description: 当前状态与版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          description: 失败关闭
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/identity/session:
    get:
      operationId: resolveSession
      x-timeout-ms: 5000
      x-idempotent: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          description: 失败关闭，稳定错误码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/tenants/{tenantID}:
    get:
      operationId: getTenant
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *id002
      responses:
        '200':
          description: 当前状态与版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        default:
          description: 失败关闭
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/identity/org-units:
    get:
      operationId: listOrgUnits
      summary: 列出本租户组织单元
      description: 当前租户的有效成员可调用。返回全部单元（含根单元 root），每个单元附从自身到根单元的单元链。
      x-timeout-ms: 5000
      x-idempotent: true
      responses:
        '200':
          description: 组织单元列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnitList'
        default:
          description: 失败关闭，稳定错误码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createOrgUnit
      summary: 创建组织单元
      description: 需要 can_manage_members 与MFA。上级单元须属于本租户；单元链（含根单元）最多8层。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgUnitRequest'
      responses:
        '200':
          description: 新单元
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        default:
          description: 失败关闭，稳定错误码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/identity/org-units/{unitID}:
    get:
      operationId: getOrgUnit
      summary: 读取组织单元与单元链
      description: >-
        当前租户的有效成员，或带本租户上下文的服务主体可调用（业务子系统据此核对资源所在单元并取得单元链）。
        单元不属于上下文租户时返回 404 org_unit_not_found。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - &unitParam
        name: unitID
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrgUnitID'
      responses:
        '200':
          description: 组织单元
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        default:
          description: 失败关闭，稳定错误码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      operationId: updateOrgUnit
      summary: 重命名或移动组织单元
      description: >-
        需要 can_manage_members 与MFA，按 expected_version 并发控制。根单元只能重命名；其他单元须给出上级单元，
        不能移到自身或下级之下（409 org_unit_cycle），移动后单元链最多8层（422 org_unit_too_deep）。
        移动立即改变继承的角色范围：之后的授权决策按新的单元链判断。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *unitParam
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgUnitRequest'
      responses:
        '200':
          description: 更新后的单元
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        default:
          description: 失败关闭，稳定错误码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/identity/participants:sync:
    post:
      operationId: syncResourceParticipants
      summary: 同步业务资源的参与关系（SyncResourceParticipants）
      description: >-
        仅资源所属业务子系统的服务主体可调用（例如 objective 由 customer-context），带资源所在租户的上下文。
        请求给出资源、所在单元、完整期望参与关系与参与版本：版本高于已应用版本时，identity 与成员状态及单元范围访问求交，
        在一次 OpenFGA 写入中加上应有的关系、删掉多余的关系，并记录已应用版本与结果（outcome applied）；同一版本、同一请求重复提交返回
        首次结果（outcome replayed），同一版本不同请求返回 409 participants_version_conflict；低于已应用版本时不做修改，返回 outcome stale
        与当前已应用版本。被拒成员及原因列在 rejected，其余关系照常应用。
      x-timeout-ms: 5000
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncParticipantsRequest'
      responses:
        '200':
          description: 同步结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncParticipantsResult'
        default:
          description: 失败关闭，稳定错误码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/identity/invitations:
    get:
      operationId: listInvitations
      summary: 列出本租户邀请
      description: >-
        需要 can_manage_members 与15分钟内的强认证。按创建时间倒序返回至多500条，truncated 表示还有更早的邀请未返回；
        已到过期时间的待接受邀请先置为 expired（发布 identity.invitation.changed.v1）再返回。可按 state 过滤。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - name: state
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/InvitationState'
      responses:
        '200':
          description: 邀请列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationList'
        default:
          description: 失败关闭，稳定错误码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createInvitation
      summary: 创建邀请（CreateInvitation）
      description: >-
        需要 can_manage_members 与15分钟内的强认证。邀请不授予任何权限；角色与单元角色限定接受时可写入的成员资格，
        单元须属于本租户（422 org_unit_not_found）。同一邮箱在本租户已有未过期的待接受邀请时返回该邀请（outcome existing，
        不发新链接，可重发）；本租户待接受邀请至多1000条（409 invitation_limit_reached）。邀请7天有效。
        链接令牌只出现在首次响应的 link_token 中，identity 只保存其摘要；同一 Idempotency-Key 的重放返回同一邀请但不含 link_token。
        邮件在提交后发送，结果写入 delivery（sent / failed；未知时保持 pending），发送失败不回滚邀请。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '200':
          description: 新建或已有的邀请
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationIssued'
        default:
          description: 失败关闭，稳定错误码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/identity/invitations/{invitationID}/resend:
    post:
      operationId: resendInvitation
      summary: 重发邀请（ResendInvitation）
      description: >-
        需要 can_manage_members 与15分钟内的强认证，按 expected_version 并发控制。待接受或已过期的邀请生成新链接、重新计算7天有效期并发送，
        旧链接立即失效（接受时返回 410 invitation_link_superseded）；已接受或已撤回的返回 409 invitation_not_pending。
        其他租户的或不存在的邀请返回同一 404 invitation_not_found。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - &invitationParam
        name: invitationID
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/InvitationID'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationVersionRequest'
      responses:
        '200':
          description: 重发后的邀请与新链接令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationIssued'
        default:
          description: 失败关闭，稳定错误码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/identity/invitations/{invitationID}/revoke:
    post:
      operationId: revokeInvitation
      summary: 撤回邀请（RevokeInvitation）
      description: >-
        需要 can_manage_members 与15分钟内的强认证，按 expected_version 并发控制。只有待接受且未过期的邀请可撤回；
        与接受并发时以邀请行锁串行，只有一个生效，失败的一方按最新状态返回 409 invitation_not_pending 或 version_conflict。
        其他租户的或不存在的邀请返回同一 404 invitation_not_found。
      x-timeout-ms: 5000
      x-idempotent: true
      parameters:
      - *invitationParam
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationVersionRequest'
      responses:
        '200':
          description: 撤回后的邀请
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        default:
          description: 失败关闭，稳定错误码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/identity/invitations:accept:
    post:
      operationId: acceptInvitation
      summary: 接受邀请（AcceptInvitation）
      description: >-
        受邀人以自己的登录令牌调用，独立授权，不经成员管理接口；令牌通常还不带租户。依次核验：链接存在（404 invitation_not_found）、
        邀请未撤回（410 invitation_revoked）、链接是当前这一次发出的（410 invitation_link_superseded）、未过期（410 invitation_expired）；
        IdP 中账号的已验证邮箱与邀请一致（403 email_unverified、403 invitation_email_mismatch）；账号不是其他租户的有效成员
        （409 account_in_other_tenant），也不是本租户的有效成员（409 already_member）；邀请含租户管理员角色时须有15分钟内的强认证
        （403 mfa_required、403 totp_enrollment_required）。通过后在一个事务中按邀请限定的角色与单元角色写入成员资格、把邀请置为已接受，
        发布 identity.member.changed.v1 与 identity.invitation.changed.v1 各一次；随后写入 IdP 中账号的租户与 cell 归属，
        未完成时 access 为 provisioning（令牌暂不带租户，访问失败关闭），identity 重试写入。同一账号用同一链接重复接受返回首次结果
        （outcome already_accepted），不重复写入或发布；其他账号接受已接受的邀请返回 409 invitation_already_accepted。IdP 不可用时 503。
      x-timeout-ms: 5000
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: 接受结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptance'
        default:
          description: 失败关闭，稳定错误码
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    CheckRequest:
      type: object
      additionalProperties: false
      required:
      - relation
      - object
      properties:
        subject:
          type: string
          description: 主体，例如 user:usr_…；缺省为请求上下文的调用主体
          pattern: ^[a-z_]+:[A-Za-z0-9_:.-]+$
        relation:
          type: string
          description: 关系或动作，例如 can_trigger_probe
          pattern: ^[a-z][a-z0-9_]*$
        object:
          type: string
          description: 资源，例如 platform:miaoqia、tenant:tnt_…
          pattern: ^[a-z_]+:[A-Za-z0-9_.-]+$
    CheckResult:
      type: object
      additionalProperties: false
      required:
      - allowed
      properties:
        allowed:
          type: boolean
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          description: 稳定错误代码
    CreateTenantRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - admin_subject
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        admin_subject: *id003
    Tenant:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - cell
      - state
      - version
      properties:
        id: *id004
        name:
          type: string
          minLength: 1
          maxLength: 120
        cell:
          type: string
          enum:
          - cell-01
        state:
          type: string
          enum:
          - active
          - suspended
        version:
          type: integer
          format: int64
          minimum: 1
    SetTenantStateRequest:
      type: object
      additionalProperties: false
      required:
      - state
      - expected_version
      properties:
        state:
          type: string
          enum:
          - active
          - suspended
        expected_version:
          type: integer
          format: int64
          minimum: 1
    PutMemberRequest:
      type: object
      additionalProperties: false
      required:
      - state
      - roles
      - expected_version
      properties:
        state:
          type: string
          enum:
          - active
          - removed
        roles:
          type: array
          uniqueItems: true
          maxItems: 6
          items:
            type: string
            enum: &id005
            - admin
            - decision_maker
            - business_developer
            - pursuit_lead
            - research_analyst
            - domain_expert
        expected_version:
          type: integer
          format: int64
          minimum: 0
        unit_roles:
          $ref: '#/components/schemas/UnitRoles'
    Session:
      type: object
      additionalProperties: false
      required:
      - tenant
      - cell
      - subject
      - state
      - roles
      - tenant_version
      - member_version
      properties:
        tenant:
          type: string
          pattern: ^tnt_[0-9A-HJKMNP-TV-Z]{26}$
        cell:
          type: string
          enum:
          - cell-01
        subject: *id003
        state:
          type: string
          enum:
          - active
          - removed
        roles:
          type: array
          uniqueItems: true
          maxItems: 6
          items:
            type: string
            enum: *id005
        tenant_version:
          type: integer
          format: int64
          minimum: 1
        member_version:
          type: integer
          format: int64
          minimum: 1
        unit_roles:
          $ref: '#/components/schemas/UnitRoles'
    OrgUnitID:
      type: string
      description: 组织单元标识：租户根单元为保留值 root，其他单元为 unt_<ULID>
      pattern: ^(root|unt_[0-9A-HJKMNP-TV-Z]{26})$
    UnitRoles:
      type: array
      description: >-
        绑定在组织单元上的角色（全量）。租户管理员只绑定在租户上，不能出现在单元上；角色作用于该单元及其下级单元，不作用于兄弟单元。
        成员命令中缺省等于空列表；退出状态必须为空。
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        required:
        - org_unit_id
        - roles
        properties:
          org_unit_id:
            $ref: '#/components/schemas/OrgUnitID'
          roles:
            type: array
            uniqueItems: true
            minItems: 1
            maxItems: 5
            items:
              type: string
              enum:
              - decision_maker
              - business_developer
              - pursuit_lead
              - research_analyst
              - domain_expert
    OrgUnit:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - chain
      - version
      properties:
        id:
          $ref: '#/components/schemas/OrgUnitID'
        name:
          type: string
          minLength: 1
          maxLength: 120
        parent_id:
          $ref: '#/components/schemas/OrgUnitID'
        chain:
          type: array
          description: 单元链，从本单元到根单元（含两端）；根单元的链只含 root
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/OrgUnitID'
        version:
          type: integer
          format: int64
          minimum: 1
    OrgUnitList:
      type: object
      additionalProperties: false
      required:
      - units
      properties:
        units:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/OrgUnit'
    CreateOrgUnitRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - parent_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        parent_id:
          $ref: '#/components/schemas/OrgUnitID'
    UpdateOrgUnitRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - expected_version
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        parent_id:
          $ref: '#/components/schemas/OrgUnitID'
        expected_version:
          type: integer
          format: int64
          minimum: 1
    ParticipantRelation:
      type: object
      additionalProperties: false
      required:
      - subject
      - relation
      properties:
        subject:
          type: string
          description: 成员主体（identity 目录中的成员标识，与成员接口的 subject 相同）
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
        relation:
          type: string
          description: 参与关系，须为资源类型允许的关系：objective 为 owner、participant；pursuit 为 owner、collaborator；research_case 为 owner、shared_with
          enum:
          - owner
          - participant
          - collaborator
          - shared_with
    SyncParticipantsRequest:
      type: object
      additionalProperties: false
      required:
      - resource
      - org_unit_id
      - version
      - participants
      properties:
        resource:
          type: string
          description: 业务资源，例如 objective:obj_…、pursuit:pur_…、research_case:rsc_…
          pattern: ^(objective:obj|pursuit:pur|research_case:rsc)_[0-9A-HJKMNP-TV-Z]{26}$
        org_unit_id:
          $ref: '#/components/schemas/OrgUnitID'
        version:
          type: integer
          format: int64
          minimum: 1
          description: 参与版本 N，由业务子系统按资源单调递增
        participants:
          type: array
          description: 完整的期望参与关系；空列表表示删除全部参与关系
          uniqueItems: true
          maxItems: 50
          items:
            $ref: '#/components/schemas/ParticipantRelation'
    SyncParticipantsResult:
      type: object
      additionalProperties: false
      required:
      - resource
      - applied_version
      - outcome
      - rejected
      properties:
        resource:
          type: string
          pattern: ^(objective:obj|pursuit:pur|research_case:rsc)_[0-9A-HJKMNP-TV-Z]{26}$
        applied_version:
          type: integer
          format: int64
          minimum: 1
        outcome:
          type: string
          enum:
          - applied
          - replayed
          - stale
        rejected:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
            - subject
            - relation
            - reason
            properties:
              subject:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
              relation:
                type: string
                enum:
                - owner
                - participant
                - collaborator
                - shared_with
              reason:
                type: string
                description: not_member 不是本租户成员；member_inactive 已停用或已退出；no_scope_access 在资源所在单元没有范围访问
                enum:
                - not_member
                - member_inactive
                - no_scope_access
    InvitationID:
      type: string
      description: 邀请标识 inv_<ULID>（contracts/identifiers.yaml）
      pattern: ^inv_[0-9A-HJKMNP-TV-Z]{26}$
    InvitationState:
      type: string
      description: pending 待接受；accepted 已接受；revoked 已撤回；expired 已过期（可重发回到 pending）
      enum:
      - pending
      - accepted
      - revoked
      - expired
    InvitationRoles:
      type: array
      description: 绑定在租户上的角色；租户管理员只能绑定在租户上
      uniqueItems: true
      maxItems: 6
      items:
        type: string
        enum:
        - admin
        - decision_maker
        - business_developer
        - pursuit_lead
        - research_analyst
        - domain_expert
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      description: 角色与单元角色至少一项非空
      required:
      - email
      - name
      - roles
      properties:
        email:
          type: string
          description: 受邀人邮箱；identity 按小写保存与比较
          minLength: 3
          maxLength: 254
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
        name:
          type: string
          minLength: 1
          maxLength: 120
        roles:
          $ref: '#/components/schemas/InvitationRoles'
        unit_roles:
          $ref: '#/components/schemas/UnitRoles'
    InvitationVersionRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
    Invitation:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - name
      - roles
      - state
      - version
      - inviter
      - expires_at
      - delivery
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/InvitationID'
        email:
          type: string
          minLength: 3
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 120
        roles:
          $ref: '#/components/schemas/InvitationRoles'
        unit_roles:
          $ref: '#/components/schemas/UnitRoles'
        state:
          $ref: '#/components/schemas/InvitationState'
        version:
          type: integer
          format: int64
          minimum: 1
        inviter:
          type: string
          description: 最近一次创建或重发该邀请的管理员
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
        expires_at:
          type: string
          format: date-time
          description: 当前链接的过期时间（业务时间：创建或最近一次重发起7天）
        delivery:
          type: string
          description: 当前链接的邮件投递结果：pending 尚未确认（含发送结果未知）；sent 已交给邮件渠道；failed 发送失败，可重发或复制链接
          enum:
          - pending
          - sent
          - failed
        accepted_by:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
        accepted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          description: 记录时间
    InvitationIssued:
      type: object
      additionalProperties: false
      required:
      - invitation
      - outcome
      properties:
        invitation:
          $ref: '#/components/schemas/Invitation'
        outcome:
          type: string
          description: created 新建；existing 已有未过期的待接受邀请（未发新链接）；resent 已重发
          enum:
          - created
          - existing
          - resent
        link_token:
          type: string
          description: 当前链接令牌（43位 base64url），只在首次响应中返回，identity 不保存原文
          pattern: ^[A-Za-z0-9_-]{43}$
    InvitationList:
      type: object
      additionalProperties: false
      required:
      - invitations
      - truncated
      properties:
        invitations:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Invitation'
        truncated:
          type: boolean
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          description: 邀请链接令牌
          pattern: ^[A-Za-z0-9_-]{43}$
    InvitationAcceptance:
      type: object
      additionalProperties: false
      required:
      - invitation_id
      - tenant
      - subject
      - roles
      - member_version
      - accepted_at
      - outcome
      - access
      properties:
        invitation_id:
          $ref: '#/components/schemas/InvitationID'
        tenant:
          type: string
          pattern: ^tnt_[0-9A-HJKMNP-TV-Z]{26}$
        subject:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
        roles:
          $ref: '#/components/schemas/InvitationRoles'
        unit_roles:
          $ref: '#/components/schemas/UnitRoles'
        member_version:
          type: integer
          format: int64
          minimum: 1
        accepted_at:
          type: string
          format: date-time
        outcome:
          type: string
          description: accepted 本次写入；already_accepted 同一账号此前已用同一链接接受（返回首次结果，未重复写入）
          enum:
          - accepted
          - already_accepted
        access:
          type: string
          description: ready IdP 中的租户与 cell 归属已写入，重新登录后令牌带租户；provisioning 尚未写入，identity 重试中
          enum:
          - ready
          - provisioning
