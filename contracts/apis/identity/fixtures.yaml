      path: /name
  - name: 拒绝业务夹带路由
    valid: false
    patch:
    - op: add
      path: /cell_override
      value: cell-02
- schema: Tenant
  base:
    id: tnt_01JA8ZXXXXXXXXXXXXXXXXXXX1
