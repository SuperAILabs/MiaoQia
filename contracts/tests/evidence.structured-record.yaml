schema: evidence/structured-record.schema.json
base:
  snapshot_ref: snp_01JA8ZXXXXXXXXXXXXXXXXXXX2
  pipeline_version: "rec.json@0.1.0"
  media_type: application_json
  source_url: https://example.invalid/api/penalties?page=1
  key_rule: 统一社会信用代码+处罚决定书文号
  records:
    - key: "91110000000000000X|某市监罚〔2026〕12号"
      data: { party: 某建材有限公司, decision_no: 某市监罚〔2026〕12号, amount: "50000", decided_on: "2026-09-01" }
cases:
  - name: 记录缺键
    valid: false
    patch: [{ op: remove, path: /records/0/key }]
  - name: 记录内容不是对象
    valid: false
    patch: [{ op: replace, path: /records/0/data, value: [1, 2] }]
  - name: CSV 导出
    valid: true
    patch: [{ op: replace, path: /media_type, value: text_csv }]
  - name: 文档格式不走记录集
    valid: false
    patch: [{ op: replace, path: /media_type, value: application_pdf }]
