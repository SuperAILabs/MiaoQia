schema: intelligence/context-snapshot.schema.json
base:
  tenant_id: tnt_01JA8ZXXXXXXXXXXXXXXXXXXX1
  org_unit_id: unit-gas-pipe
  context_version: 12
  unit_chain: [unit-gas-pipe, unit-root]
  policy_view:
    org_ids: [org_01JA8ZXXXXXXXXXXXXXXXXXXX1, org_01JA8ZXXXXXXXXXXXXXXXXXXX2]
    offering_categories: [CAT-PIPE-PE]
    service_regions: ["330000"]
    brands: []
    entities:
      org_01JA8ZXXXXXXXXXXXXXXXXXXX1:
        qualifications: { Q-A: valid, Q-C: expired }
        qualifications_pending: [Q-B]
        qualifications_complete: true
      org_01JA8ZXXXXXXXXXXXXXXXXXXX2:
        qualifications: {}
        qualifications_pending: []
        qualifications_complete: false
cases:
  - name: 未关联本企业时不出现我方主体与资质状态表
    valid: true
    patch:
      - { op: remove, path: /policy_view/org_ids }
      - { op: remove, path: /policy_view/entities }
  - name: 未关联本企业不用空列表
    valid: false
    patch:
      - { op: replace, path: /policy_view/org_ids, value: [] }
      - { op: remove, path: /policy_view/entities }
  - name: 待核对不能作为已判定状态
    valid: false
    patch: [{ op: add, path: /policy_view/entities/org_01JA8ZXXXXXXXXXXXXXXXXXXX1/qualifications/Q-B, value: pending }]
  - name: 主体缺录全声明
    valid: false
    patch: [{ op: remove, path: /policy_view/entities/org_01JA8ZXXXXXXXXXXXXXXXXXXX1/qualifications_complete }]
  - name: 状态表的键须为组织
    valid: false
    patch: [{ op: add, path: /policy_view/entities/prj_01JA8ZXXXXXXXXXXXXXXXXXXX1, value: { qualifications: {}, qualifications_pending: [], qualifications_complete: false } }]
  - name: 资质状态表不能为空对象
    valid: false
    patch: [{ op: replace, path: /policy_view/entities, value: {} }]
  - name: 我方主体超过上界
    valid: false
    patch: [{ op: replace, path: /policy_view/org_ids, value: [org_01JA8ZXXXXXXXXXXXXXXXXXXXA, org_01JA8ZXXXXXXXXXXXXXXXXXXXB, org_01JA8ZXXXXXXXXXXXXXXXXXXXC, org_01JA8ZXXXXXXXXXXXXXXXXXXXD, org_01JA8ZXXXXXXXXXXXXXXXXXXXE, org_01JA8ZXXXXXXXXXXXXXXXXXXXF, org_01JA8ZXXXXXXXXXXXXXXXXXXXG, org_01JA8ZXXXXXXXXXXXXXXXXXXXH, org_01JA8ZXXXXXXXXXXXXXXXXXXXJ, org_01JA8ZXXXXXXXXXXXXXXXXXXXK, org_01JA8ZXXXXXXXXXXXXXXXXXXXM] }]
  - name: 未登记字段
    valid: false
    patch: [{ op: add, path: /policy_view/qualification_codes, value: [] }]
  - name: 缺上下文版本
    valid: false
    patch: [{ op: remove, path: /context_version }]
