asyncapi: 3.0.0
info:
  title: evidence 事件
  version: 0.1.0
  description: >
    由 evidence 发布。链路探针经过数据单元时发布 probe.forwarded（见 contracts/events/operations）。
    信封为 CloudEvents 1.0；公共域事件：miaoqiazone = public。
channels:
  public.evidence:
    address: public.evidence
    messages:
      probeForwarded:
        $ref: '#/components/messages/probeForwarded'
operations:
  publishEvidenceEvents:
    action: send
    channel:
      $ref: '#/channels/public.evidence'
components:
  messages:
    probeForwarded:
      name: evidence.probe.forwarded.v1
      summary: 链路探针经过数据单元
      payload:
        type: object
        additionalProperties: false
        required: [probe_id, hops]
        properties:
          probe_id:
            type: string
            pattern: ^prb_[0-9A-HJKMNP-TV-Z]{26}$
          hops:
            type: array
            items:
              type: string
