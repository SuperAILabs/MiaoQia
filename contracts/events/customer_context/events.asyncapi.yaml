asyncapi: 3.0.0
info:
  title: customer-context 客户上下文与目标事件
  version: 0.1.0
  description: >-
    由 customer-context 经发件箱发布（PRD 第2段第8节）。信封为 CloudEvents 1.0，约定见
    docs/03-architecture/03-integration-contracts.md；本文件只定义 data 载荷。租户域事件：miaoqiazone = tenant，
    租户与 cell 只在信封中，不在载荷中。档案事件带上下文版本，只用于提前刷新快照缓存：正确性依赖求值前读取
    GetContextVersion，事件丢失、重复或乱序都不影响结果，版本不高于缓存的事件应被忽略。
    清单事件 customer_context.entity_list.changed.v1 与到期提醒 customer_context.qualification.expiring.v1
    随清单导入与到期提醒功能追加。
channels:
  tenantCustomerContext:
    address: cell-{cell}.customer_context
    parameters:
      cell:
        description: 租户所在 cell，例如 cell-01
    messages:
      profileUpdated:
        $ref: '#/components/messages/profileUpdated'
      objectiveChanged:
        $ref: '#/components/messages/objectiveChanged'
operations:
  publishCustomerContextEvents:
    action: send
    channel:
      $ref: '#/channels/tenantCustomerContext'
components:
  messages:
    profileUpdated:
      name: customer_context.profile.updated.v1
      x-fixtures-required: true
      summary: 租户上下文版本递增（档案保存，或资质有效期跨过到期日）
      payload:
        type: object
        additionalProperties: false
        required:
        - context_version
        - profile_version
        - cause
        - changed
        properties:
          context_version:
            type: integer
            minimum: 1
          profile_version:
            type: integer
            minimum: 1
          cause:
            type: string
            enum:
            - profile_saved
            - qualification_validity
            description: profile_saved 为档案保存；qualification_validity 为有效期跨日后快照中的资质状态变化，档案版本不变
          changed:
            type: array
            uniqueItems: true
            maxItems: 8
            items:
              type: string
              enum:
              - entities
              - value_chain_roles
              - industry_packs
              - offering_categories
              - brands
              - service_regions
              - qualifications
            description: 与上一版本相比变化的档案部分；只用于提示，不代替读取快照
        allOf:
        - if:
            properties:
              cause:
                const: qualification_validity
          then:
            properties:
              changed:
                const:
                - qualifications
    objectiveChanged:
      name: customer_context.objective.changed.v1
      x-fixtures-required: true
      summary: 目标启用、调整、停用或重新启用
      payload:
        type: object
        additionalProperties: false
        required:
        - objective_id
        - version
        - template_id
        - template_version
        - org_unit_id
        - state
        - change
        properties:
          objective_id:
            type: string
            pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
          version:
            type: integer
            minimum: 1
          template_id:
            type: string
            pattern: ^APP-[A-Z0-9-]{1,32}\.[A-Z0-9]{1,8}$
          template_version:
            type: string
            pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
          org_unit_id:
            type: string
            minLength: 1
          state:
            type: string
            enum:
            - inactive
            - active
            - disabled
          change:
            type: string
            enum:
            - enabled
            - configured
            - disabled
            - reenabled
        allOf:
        - if:
            properties:
              change:
                const: disabled
          then:
            properties:
              state:
                const: disabled
        - if:
            properties:
              change:
                enum:
                - enabled
                - reenabled
          then:
            properties:
              state:
                const: inactive
