asyncapi: 3.0.0
info:
  title: customer-context 客户上下文与目标事件
  version: 0.2.0
  description: >-
    由 customer-context 经发件箱发布（PRD 第2段第8节）。信封为 CloudEvents 1.0，约定见
    docs/03-architecture/03-integration-contracts.md；本文件只定义 data 载荷。租户域事件：miaoqiazone = tenant，
    租户与 cell 只在信封中，不在载荷中。档案事件带上下文版本，只用于提前刷新快照缓存：正确性依赖求值前读取
    GetContextVersion，事件丢失、重复或乱序都不影响结果，版本不高于缓存的事件应被忽略。
    清单事件 customer_context.entity_list.changed.v1 与到期提醒 customer_context.qualification.expiring.v1
    随清单导入与到期提醒功能追加。
    0.2.0 起发布策略事件（PRD 第7段）：草案保存 policy.drafted（learning 据此自动仿真）、批准后执行的 policy.activated 与
    policy.rolled_back（带策略代次，只用于提前刷新策略缓存，正确性依赖求值前读取代次），以及批准后执行前核验未通过的
    policy.execution_failed（通知申请人与审批人）；目标首次激活以 objective.changed 的 change activated 发布。
channels:
  tenantCustomerContext:
    address: cell-{cell}.customer_context
    parameters:
      cell:
        description: 租户所在 cell，例如 cell-01
    messages:
      profileUpdated:
        $ref: '#/components/messages/profileUpdated'
      objectiveChanged:
        $ref: '#/components/messages/objectiveChanged'
      policyDrafted:
        $ref: '#/components/messages/policyDrafted'
      policyActivated:
        $ref: '#/components/messages/policyActivated'
      policyRolledBack:
        $ref: '#/components/messages/policyRolledBack'
      policyExecutionFailed:
        $ref: '#/components/messages/policyExecutionFailed'
operations:
  publishCustomerContextEvents:
    action: send
    channel:
      $ref: '#/channels/tenantCustomerContext'
components:
  messages:
    profileUpdated:
      name: customer_context.profile.updated.v1
      x-fixtures-required: true
      summary: 租户上下文版本递增（档案保存，或资质有效期跨过到期日）
      payload:
        type: object
        additionalProperties: false
        required:
        - context_version
        - profile_version
        - cause
        - changed
        properties:
          context_version:
            type: integer
            minimum: 1
          profile_version:
            type: integer
            minimum: 1
          cause:
            type: string
            enum:
            - profile_saved
            - qualification_validity
            description: profile_saved 为档案保存；qualification_validity 为有效期跨日后快照中的资质状态变化，档案版本不变
          changed:
            type: array
            uniqueItems: true
            maxItems: 8
            items:
              type: string
              enum:
              - entities
              - value_chain_roles
              - industry_packs
              - offering_categories
              - brands
              - service_regions
              - qualifications
            description: 与上一版本相比变化的档案部分；只用于提示，不代替读取快照
        allOf:
        - if:
            properties:
              cause:
                const: qualification_validity
          then:
            properties:
              changed:
                const:
                - qualifications
    objectiveChanged:
      name: customer_context.objective.changed.v1
      x-fixtures-required: true
      summary: 目标启用、调整、停用或重新启用
      payload:
        type: object
        additionalProperties: false
        required:
        - objective_id
        - version
        - template_id
        - template_version
        - org_unit_id
        - state
        - change
        properties:
          objective_id:
            type: string
            pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
          version:
            type: integer
            minimum: 1
          template_id:
            type: string
            pattern: ^APP-[A-Z0-9-]{1,32}\.[A-Z0-9]{1,8}$
          template_version:
            type: string
            pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
          org_unit_id:
            type: string
            minLength: 1
          state:
            type: string
            enum:
            - inactive
            - active
            - disabled
          change:
            type: string
            enum:
            - enabled
            - configured
            - disabled
            - reenabled
            - activated
            description: activated 为首次激活（或重新启用后再次激活）使目标进入生效（0.2.0 起）
        allOf:
        - if:
            properties:
              change:
                const: disabled
          then:
            properties:
              state:
                const: disabled
        - if:
            properties:
              change:
                enum:
                - enabled
                - reenabled
          then:
            properties:
              state:
                const: inactive
    policyDrafted:
      name: customer_context.policy.drafted.v1
      x-fixtures-required: true
      summary: 策略草案保存形成新修订（0.2.0 起）
      description: >-
        valid 为 false 的修订（编译失败或阈值不合法）不仿真。generation 与 base_version 是保存时的策略代次与草案所基于的生效版本。
        按 (objective_id, revision) 去重。
      payload:
        type: object
        additionalProperties: false
        required:
        - objective_id
        - revision
        - draft_version
        - base_version
        - generation
        - template_id
        - template_version
        - valid
        properties:
          objective_id:
            type: string
            pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
          revision:
            type: integer
            minimum: 1
          draft_version:
            type: integer
            minimum: 1
          base_version:
            type: integer
            minimum: 0
          generation:
            type: integer
            minimum: 0
          template_id:
            type: string
            pattern: ^TPL-[A-Z0-9-]{1,64}$
          template_version:
            type: string
            pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
          valid:
            type: boolean
    policyActivated:
      name: customer_context.policy.activated.v1
      x-fixtures-required: true
      summary: 审批通过后激活新策略版本（0.2.0 起）
      description: >-
        激活与目标的策略代次递增在同一事务中提交；本事件只用于提前刷新缓存，丢失或迟到不影响正确性（detection 每批求值前读取代次）。
        backfill_days 为申请时固定的首次激活回填天数（0 为不回填），回填由 detection 执行。effective_at 为激活的业务时间。
      payload:
        type: object
        additionalProperties: false
        required:
        - objective_id
        - version
        - generation
        - previous_version
        - approval_id
        - source_revision
        - template_id
        - template_version
        - enabled_domains
        - backfill_days
        - effective_at
        properties:
          objective_id:
            type: string
            pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
          version:
            type: integer
            minimum: 1
          generation:
            type: integer
            minimum: 1
          previous_version:
            type: integer
            minimum: 0
          approval_id:
            type: string
            pattern: ^apr_[0-9A-HJKMNP-TV-Z]{26}$
          source_revision:
            type: integer
            minimum: 1
          template_id:
            type: string
            pattern: ^TPL-[A-Z0-9-]{1,64}$
          template_version:
            type: string
            pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
          enabled_domains:
            type: array
            maxItems: 32
            uniqueItems: true
            items:
              type: string
              pattern: ^INF-[A-Z0-9]{2,16}$
          backfill_days:
            type: integer
            minimum: 0
            maximum: 30
          effective_at:
            type: string
            format: date-time
    policyRolledBack:
      name: customer_context.policy.rolled_back.v1
      x-fixtures-required: true
      summary: 审批通过后回滚到曾经生效的版本（0.2.0 起）
      description: >-
        重新激活目标版本原来的合成文档与启用领域集合，策略代次递增；已有信号不重算。只用于提前刷新缓存。
      payload:
        type: object
        additionalProperties: false
        required:
        - objective_id
        - version
        - generation
        - previous_version
        - approval_id
        - effective_at
        properties:
          objective_id:
            type: string
            pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
          version:
            type: integer
            minimum: 1
          generation:
            type: integer
            minimum: 2
          previous_version:
            type: integer
            minimum: 1
          approval_id:
            type: string
            pattern: ^apr_[0-9A-HJKMNP-TV-Z]{26}$
          effective_at:
            type: string
            format: date-time
    policyExecutionFailed:
      name: customer_context.policy.execution_failed.v1
      x-fixtures-required: true
      summary: 批准后执行前核验未通过，未执行（0.2.0 起）
      description: >-
        baseline_changed 生效版本或策略代次已不同于申请时的基准；object_changed 草案修订不一致、草案未被该申请锁定或仿真运行不是该修订的；
        objective_disabled 目标已停用；version_missing 回滚目标版本不存在或已是生效版本。原生效版本不变，通知申请人与审批人。
      payload:
        type: object
        additionalProperties: false
        required:
        - objective_id
        - approval_id
        - kind
        - reason
        - effective_at
        properties:
          objective_id:
            type: string
            pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
          approval_id:
            type: string
            pattern: ^apr_[0-9A-HJKMNP-TV-Z]{26}$
          kind:
            type: string
            enum:
            - activation
            - rollback
          reason:
            type: string
            enum:
            - baseline_changed
            - object_changed
            - objective_disabled
            - version_missing
          effective_at:
            type: string
            format: date-time
