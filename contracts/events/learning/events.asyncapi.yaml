asyncapi: 3.0.0
info:
  title: learning 反馈学习与评估事件
  version: 0.1.0
  description: >-
    由 learning 经发件箱发布。信封为 CloudEvents 1.0，约定见 docs/03-architecture/03-integration-contracts.md；本文件只定义 data 载荷。
    租户域事件：miaoqiazone = tenant，租户与 cell 只在信封中。0.1.0 只有仿真完成（PRD 第7段 F3）；反馈、评估、漂移与策略建议事件随所属功能追加。
channels:
  tenantLearning:
    address: cell-{cell}.learning
    parameters:
      cell:
        description: 租户所在 cell，例如 cell-01
    messages:
      simulationCompleted:
        $ref: '#/components/messages/simulationCompleted'
operations:
  publishLearningEvents:
    action: send
    channel:
      $ref: '#/channels/tenantLearning'
components:
  messages:
    simulationCompleted:
      name: learning.simulation.completed.v1
      x-fixtures-required: true
      summary: 一次策略仿真结束（完成或失败）
      description: >-
        customer-context 据此把运行附在草案修订上：报告对应 revision，对比一侧为 compare_version 与 compare_generation（首次激活为 0），
        启用领域集合随草案保存、激活时写入版本。失败的仿真不能用于申请。completed_at 为业务时间。报告内容经 GetSimulationReport 读取。
      payload:
        type: object
        additionalProperties: false
        required:
        - simulation_id
        - objective_id
        - revision
        - status
        - compare_version
        - compare_generation
        - enabled_domains
        - completed_at
        properties:
          simulation_id:
            type: string
            pattern: ^sim_[0-9A-HJKMNP-TV-Z]{26}$
          objective_id:
            type: string
            pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
          revision:
            type: integer
            minimum: 1
          status:
            type: string
            enum:
            - completed
            - failed
          failure_reason:
            type: string
            enum:
            - dataset_unavailable
            - domain_status_unavailable
            - context_unavailable
            - policy_unavailable
            - timeout
          compare_version:
            type: integer
            minimum: 0
          compare_generation:
            type: integer
            minimum: 0
          enabled_domains:
            type: array
            maxItems: 32
            uniqueItems: true
            items:
              type: string
              pattern: ^INF-[A-Z0-9]{2,16}$
          completed_at:
            type: string
            format: date-time
        allOf:
        - if:
            properties:
              status:
                const: failed
          then:
            required:
            - failure_reason
          else:
            not:
              required:
              - failure_reason
