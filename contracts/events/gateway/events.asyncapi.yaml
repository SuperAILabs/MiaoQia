asyncapi: 3.0.0
info:
  title: gateway 接入网关事件
  version: 0.1.0
  description: >-
    由 gateway 经发件箱发布（docs/03-architecture/subsystems/gateway.md 第6节）。信封为 CloudEvents 1.0，约定见
    docs/03-architecture/03-integration-contracts.md；本文件只定义 data 载荷。租户域事件：miaoqiazone = tenant，租户与 cell 只在信封中。
    草案：随 PRD 第4段首个实现切片提交，未冻结。0.1.0 只有查看计量的事后补记 view_meter.deferred（commerce 消费）：
    commerce 暂不可用时对象页与证据面板照常放行（身份、覆盖、来源权利与安全上限照常检查），由此事件补记计数；
    不是业务事件，不推送到浏览器，PRD 第4段第8节“本段不新增事件”指业务事件。
channels:
  tenantGateway:
    address: cell-{cell}.gateway
    parameters:
      cell:
        description: 租户所在 cell，例如 cell-01
    messages:
      viewMeterDeferred:
        $ref: '#/components/messages/viewMeterDeferred'
operations:
  publishGatewayEvents:
    action: send
    channel:
      $ref: '#/channels/tenantGateway'
components:
  messages:
    viewMeterDeferred:
      name: gateway.view_meter.deferred.v1
      x-fixtures-required: true
      summary: 查看计量待补记
      description: >-
        计量服务不可用时放行的一次对象查看或原文查看。commerce 按（租户、member、kind、target、occurred_at 所在的计量日）补记，
        与在线计量共用计量操作标识去重，补记只补计数、不检查额度；request_id 为该次页面请求的尝试键（只用于排查）。
      payload:
        type: object
        additionalProperties: false
        required:
        - kind
        - target
        - member
        - occurred_at
        - request_id
        properties:
          kind:
            type: string
            enum:
            - object_view
            - evidence_view
          target:
            type: string
            pattern: ^(pp|prj|org|ev)_[0-9A-HJKMNP-TV-Z]{26}$
          member:
            type: string
            minLength: 1
            maxLength: 128
            description: 查看者（用户主体）
          occurred_at:
            type: string
            format: date-time
            description: 查看发生的时间（决定计量日）
          request_id:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,128}$
