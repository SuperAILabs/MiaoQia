asyncapi: 3.0.0
info:
  title: pursuit 跟进事件
  version: 0.2.0
  description: >-
    由 pursuit 经发件箱发布（PRD 第6段第8节；docs/03-architecture/subsystems/pursuit.md 第6节）。信封为 CloudEvents 1.0，约定见
    docs/03-architecture/03-integration-contracts.md；本文件只定义 data 载荷。租户域事件：miaoqiazone = tenant，租户与 cell 只在信封中。
    草案：随第6段首个实现切片提交，未冻结。signal_linked / signal_unlinked 的分区键为跟进标识，detection 以关联标识幂等维护信号的
    有效关联集合与已转跟进；team.changed 是授权同步请求（pursuit 自身消费，按跟进当前的期望参与关系调用 identity，只接受更高版本）；
    pursuit.assigned 与 task.due 只在对应参与版本授权同步完成后发布；outcome.recorded 由 learning 消费（以结果记录标识幂等）。
    事件只含标识、状态、版本与时间，不含说明文字、原因说明与客户金额以外的内容；金额只进入本租户的评估。
    0.2.0（C-09）：追加 pursuit.pursuit.authorization_rejected.v1（identity 拒绝部分参与关系时通知操作者，channels 消费）。
channels:
  tenantPursuit:
    address: cell-{cell}.pursuit
    parameters:
      cell:
        description: 租户所在 cell，例如 cell-01
    messages:
      pursuitCreated:
        $ref: '#/components/messages/pursuitCreated'
      signalLinked:
        $ref: '#/components/messages/signalLinked'
      signalUnlinked:
        $ref: '#/components/messages/signalUnlinked'
      pursuitVoided:
        $ref: '#/components/messages/pursuitVoided'
      teamChanged:
        $ref: '#/components/messages/teamChanged'
      pursuitAssigned:
        $ref: '#/components/messages/pursuitAssigned'
      taskDue:
        $ref: '#/components/messages/taskDue'
      authorizationRejected:
        $ref: '#/components/messages/authorizationRejected'
      outcomeRecorded:
        $ref: '#/components/messages/outcomeRecorded'
      pursuitClosed:
        $ref: '#/components/messages/pursuitClosed'
operations:
  publishPursuitEvents:
    action: send
    channel:
      $ref: '#/channels/tenantPursuit'
components:
  schemas:
    PursuitID:
      type: string
      pattern: ^pur_[0-9A-HJKMNP-TV-Z]{26}$
    SignalID:
      type: string
      pattern: ^sig_[0-9A-HJKMNP-TV-Z]{26}$
    ObjectiveID:
      type: string
      pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
    LinkID:
      type: string
      pattern: ^psl_[0-9A-HJKMNP-TV-Z]{26}$
    TaskID:
      type: string
      pattern: ^tsk_[0-9A-HJKMNP-TV-Z]{26}$
    OutcomeID:
      type: string
      pattern: ^otc_[0-9A-HJKMNP-TV-Z]{26}$
    Member:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
    OperationID:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{7,191}$
    OrgUnit:
      type: string
      pattern: ^(root|unt_[0-9A-HJKMNP-TV-Z]{26})$
    Timestamp:
      type: string
      format: date-time
    LocalTime:
      type: object
      additionalProperties: false
      description: 所填或原始的时间：值、精度（day / minute）与 IANA 时区
      required:
      - value
      - precision
      - timezone
      properties:
        value:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2})?$
        precision:
          type: string
          enum:
          - day
          - minute
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z]+(/[A-Za-z0-9_+-]+){0,2}$
    Target:
      type: object
      additionalProperties: false
      required:
      - fact_type
      - subject_id
      properties:
        fact_type:
          type: string
          pattern: ^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$
        subject_id:
          type: string
          pattern: ^[a-z]{2,3}_[0-9A-HJKMNP-TV-Z]{26}$
        part_id:
          type: string
          pattern: ^[a-z]{2,3}_[0-9A-HJKMNP-TV-Z]{26}$
        winner_org_id:
          type: string
          pattern: ^org_[0-9A-HJKMNP-TV-Z]{26}$
    Amount:
      type: object
      additionalProperties: false
      required:
      - type
      - currency
      - value
      - nature
      - source
      properties:
        type:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,63}$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        value:
          type: string
          pattern: ^-?[0-9]{1,15}(\.[0-9]{1,4})?$
        nature:
          type: string
          enum:
          - actual
          - estimate
          - customer_stated
        source:
          type: string
          enum:
          - public_fact
          - customer_document
          - verbal
  messages:
    pursuitCreated:
      name: pursuit.pursuit.created.v1
      x-fixtures-required: true
      summary: 交易型跟进已创建（只在真正创建时发布；已存在不发布）
      payload:
        type: object
        additionalProperties: false
        required:
        - pursuit_id
        - operation_id
        - objective_id
        - org_unit_id
        - target
        - source
        - owner
        - created_by
        - channel
        - created_at
        properties:
          pursuit_id:
            $ref: '#/components/schemas/PursuitID'
          operation_id:
            $ref: '#/components/schemas/OperationID'
          objective_id:
            $ref: '#/components/schemas/ObjectiveID'
          org_unit_id:
            $ref: '#/components/schemas/OrgUnit'
          target:
            $ref: '#/components/schemas/Target'
          source:
            type: string
            enum:
            - signal
            - manual
          signal_id:
            $ref: '#/components/schemas/SignalID'
          seen_content_version:
            type: integer
            minimum: 0
          previous_pursuit_id:
            $ref: '#/components/schemas/PursuitID'
          owner:
            $ref: '#/components/schemas/Member'
          created_by:
            $ref: '#/components/schemas/Member'
          channel:
            type: string
            enum:
            - web
            - wecom
          created_at:
            $ref: '#/components/schemas/Timestamp'
        allOf:
        - if:
            properties:
              source:
                const: signal
          then:
            required:
            - signal_id
            - seen_content_version
          else:
            not:
              anyOf:
              - required:
                - signal_id
              - required:
                - seen_content_version
    signalLinked:
      name: pursuit.pursuit.signal_linked.v1
      x-fixtures-required: true
      summary: 信号关联到跟进（创建时，或已存在时新增关联；每条关联发布一次）
      payload:
        type: object
        additionalProperties: false
        required:
        - link_id
        - pursuit_id
        - signal_id
        - seen_content_version
        - method
        - operation_id
        - linked_at
        properties:
          link_id:
            $ref: '#/components/schemas/LinkID'
          pursuit_id:
            $ref: '#/components/schemas/PursuitID'
          signal_id:
            $ref: '#/components/schemas/SignalID'
          seen_content_version:
            type: integer
            minimum: 0
          method:
            type: string
            enum:
            - create
            - link_existing
          operation_id:
            $ref: '#/components/schemas/OperationID'
          linked_at:
            $ref: '#/components/schemas/Timestamp'
    signalUnlinked:
      name: pursuit.pursuit.signal_unlinked.v1
      x-fixtures-required: true
      summary: 信号与跟进的关联解除（M2 只随撤销创建解除）
      payload:
        type: object
        additionalProperties: false
        required:
        - link_id
        - pursuit_id
        - signal_id
        - reason
        - operation_id
        - unlinked_at
        properties:
          link_id:
            $ref: '#/components/schemas/LinkID'
          pursuit_id:
            $ref: '#/components/schemas/PursuitID'
          signal_id:
            $ref: '#/components/schemas/SignalID'
          reason:
            type: string
            enum:
            - voided
          operation_id:
            $ref: '#/components/schemas/OperationID'
          unlinked_at:
            $ref: '#/components/schemas/Timestamp'
    pursuitVoided:
      name: pursuit.pursuit.voided.v1
      x-fixtures-required: true
      summary: 撤销创建（跟进转为已撤销，不计入统计）
      payload:
        type: object
        additionalProperties: false
        required:
        - pursuit_id
        - operation_id
        - voided_by
        - voided_at
        - unlinked
        properties:
          pursuit_id:
            $ref: '#/components/schemas/PursuitID'
          operation_id:
            $ref: '#/components/schemas/OperationID'
          voided_by:
            $ref: '#/components/schemas/Member'
          voided_at:
            $ref: '#/components/schemas/Timestamp'
          unlinked:
            type: integer
            minimum: 0
            description: 一起解除的有效关联数
    teamChanged:
      name: pursuit.team.changed.v1
      x-fixtures-required: true
      summary: 跟进的期望参与关系变化（授权同步请求）
      description: >-
        创建、改派、协作者变化、负责人失效与撤销创建时在同一事务中发布；participation_version 为写入后的参与版本。消费者按跟进当前的期望参与
        关系与版本同步（不是事件中的版本），identity 只接受更高的版本，迟到的旧事件不覆盖新版本。
      payload:
        type: object
        additionalProperties: false
        required:
        - pursuit_id
        - participation_version
        - reason
        properties:
          pursuit_id:
            $ref: '#/components/schemas/PursuitID'
          participation_version:
            type: integer
            minimum: 1
          reason:
            type: string
            enum:
            - created
            - reassigned
            - team_changed
            - owner_invalid
            - voided
    pursuitAssigned:
      name: pursuit.pursuit.assigned.v1
      x-fixtures-required: true
      summary: 分派通知（负责人不是操作者本人时，在该参与版本授权同步完成后发布一次）
      payload:
        type: object
        additionalProperties: false
        required:
        - pursuit_id
        - objective_id
        - assignee
        - assigned_by
        - participation_version
        - kind
        - applied_at
        properties:
          pursuit_id:
            $ref: '#/components/schemas/PursuitID'
          objective_id:
            $ref: '#/components/schemas/ObjectiveID'
          assignee:
            $ref: '#/components/schemas/Member'
          assigned_by:
            $ref: '#/components/schemas/Member'
          participation_version:
            type: integer
            minimum: 1
          kind:
            type: string
            enum:
            - created
            - reassigned
          applied_at:
            $ref: '#/components/schemas/Timestamp'
    taskDue:
      name: pursuit.task.due.v1
      x-fixtures-required: true
      summary: 任务提醒到时（每个任务、截止版本与提醒种类至多一次）
      description: >-
        发布前按当前值再检查：跟进进行中、任务待办、截止版本未变、负责人的参与版本已同步且负责人仍能更新该跟进。负责人无效时提醒转给
        目标所在单元的决策者（escalated 为 true，不带 recipient，channels 按单元解析决策者）。渠道投递时遵守收件人的安静时段。
      payload:
        type: object
        additionalProperties: false
        required:
        - reminder_id
        - task_id
        - pursuit_id
        - objective_id
        - org_unit_id
        - kind
        - deadline_version
        - due
        - escalated
        - fire_at
        properties:
          reminder_id:
            type: string
            pattern: ^rmd_[0-9A-HJKMNP-TV-Z]{26}$
          task_id:
            $ref: '#/components/schemas/TaskID'
          pursuit_id:
            $ref: '#/components/schemas/PursuitID'
          objective_id:
            $ref: '#/components/schemas/ObjectiveID'
          org_unit_id:
            $ref: '#/components/schemas/OrgUnit'
          kind:
            type: string
            enum:
            - before_24h
            - at_due
            - day_before_0900
            - due_day_0900
            - overdue_next_day_0900
          deadline_version:
            type: integer
            minimum: 1
          due:
            $ref: '#/components/schemas/LocalTime'
          recipient:
            $ref: '#/components/schemas/Member'
          escalated:
            type: boolean
          fire_at:
            $ref: '#/components/schemas/Timestamp'
        allOf:
        - if:
            properties:
              escalated:
                const: false
          then:
            required:
            - recipient
          else:
            not:
              required:
              - recipient
    authorizationRejected:
      name: pursuit.pursuit.authorization_rejected.v1
      x-fixtures-required: true
      summary: identity 拒绝了某参与版本中的部分成员（通知该版本的操作者）
      description: >-
        授权同步时 identity 拒绝部分参与关系（被分派人在同步前已退出、停用或失去目标访问），pursuit 把被拒的负责人标为无有效负责人、
        被拒的协作者移出并在同一事务中发布本事件（PRD 第6段 F12 第6条）。participation_version 为被拒的那个参与版本；operator 为写入该
        版本的成员（创建者或改派者），由系统写入的版本（成员变化后的重新判断）不带 operator，不通知。channels 发送前以 operator 本人
        再检查能否查看该跟进，不能查看时不发送。
      payload:
        type: object
        additionalProperties: false
        required:
        - pursuit_id
        - objective_id
        - org_unit_id
        - participation_version
        - rejected
        - owner_invalid
        - recorded_at
        properties:
          pursuit_id:
            $ref: '#/components/schemas/PursuitID'
          objective_id:
            $ref: '#/components/schemas/ObjectiveID'
          org_unit_id:
            $ref: '#/components/schemas/OrgUnit'
          participation_version:
            type: integer
            minimum: 1
          operator:
            $ref: '#/components/schemas/Member'
          rejected:
            type: array
            minItems: 1
            maxItems: 50
            items:
              type: object
              additionalProperties: false
              required:
              - subject
              - relation
              - reason
              properties:
                subject:
                  $ref: '#/components/schemas/Member'
                relation:
                  type: string
                  enum:
                  - owner
                  - collaborator
                reason:
                  type: string
                  pattern: ^[a-z][a-z0-9_]{1,63}$
          owner_invalid:
            type: boolean
            description: 被拒的成员中有负责人，跟进已标为无有效负责人
          recorded_at:
            $ref: '#/components/schemas/Timestamp'
    outcomeRecorded:
      name: pursuit.outcome.recorded.v1
      x-fixtures-required: true
      summary: 结果记录（关闭时的首条或修订追加；只用于本租户的评估）
      payload:
        type: object
        additionalProperties: false
        required:
        - outcome_id
        - pursuit_id
        - objective_id
        - template_id
        - result
        - reason_code
        - amounts
        - contribution
        - recorded_at
        properties:
          outcome_id:
            $ref: '#/components/schemas/OutcomeID'
          pursuit_id:
            $ref: '#/components/schemas/PursuitID'
          objective_id:
            $ref: '#/components/schemas/ObjectiveID'
          template_id:
            type: string
            pattern: ^APP-[A-Z0-9-]{1,32}\.[A-Z0-9]{1,8}$
          result:
            type: string
            enum:
            - success
            - failure
            - abandoned
          reason_code:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{1,63}$
          known_at:
            $ref: '#/components/schemas/LocalTime'
          known_at_utc:
            description: 获知时间的时点（只到日的取该日在所填时区的次日 00:00），供时点评估
            $ref: '#/components/schemas/Timestamp'
          known_channel:
            type: string
            enum:
            - public_notice
            - miaoqia_signal
            - buyer_or_prime_notice
            - customer_system
            - other
          amounts:
            type: array
            maxItems: 20
            items:
              $ref: '#/components/schemas/Amount'
          contribution:
            type: string
            enum:
            - first_alert
            - decision_basis
            - self_found
            - external_notice
            - undetermined
          source_signal_id:
            $ref: '#/components/schemas/SignalID'
          supersedes:
            $ref: '#/components/schemas/OutcomeID'
          recorded_at:
            $ref: '#/components/schemas/Timestamp'
        dependentRequired:
          known_at:
          - known_at_utc
          known_at_utc:
          - known_at
    pursuitClosed:
      name: pursuit.pursuit.closed.v1
      x-fixtures-required: true
      summary: 跟进关闭（带首条结果记录）
      payload:
        type: object
        additionalProperties: false
        required:
        - pursuit_id
        - objective_id
        - outcome_id
        - result
        - operation_id
        - closed_at
        properties:
          pursuit_id:
            $ref: '#/components/schemas/PursuitID'
          objective_id:
            $ref: '#/components/schemas/ObjectiveID'
          outcome_id:
            $ref: '#/components/schemas/OutcomeID'
          result:
            type: string
            enum:
            - success
            - failure
            - abandoned
          operation_id:
            $ref: '#/components/schemas/OperationID'
          closed_at:
            $ref: '#/components/schemas/Timestamp'
