asyncapi: 3.0.0
info:
  title: identity 生命周期事件
  version: 1.3.0
channels:
  platform.identity:
    address: platform.identity
    messages:
      tenantCreated:
        $ref: '#/components/messages/tenantCreated'
      tenantSuspended:
        $ref: '#/components/messages/tenantSuspended'
      tenantActivated:
        $ref: '#/components/messages/tenantActivated'
      memberChanged:
        $ref: '#/components/messages/memberChanged'
      invitationChanged:
        $ref: '#/components/messages/invitationChanged'
      approvalRequested:
        $ref: '#/components/messages/approvalRequested'
      approvalDecided:
        $ref: '#/components/messages/approvalDecided'
      approvalClosed:
        $ref: '#/components/messages/approvalClosed'
operations:
  publishIdentityEvents:
    action: send
    channel:
      $ref: '#/channels/platform.identity'
components:
  messages:
    tenantCreated:
      name: identity.tenant.created.v1
      x-fixtures-required: true
      payload:
        additionalProperties: false
        properties:
          state:
            enum:
            - active
            type: string
          tenant_id:
            pattern: ^tnt_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          version:
            minimum: 1
            type: integer
        required:
        - tenant_id
        - version
        - state
        type: object
    tenantSuspended:
      name: identity.tenant.suspended.v1
      x-fixtures-required: true
      payload:
        additionalProperties: false
        properties:
          state:
            enum:
            - suspended
            type: string
          tenant_id:
            pattern: ^tnt_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          version:
            minimum: 1
            type: integer
        required:
        - tenant_id
        - version
        - state
        type: object
    tenantActivated:
      name: identity.tenant.activated.v1
      x-fixtures-required: true
      payload:
        additionalProperties: false
        properties:
          state:
            enum:
            - active
            type: string
          tenant_id:
            pattern: ^tnt_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          version:
            minimum: 1
            type: integer
        required:
        - tenant_id
        - version
        - state
        type: object
    memberChanged:
      name: identity.member.changed.v1
      x-fixtures-required: true
      payload:
        additionalProperties: false
        properties:
          roles:
            items:
              enum:
              - admin
              - decision_maker
              - business_developer
              - pursuit_lead
              - research_analyst
              - domain_expert
              type: string
            maxItems: 6
            type: array
            uniqueItems: true
          state:
            enum:
            - active
            - removed
            type: string
          subject:
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
            type: string
          tenant_id:
            pattern: ^tnt_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          unit_roles:
            description: 绑定在组织单元上的角色（全量，1.1.0 起）；roles 为绑定在租户上的角色。退出时为空或缺省
            type: array
            maxItems: 50
            items:
              additionalProperties: false
              type: object
              required:
              - org_unit_id
              - roles
              properties:
                org_unit_id:
                  pattern: ^(root|unt_[0-9A-HJKMNP-TV-Z]{26})$
                  type: string
                roles:
                  items:
                    enum:
                    - decision_maker
                    - business_developer
                    - pursuit_lead
                    - research_analyst
                    - domain_expert
                    type: string
                  minItems: 1
                  maxItems: 5
                  type: array
                  uniqueItems: true
          version:
            minimum: 1
            type: integer
        required:
        - tenant_id
        - subject
        - version
        - state
        - roles
        type: object
        allOf:
        - if:
            properties:
              state:
                const: removed
          then:
            properties:
              roles:
                maxItems: 0
    invitationChanged:
      name: identity.invitation.changed.v1
      x-fixtures-required: true
      description: >-
        邀请的状态变化（1.2.0 起）：created 创建、resent 重发（新链接，旧链接失效）、accepted 接受、revoked 撤回、expired 过期。
        按邀请版本单调递增，消费方按 (invitation_id, version) 去重并忽略低版本。effective_at 是变化在业务上生效的时间：
        过期为邀请的过期时间（可能早于发布），其余为命令执行时间。载荷不含邮箱与链接令牌。
      payload:
        additionalProperties: false
        type: object
        required:
        - tenant_id
        - invitation_id
        - change
        - state
        - version
        - link_generation
        - expires_at
        - effective_at
        - roles
        properties:
          tenant_id:
            pattern: ^tnt_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          invitation_id:
            pattern: ^inv_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          change:
            type: string
            enum:
            - created
            - resent
            - accepted
            - revoked
            - expired
          state:
            type: string
            enum:
            - pending
            - accepted
            - revoked
            - expired
          version:
            minimum: 1
            type: integer
          link_generation:
            minimum: 1
            type: integer
            description: 当前链接的代次，重发加一
          expires_at:
            type: string
            format: date-time
          effective_at:
            type: string
            format: date-time
          roles:
            description: 邀请限定的租户角色
            items:
              enum:
              - admin
              - decision_maker
              - business_developer
              - pursuit_lead
              - research_analyst
              - domain_expert
              type: string
            maxItems: 6
            type: array
            uniqueItems: true
          unit_roles:
            description: 邀请限定的单元角色
            type: array
            maxItems: 50
            items:
              additionalProperties: false
              type: object
              required:
              - org_unit_id
              - roles
              properties:
                org_unit_id:
                  pattern: ^(root|unt_[0-9A-HJKMNP-TV-Z]{26})$
                  type: string
                roles:
                  items:
                    enum:
                    - decision_maker
                    - business_developer
                    - pursuit_lead
                    - research_analyst
                    - domain_expert
                    type: string
                  minItems: 1
                  maxItems: 5
                  type: array
                  uniqueItems: true
          subject:
            description: 接受人（仅 accepted）
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
            type: string
        allOf:
        - if:
            properties:
              change:
                const: accepted
          then:
            required:
            - subject
            properties:
              state:
                const: accepted
          else:
            not:
              required:
              - subject
        - if:
            properties:
              change:
                enum:
                - created
                - resent
          then:
            properties:
              state:
                const: pending
        - if:
            properties:
              change:
                const: revoked
          then:
            properties:
              state:
                const: revoked
        - if:
            properties:
              change:
                const: expired
          then:
            properties:
              state:
                const: expired
    approvalRequested:
      name: identity.approval.requested.v1
      x-fixtures-required: true
      description: >-
        审批请求已提交（1.3.0 起）。通知有资格的审批人（不含申请人），所属子系统据此核对本地是否已登记该请求（未登记且绑定已不成立时使其失效）。
        按 (approval_id, version) 去重。effective_at 为提交时间（业务时间），expires_at 为最长有效期。
      payload:
        additionalProperties: false
        type: object
        required: [tenant_id, approval_id, type, resource, applicant, version, binding, effective_at, expires_at]
        properties:
          tenant_id:
            pattern: ^tnt_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          approval_id:
            pattern: ^apr_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          type:
            type: string
            enum:
            - policy_activation
            - policy_rollback
          resource:
            type: string
            pattern: ^objective:obj_[0-9A-HJKMNP-TV-Z]{26}$
          applicant:
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
            type: string
          version:
            minimum: 1
            type: integer
          binding:
            type: object
            additionalProperties: false
            description: 请求绑定的不可变对象版本与基准（与 identity OpenAPI 的 ApprovalBinding 相同）
            required:
            - object_version
            - evidence_ref
            - baseline_version
            - baseline_generation
            properties:
              object_version:
                type: integer
                minimum: 1
              evidence_ref:
                type: string
                pattern: ^sim_[0-9A-HJKMNP-TV-Z]{26}$
              baseline_version:
                type: integer
                minimum: 0
              baseline_generation:
                type: integer
                minimum: 0
              backfill_days:
                type: integer
                minimum: 0
                maximum: 30
          effective_at:
            type: string
            format: date-time
          expires_at:
            type: string
            format: date-time
    approvalDecided:
      name: identity.approval.decided.v1
      x-fixtures-required: true
      description: >-
        审批请求已批准或驳回（1.3.0 起）。批准只针对 binding 中的对象版本与基准，所属子系统执行前核验绑定仍成立，不成立时不执行。
        驳回带原因。每个请求只发布一次。
      payload:
        additionalProperties: false
        type: object
        required: [tenant_id, approval_id, type, resource, applicant, version, binding, effective_at, decision, decided_by]
        properties:
          tenant_id:
            pattern: ^tnt_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          approval_id:
            pattern: ^apr_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          type:
            type: string
            enum:
            - policy_activation
            - policy_rollback
          resource:
            type: string
            pattern: ^objective:obj_[0-9A-HJKMNP-TV-Z]{26}$
          applicant:
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
            type: string
          version:
            minimum: 1
            type: integer
          binding:
            type: object
            additionalProperties: false
            description: 请求绑定的不可变对象版本与基准（与 identity OpenAPI 的 ApprovalBinding 相同）
            required:
            - object_version
            - evidence_ref
            - baseline_version
            - baseline_generation
            properties:
              object_version:
                type: integer
                minimum: 1
              evidence_ref:
                type: string
                pattern: ^sim_[0-9A-HJKMNP-TV-Z]{26}$
              baseline_version:
                type: integer
                minimum: 0
              baseline_generation:
                type: integer
                minimum: 0
              backfill_days:
                type: integer
                minimum: 0
                maximum: 30
          effective_at:
            type: string
            format: date-time
          decision:
            type: string
            enum:
            - approve
            - reject
          decided_by:
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
            type: string
          reason:
            type: string
            minLength: 1
            maxLength: 2000
        allOf:
        - if:
            properties:
              decision:
                const: reject
          then:
            required:
            - reason
    approvalClosed:
      name: identity.approval.closed.v1
      x-fixtures-required: true
      description: >-
        审批请求未经决定而关闭（1.3.0 起）：withdrawn 申请人撤回；expired 超过7天有效期（effective_at 为到期时间，可能早于发布）；
        invalidated 失效（reason：申请人退出或失去申请关系、所属子系统报告基准或对象已变）。通知申请人；激活申请的草案随之解锁，回滚申请不涉及草案。
      payload:
        additionalProperties: false
        type: object
        required: [tenant_id, approval_id, type, resource, applicant, version, binding, effective_at, state, reason]
        properties:
          tenant_id:
            pattern: ^tnt_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          approval_id:
            pattern: ^apr_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          type:
            type: string
            enum:
            - policy_activation
            - policy_rollback
          resource:
            type: string
            pattern: ^objective:obj_[0-9A-HJKMNP-TV-Z]{26}$
          applicant:
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
            type: string
          version:
            minimum: 1
            type: integer
          binding:
            type: object
            additionalProperties: false
            description: 请求绑定的不可变对象版本与基准（与 identity OpenAPI 的 ApprovalBinding 相同）
            required:
            - object_version
            - evidence_ref
            - baseline_version
            - baseline_generation
            properties:
              object_version:
                type: integer
                minimum: 1
              evidence_ref:
                type: string
                pattern: ^sim_[0-9A-HJKMNP-TV-Z]{26}$
              baseline_version:
                type: integer
                minimum: 0
              baseline_generation:
                type: integer
                minimum: 0
              backfill_days:
                type: integer
                minimum: 0
                maximum: 30
          effective_at:
            type: string
            format: date-time
          state:
            type: string
            enum:
            - withdrawn
            - expired
            - invalidated
          reason:
            type: string
            enum:
            - withdrawn
            - expired
            - applicant_left
            - applicant_lost_permission
            - baseline_changed
            - object_changed
        allOf:
        - if:
            properties:
              state:
                const: withdrawn
          then:
            properties:
              reason:
                const: withdrawn
        - if:
            properties:
              state:
                const: expired
          then:
            properties:
              reason:
                const: expired
        - if:
            properties:
              state:
                const: invalidated
          then:
            properties:
              reason:
                enum:
                - applicant_left
                - applicant_lost_permission
                - baseline_changed
                - object_changed
