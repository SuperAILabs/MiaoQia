asyncapi: 3.0.0
info:
  title: identity 生命周期事件
  version: 1.1.0
channels:
  platform.identity:
    address: platform.identity
    messages:
      tenantCreated:
        $ref: '#/components/messages/tenantCreated'
      tenantSuspended:
        $ref: '#/components/messages/tenantSuspended'
      tenantActivated:
        $ref: '#/components/messages/tenantActivated'
      memberChanged:
        $ref: '#/components/messages/memberChanged'
operations:
  publishIdentityEvents:
    action: send
    channel:
      $ref: '#/channels/platform.identity'
components:
  messages:
    tenantCreated:
      name: identity.tenant.created.v1
      x-fixtures-required: true
      payload:
        additionalProperties: false
        properties:
          state:
            enum:
            - active
            type: string
          tenant_id:
            pattern: ^tnt_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          version:
            minimum: 1
            type: integer
        required:
        - tenant_id
        - version
        - state
        type: object
    tenantSuspended:
      name: identity.tenant.suspended.v1
      x-fixtures-required: true
      payload:
        additionalProperties: false
        properties:
          state:
            enum:
            - suspended
            type: string
          tenant_id:
            pattern: ^tnt_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          version:
            minimum: 1
            type: integer
        required:
        - tenant_id
        - version
        - state
        type: object
    tenantActivated:
      name: identity.tenant.activated.v1
      x-fixtures-required: true
      payload:
        additionalProperties: false
        properties:
          state:
            enum:
            - active
            type: string
          tenant_id:
            pattern: ^tnt_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          version:
            minimum: 1
            type: integer
        required:
        - tenant_id
        - version
        - state
        type: object
    memberChanged:
      name: identity.member.changed.v1
      x-fixtures-required: true
      payload:
        additionalProperties: false
        properties:
          roles:
            items:
              enum:
              - admin
              - decision_maker
              - business_developer
              - pursuit_lead
              - research_analyst
              - domain_expert
              type: string
            maxItems: 6
            type: array
            uniqueItems: true
          state:
            enum:
            - active
            - removed
            type: string
          subject:
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
            type: string
          tenant_id:
            pattern: ^tnt_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          unit_roles:
            description: 绑定在组织单元上的角色（全量，1.1.0 起）；roles 为绑定在租户上的角色。退出时为空或缺省
            type: array
            maxItems: 50
            items:
              additionalProperties: false
              type: object
              required:
              - org_unit_id
              - roles
              properties:
                org_unit_id:
                  pattern: ^(root|unt_[0-9A-HJKMNP-TV-Z]{26})$
                  type: string
                roles:
                  items:
                    enum:
                    - decision_maker
                    - business_developer
                    - pursuit_lead
                    - research_analyst
                    - domain_expert
                    type: string
                  minItems: 1
                  maxItems: 5
                  type: array
                  uniqueItems: true
          version:
            minimum: 1
            type: integer
        required:
        - tenant_id
        - subject
        - version
        - state
        - roles
        type: object
        allOf:
        - if:
            properties:
              state:
                const: removed
          then:
            properties:
              roles:
                maxItems: 0
