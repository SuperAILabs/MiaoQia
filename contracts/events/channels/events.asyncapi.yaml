asyncapi: 3.0.0
info:
  title: channels 渠道绑定事件
  version: 0.6.0
  description: >-
    由 channels 经发件箱发布（PRD 第1段第8节）。信封为 CloudEvents 1.0，约定见 docs/03-architecture/03-integration-contracts.md；
    本文件只定义 data 载荷。租户域事件：miaoqiazone = tenant，租户与 cell 只在信封中。绑定的每次状态变化发布一条，按绑定版本单调递增；
    identity 消费 revoking 与 invalidated 撤销该绑定版本以下的免登会话（撤销水位只升不降，迟到的旧事件不改变结果），
    channels 自身消费 revoking 重试同步撤销。0.2.0（PRD 第5段）追加投递与卡片动作事件：channels.delivery.sent.v1、
    channels.delivery.failed.v1 与 channels.action.executed.v1。事件只含标识、状态与结果代码，不含简报条目内容。0.3.0（PRD 第6段）：卡片动作追加 pursue
    （卡片上的“跟进”，经 pursuit 以点击者本人创建或关联跟进）与可选的 pursuit_id。0.4.0（PRD 第6段 F9，C-09）：追加
    channels.task_action.executed.v1（任务提醒卡片上的“完成”与“撤销”得到确定结果）。0.5.0（C-11）：追加渠道通知（任务提醒卡片与
    授权被拒通知）的投递事件 channels.notice.sent.v1 与 channels.notice.failed.v1（简报的 channels.delivery.* 不变）；字段按通知种类
    逐项白名单，个人数据只有收件人（与简报投递事件相同），不含任务标题、正文、被拒成员或操作说明。0.6.0（PRD 第5段 F7，C-08）：追加
    信号即时通知的投递事件 channels.signal_notice.sent.v1 与 channels.signal_notice.failed.v1（与 channels.notice.* 同一语义：每条
    送达一次、每次渠道失败与每次结束各一次；字段白名单为通知、种类、收件人、渠道、信号、目标与尝试数，不含项目、中标方、金额或卡片正文）。
channels:
  tenantChannels:
    address: cell-{cell}.channels
    parameters:
      cell:
        description: 租户所在 cell，例如 cell-01
    messages:
      bindingChanged:
        $ref: '#/components/messages/bindingChanged'
      deliverySent:
        $ref: '#/components/messages/deliverySent'
      deliveryFailed:
        $ref: '#/components/messages/deliveryFailed'
      actionExecuted:
        $ref: '#/components/messages/actionExecuted'
      taskActionExecuted:
        $ref: '#/components/messages/taskActionExecuted'
      noticeSent:
        $ref: '#/components/messages/noticeSent'
      noticeFailed:
        $ref: '#/components/messages/noticeFailed'
      signalNoticeSent:
        $ref: '#/components/messages/signalNoticeSent'
      signalNoticeFailed:
        $ref: '#/components/messages/signalNoticeFailed'
operations:
  publishChannelsEvents:
    action: send
    channel:
      $ref: '#/channels/tenantChannels'
components:
  messages:
    bindingChanged:
      name: channels.binding.changed.v1
      x-fixtures-required: true
      summary: 渠道绑定建立、进入失效中或失效完成
      payload:
        type: object
        additionalProperties: false
        required:
        - binding_id
        - channel
        - subject
        - version
        - state
        properties:
          binding_id:
            type: string
            pattern: ^chb_[0-9A-HJKMNP-TV-Z]{26}$
          channel:
            type: string
            enum:
            - wecom
          subject:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
          version:
            type: integer
            minimum: 1
            description: 绑定版本：建立为1，失效时加一；撤销水位抬高到该值
          state:
            type: string
            enum:
            - bound
            - revoking
            - invalidated
          reason:
            type: string
            enum:
            - member_unbind
            - admin_unbind
            - member_left
            - channel_disabled
        allOf:
        - if:
            properties:
              state:
                const: bound
          then:
            properties:
              version:
                const: 1
            not:
              required:
              - reason
          else:
            required:
            - reason
            properties:
              version:
                minimum: 2
    deliverySent:
      name: channels.delivery.sent.v1
      x-fixtures-required: true
      summary: 一次投递的全部消息已被渠道接受
      description: >-
        简报推送或本人重新推送（kind）在某次尝试（attempt，从1起）后全部消息已提交并被渠道接受（PRD 第5段 F2 第6条）。
        dropped_sections 为发送前再检查时因收件人失去访问而删除的目标区数；渠道不提供已读回执时不发布阅读事件。
      payload:
        type: object
        additionalProperties: false
        required:
        - delivery_id
        - briefing_id
        - recipient
        - channel
        - kind
        - attempt
        - messages
        - dropped_sections
        - accepted_at
        properties:
          delivery_id: &deliveryID
            type: string
            pattern: ^dlv_[0-9A-HJKMNP-TV-Z]{26}$
          briefing_id: &briefingID
            type: string
            pattern: ^brf_[0-9A-HJKMNP-TV-Z]{26}$
          recipient: &member
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,127}$
          channel: &channel
            type: string
            enum:
            - wecom
          kind: &deliveryKind
            type: string
            enum:
            - briefing
            - resend
          attempt:
            type: integer
            minimum: 1
          messages:
            type: integer
            minimum: 1
            maximum: 7
            description: 本次投递的消息数（一张总览卡与至多6张信号卡片）
          dropped_sections:
            type: integer
            minimum: 0
          accepted_at:
            type: string
            format: date-time
    deliveryFailed:
      name: channels.delivery.failed.v1
      x-fixtures-required: true
      summary: 一次投递的某次尝试失败、被取消或到截止时间仍未成功
      description: >-
        final 为假时投递将退避重试（同一投递、同一批消息与令牌）；为真时投递结束：reason 为 cutoff（当日 18:00 仍未成功，简报留在
        Web 与站内）、member_inactive（成员已停用或退出）、binding_inactive（绑定已不是“已绑定”）或 channel_not_enabled。
      payload:
        type: object
        additionalProperties: false
        required:
        - delivery_id
        - briefing_id
        - recipient
        - channel
        - kind
        - attempt
        - reason
        - final
        properties:
          delivery_id: *deliveryID
          briefing_id: *briefingID
          recipient: *member
          channel: *channel
          kind: *deliveryKind
          attempt:
            type: integer
            minimum: 0
          reason:
            type: string
            enum:
            - channel_error
            - cutoff
            - member_inactive
            - binding_inactive
            - channel_not_enabled
          final:
            type: boolean
    actionExecuted:
      name: channels.action.executed.v1
      x-fixtures-required: true
      summary: 卡片上的一个操作得到确定结果（成功、无变化或确定失败）
      description: >-
        operation_id 即动作令牌标识（撤销另有令牌）。只在业务调用得到确定结果、结果固定在操作标识上时发布一次；操作开始前的拒绝
        （绑定无效、非收件人、令牌过期、他租户）与暂时失败只写审计，不发布本事件。parts 为各部分的变化（feedback 本人反馈、
        status 处理状态），不含反馈原因与说明。pursue（0.3.0）为卡片上的“跟进”：成功（新建或关联到已有跟进）与无变化（已有跟进且
        信号已关联）带 pursuit_id（点击者不能查看已有跟进时不带），不带 parts。
      payload:
        type: object
        additionalProperties: false
        required:
        - operation_id
        - token_id
        - recipient
        - signal_id
        - action
        - result
        - channel
        - executed_at
        properties:
          operation_id:
            type: string
            pattern: ^atk_[0-9A-HJKMNP-TV-Z]{26}$
          token_id:
            type: string
            pattern: ^atk_[0-9A-HJKMNP-TV-Z]{26}$
          recipient: *member
          signal_id:
            type: string
            pattern: ^sig_[0-9A-HJKMNP-TV-Z]{26}$
          action:
            type: string
            enum:
            - relevant
            - irrelevant
            - undo
            - pursue
          pursuit_id:
            type: string
            pattern: ^pur_[0-9A-HJKMNP-TV-Z]{26}$
            description: 卡片“跟进”创建或关联到的跟进（只用于 action 为 pursue）
          result:
            type: string
            enum:
            - succeeded
            - no_change
            - failed
          code:
            type: string
            pattern: ^[a-z][a-z0-9_]{1,63}$
            description: 确定失败的稳定错误代码（forbidden、signal_updated、signal_closed、conflict、not_applicable、signal_not_found；
              pursue 另有 pursuit 的错误代码，例如 objective_not_found）
          parts:
            type: object
            additionalProperties: false
            properties:
              feedback: &partChange
                type: string
                enum:
                - changed
                - unchanged
                - not_applicable
              status: *partChange
          channel: *channel
          executed_at:
            type: string
            format: date-time
        allOf:
        - if:
            properties:
              result:
                const: failed
          then:
            required:
            - code
          else:
            not:
              required:
              - code
    taskActionExecuted:
      name: channels.task_action.executed.v1
      x-fixtures-required: true
      summary: 任务提醒卡片上的一个操作得到确定结果（成功、无变化或确定失败）
      description: >-
        operation_id 即动作令牌标识（“撤销”另有令牌，target_operation_id 为被撤销的“完成”）。complete_task 经 pursuit completeTask、
        reopen_task 经 reopenTask，均以点击者本人调用。只在得到确定结果、结果固定在令牌上时发布一次；操作开始前的拒绝、暂时失败与
        authorization_syncing（授权同步完成后同一操作可成功）只写审计，不发布本事件。不含任务标题。
      payload:
        type: object
        additionalProperties: false
        required:
        - operation_id
        - recipient
        - task_id
        - action
        - result
        - channel
        - executed_at
        properties:
          operation_id:
            type: string
            pattern: ^atk_[0-9A-HJKMNP-TV-Z]{26}$
          recipient: *member
          task_id:
            type: string
            pattern: ^tsk_[0-9A-HJKMNP-TV-Z]{26}$
          pursuit_id:
            type: string
            pattern: ^pur_[0-9A-HJKMNP-TV-Z]{26}$
          action:
            type: string
            enum:
            - complete_task
            - reopen_task
          target_operation_id:
            type: string
            pattern: ^atk_[0-9A-HJKMNP-TV-Z]{26}$
          result:
            type: string
            enum:
            - succeeded
            - no_change
            - failed
          code:
            type: string
            pattern: ^[a-z][a-z0-9_]{1,63}$
            description: 确定失败的稳定错误代码（forbidden、conflict、task_closed、undo_window_expired、operation_not_found、deadline_changed 等）
          channel: *channel
          executed_at:
            type: string
            format: date-time
        allOf:
        - if:
            properties:
              result:
                const: failed
          then:
            required:
            - code
          else:
            not:
              required:
              - code
        - if:
            properties:
              action:
                const: reopen_task
          then:
            required:
            - target_operation_id
          else:
            not:
              required:
              - target_operation_id
    noticeSent:
      name: channels.notice.sent.v1
      x-fixtures-required: true
      summary: 一条渠道通知已被渠道接受
      description: >-
        任务提醒卡片（kind 为 task_due，消费 pursuit.task.due.v1）或授权被拒通知（authorization_rejected，消费
        pursuit.pursuit.authorization_rejected.v1）在某次尝试（attempt，从1起）后被渠道接受。每条通知（notice_id，每个来源与收件人
        一条）只发布一次。字段按种类白名单：task_due 带 task_id、pursuit_id、deadline_version 与 escalated（转给决策者的提醒展开后的
        一条）；authorization_rejected 只带 pursuit_id（交易型或持续跟踪的跟进标识）。不含标题、正文、截止值、被拒成员与原因。
      payload:
        type: object
        additionalProperties: false
        required:
        - notice_id
        - kind
        - recipient
        - channel
        - pursuit_id
        - attempt
        - accepted_at
        properties:
          notice_id: *deliveryID
          kind: &noticeKind
            type: string
            enum:
            - task_due
            - authorization_rejected
          recipient: *member
          channel: *channel
          pursuit_id: &pursuitID
            type: string
            pattern: ^pur_[0-9A-HJKMNP-TV-Z]{26}$
          task_id: &taskID
            type: string
            pattern: ^tsk_[0-9A-HJKMNP-TV-Z]{26}$
          deadline_version: &deadlineVersion
            type: integer
            minimum: 1
          escalated: &escalated
            type: boolean
            description: 转给决策者的提醒（负责人无效或其写入准入不满足时，展开为单元上能更新跟进的决策者各一条）
          attempt:
            type: integer
            minimum: 1
          accepted_at:
            type: string
            format: date-time
        allOf:
        - if:
            properties:
              kind:
                const: task_due
          then:
            required:
            - task_id
            - deadline_version
            - escalated
          else:
            not:
              anyOf:
              - required:
                - task_id
              - required:
                - deadline_version
              - required:
                - escalated
    noticeFailed:
      name: channels.notice.failed.v1
      x-fixtures-required: true
      summary: 一条渠道通知的某次尝试失败，或通知在送达前结束（留在站内或取消）
      description: >-
        final 为假时（state 为 retrying，reason 为 channel_error）将退避重试同一张卡片；为真时通知结束、不再发布：state 为 in_app
        （not_bound 未绑定渠道、cutoff 重试时限内仍未送达，留在 Web 与站内）或 cancelled（发送前以收件人本人再检查时取消：
        member_inactive、task_not_visible、task_closed、superseded、reassigned、pursuit_not_visible）。乱序到达的旧提醒在记下时即被
        取消的（superseded，attempt 为 0）也发布一次。字段白名单与 channels.notice.sent.v1 相同。
      payload:
        type: object
        additionalProperties: false
        required:
        - notice_id
        - kind
        - recipient
        - channel
        - pursuit_id
        - attempt
        - state
        - reason
        - final
        properties:
          notice_id: *deliveryID
          kind: *noticeKind
          recipient: *member
          channel: *channel
          pursuit_id: *pursuitID
          task_id: *taskID
          deadline_version: *deadlineVersion
          escalated: *escalated
          attempt:
            type: integer
            minimum: 0
          state:
            type: string
            enum:
            - retrying
            - in_app
            - cancelled
          reason:
            type: string
            enum:
            - channel_error
            - not_bound
            - cutoff
            - member_inactive
            - task_not_visible
            - task_closed
            - superseded
            - reassigned
            - pursuit_not_visible
          final:
            type: boolean
        allOf:
        - if:
            properties:
              kind:
                const: task_due
          then:
            required:
            - task_id
            - deadline_version
            - escalated
          else:
            not:
              anyOf:
              - required:
                - task_id
              - required:
                - deadline_version
              - required:
                - escalated
        - if:
            properties:
              state:
                const: retrying
          then:
            properties:
              final:
                const: false
              reason:
                const: channel_error
          else:
            properties:
              final:
                const: true
    signalNoticeSent:
      name: channels.signal_notice.sent.v1
      x-fixtures-required: true
      summary: 一条信号即时通知已被渠道接受
      description: >-
        消费 detection.signal.detected.v1 后，按目标生效策略 route 的 notify（mode 为 immediate）发给受众中每名收件人的信号卡片（kind 为
        signal_immediate），在某次尝试（attempt，从1起）后被渠道接受。每条通知（notice_id，每条信号与收件人一条）只发布一次。字段白名单：
        通知、种类、收件人、渠道、信号、目标与尝试数；不含项目名称、中标方、金额、命中理由或卡片正文（来源字段的展示级别不进入事件）。
      payload:
        type: object
        additionalProperties: false
        required:
        - notice_id
        - kind
        - recipient
        - channel
        - signal_id
        - objective_id
        - attempt
        - accepted_at
        properties:
          notice_id: *deliveryID
          kind: &signalNoticeKind
            type: string
            enum:
            - signal_immediate
          recipient: *member
          channel: *channel
          signal_id: &signalID
            type: string
            pattern: ^sig_[0-9A-HJKMNP-TV-Z]{26}$
          objective_id: &objectiveID
            type: string
            pattern: ^obj_[0-9A-HJKMNP-TV-Z]{26}$
          attempt:
            type: integer
            minimum: 1
          accepted_at:
            type: string
            format: date-time
    signalNoticeFailed:
      name: channels.signal_notice.failed.v1
      x-fixtures-required: true
      summary: 一条信号即时通知的某次尝试失败，或通知在送达前结束（留在站内或取消）
      description: >-
        final 为假时（state 为 retrying，reason 为 channel_error）将退避重试同一张卡片；为真时通知结束、不再发布：state 为 in_app
        （not_bound 未绑定渠道、cutoff 重试时限内仍未送达，留在 Web 与站内）或 cancelled（发送前以收件人本人再检查时取消：
        member_inactive、preference_off、not_immediate、not_in_audience、objective_not_visible、signal_not_visible、signal_handled、
        throttled、merged_into_briefing；信号照常进入收件人有权查看的简报与收件箱）。字段白名单与 channels.signal_notice.sent.v1 相同。
      payload:
        type: object
        additionalProperties: false
        required:
        - notice_id
        - kind
        - recipient
        - channel
        - signal_id
        - objective_id
        - attempt
        - state
        - reason
        - final
        properties:
          notice_id: *deliveryID
          kind: *signalNoticeKind
          recipient: *member
          channel: *channel
          signal_id: *signalID
          objective_id: *objectiveID
          attempt:
            type: integer
            minimum: 0
          state:
            type: string
            enum:
            - retrying
            - in_app
            - cancelled
          reason:
            type: string
            enum:
            - channel_error
            - not_bound
            - cutoff
            - member_inactive
            - preference_off
            - not_immediate
            - not_in_audience
            - objective_not_visible
            - signal_not_visible
            - signal_handled
            - throttled
            - merged_into_briefing
          final:
            type: boolean
        allOf:
        - if:
            properties:
              state:
                const: retrying
          then:
            properties:
              final:
                const: false
              reason:
                const: channel_error
          else:
            properties:
              final:
                const: true
