asyncapi: 3.0.0
info:
  title: entity公共数据事件
  version: 1.1.0
  description: CloudEvents 1.0公共域信封，miaoqiazone=public；只定义data载荷。
channels:
  public.entity:
    address: public.entity
    messages:
      entityCreated:
        $ref: '#/components/messages/entityCreated'
      entityUpdated:
        $ref: '#/components/messages/entityUpdated'
      mergeApplied:
        $ref: '#/components/messages/mergeApplied'
      mergeReverted:
        $ref: '#/components/messages/mergeReverted'
      relationshipChanged:
        $ref: '#/components/messages/relationshipChanged'
operations:
  publishEntityEvents:
    action: send
    channel:
      $ref: '#/channels/public.entity'
components:
  messages:
    entityCreated:
      name: entity.entity.created.v1
      summary: 实体创建
      payload:
        type: object
        additionalProperties: false
        properties:
          entity_id:
            $ref: ../../schemas/common/event-types.schema.json#/$defs/entity_id
          rights_tags:
            $ref: ../../schemas/common/event-types.schema.json#/$defs/rights_tags
          entity_version:
            $ref: ../../schemas/common/event-types.schema.json#/$defs/version
          entity_type:
            enum:
            - organization
            - project
            - location
            - category
            - brand
        required:
        - entity_id
        - rights_tags
        - entity_version
        - entity_type
      x-fixtures-required: true
    entityUpdated:
      name: entity.entity.updated.v1
      summary: 实体变化
      payload:
        type: object
        additionalProperties: false
        properties:
          entity_id:
            $ref: ../../schemas/common/event-types.schema.json#/$defs/entity_id
          changed_fields:
            $ref: ../../schemas/common/event-types.schema.json#/$defs/changed_fields
          rights_tags:
            $ref: ../../schemas/common/event-types.schema.json#/$defs/rights_tags
          entity_version:
            $ref: ../../schemas/common/event-types.schema.json#/$defs/version
        required:
        - entity_id
        - changed_fields
        - rights_tags
        - entity_version
      x-fixtures-required: true
    mergeApplied:
      name: entity.merge.applied.v1
      summary: 实体合并应用，可撤销
      payload:
        type: object
        additionalProperties: false
        properties:
          merge_id:
            type: string
            minLength: 1
          survivor_id:
            $ref: ../../schemas/common/event-types.schema.json#/$defs/entity_id
          absorbed_ids:
            type: array
            items:
              $ref: ../../schemas/common/event-types.schema.json#/$defs/entity_id
            minItems: 1
            uniqueItems: true
          entity_version:
            $ref: ../../schemas/common/event-types.schema.json#/$defs/version
          rights_tags:
            $ref: ../../schemas/common/event-types.schema.json#/$defs/rights_tags
        required:
        - merge_id
        - survivor_id
        - absorbed_ids
        - entity_version
        - rights_tags
      x-fixtures-required: true
    mergeReverted:
      name: entity.merge.reverted.v1
      summary: 撤销指定实体合并
      payload:
        type: object
        additionalProperties: false
        properties:
          merge_id:
            type: string
            minLength: 1
          restored_ids:
            type: array
            items:
              $ref: ../../schemas/common/event-types.schema.json#/$defs/entity_id
            minItems: 1
            uniqueItems: true
          entity_version:
            $ref: ../../schemas/common/event-types.schema.json#/$defs/version
          rights_tags:
            $ref: ../../schemas/common/event-types.schema.json#/$defs/rights_tags
        required:
        - merge_id
        - restored_ids
        - entity_version
        - rights_tags
      x-fixtures-required: true
    relationshipChanged:
      name: entity.relationship.changed.v1
      summary: 关系边变化
      payload:
        type: object
        additionalProperties: false
        properties:
          relationship_id:
            $ref: ../../schemas/common/event-types.schema.json#/$defs/relationship_id
          rights_tags:
            $ref: ../../schemas/common/event-types.schema.json#/$defs/rights_tags
          from_entity_id:
            $ref: ../../schemas/common/event-types.schema.json#/$defs/entity_id
          to_entity_id:
            $ref: ../../schemas/common/event-types.schema.json#/$defs/entity_id
          relationship_type:
            type: string
            minLength: 1
          relationship_version:
            $ref: ../../schemas/common/event-types.schema.json#/$defs/version
          action:
            enum:
            - upsert
            - remove
          qualifiers:
            type: array
            minItems: 1
            description: 约束（不是端点）：限定这条边成立的上下文，如采购项目、结果与标包；类型定义见各信息领域包的 relationships.yaml
            items:
              type: object
              additionalProperties: false
              properties:
                kind:
                  enum:
                  - project
                  - domain_fact
                  - lot
                  - region
                  - period
                ref:
                  type: string
                  minLength: 1
                  description: 标识（如 pp_、bdr_、lot_）、区划代码或期间（ISO 8601 区间）
              required:
              - kind
              - ref
          remove_reason:
            enum:
            - source_revised
            - source_withdrawn
            - rights_revoked
            - merge_reverted
            - superseded
            description: action 为 remove 时的原因；来源更正为 source_revised，并以新边的 upsert 代替（entity-graph 4.1）
          superseded_by:
            $ref: ../../schemas/common/event-types.schema.json#/$defs/relationship_id
            description: 修订后的新边
        required:
        - relationship_id
        - rights_tags
        - from_entity_id
        - to_entity_id
        - relationship_type
        - relationship_version
        - action
      x-fixtures-required: true
