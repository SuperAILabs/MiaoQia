# A01 直接投标：从采购意向与采购公告中找出值得投标的机会。
# 业务流程见 docs/02-business/application-domains/tendering/03-business-processes.md 2.1。
template:
  id: TPL-TENDER-A01-BID
  version: 0.1.0
  objective: APP-TENDER.A01
  roles: [ROLE-BIDDER, ROLE-MFR, ROLE-PRIME, ROLE-DEALER]
  fact_types: [tendering.notice]
  rollout_key: fact.project_id
  view: [buyer.profile]

  params:
    categories:     { type: list<category_code>, default_from: profile.offering_categories }
    regions:        { type: list<region_code>,   default_from: profile.service_regions }
    min_prep_days:  { type: int, default: 7, min: 1, say: 准备投标所需的最少天数 }
    min_budget_cny: { type: int, default: 0, min: 0 }
    large_budget_cny: { type: int, default: 5000000, min: 0 }

  scope:
    fact_types: [tendering.notice]
    when: >
      fact.notice_type in ["intent", "plan", "prequalification", "tender",
                           "negotiation", "consultation", "inquiry", "single_source", "framework"]
    # 更正与澄清更新已有公告事实的版本，按新版本重新求值，不单独进入范围。

  require:
    - id: R-CAT
      say: 采购标的属于我方产品品类
      when: category.any_match(fact.items, params.categories)
      missing: review
    - id: R-REGION
      say: 项目位于服务区域
      when: region.within(fact.location, params.regions)
      missing: review
    - id: R-DEADLINE
      say: 距投标截止不少于 {params.min_prep_days} 天
      when: features.deadline_days >= params.min_prep_days
      missing: review
    - id: R-BUDGET
      say: 预算不低于 {params.min_budget_cny} 元
      when: money.cny(fact.budget) >= params.min_budget_cny
      missing: ignore

  exclude:
    - id: X-SINGLE-SOURCE
      say: 单一来源采购且拟定供应商不是我方
      when: fact.notice_type == "single_source" && fact.single_source_supplier.org_id != profile.org_id
      reason: SINGLE_SOURCE_OTHER
    - id: X-BUYER-BLOCKED
      say: 采购人在禁合作名单
      when: fact.buyer.org_id in lists.blocked
      reason: BLOCKED_BUYER
    - id: X-TERM
      say: 标题命中排除词
      when: text.contains_any(fact.title, vocab.exclude_terms)
      reason: EXCLUDED_TERM

  watch:
    - id: W-INTENT
      say: 采购意向或采购计划，尚未发布公告
      when: fact.notice_type in ["intent", "plan"]

  boost:
    - id: B-KNOWN-BUYER
      say: 采购人是我方已有客户
      when: fact.buyer.org_id in lists.customers
      weight: 15
    - id: B-LARGE
      say: 预算不低于 {params.large_budget_cny} 元
      when: money.cny(fact.budget) >= params.large_budget_cny
      weight: 10

  penalize:
    - id: P-QUAL-GAP
      say: 公告资质要求中有我方不具备的项
      when: features.qualification_gap_count > 0
      weight: 15
    - id: P-BRAND
      say: 标的指定了其他品牌
      when: features.brand_locked_to_others
      weight: 20
    - id: P-TIGHT
      say: 准备时间偏紧（不足 {params.min_prep_days} 天加 3 天）
      when: features.deadline_days < params.min_prep_days + 3
      weight: 10

  evidence_policy:
    default: { min_confidence: 0.8, methods: [rule, model, manual] }
    fields:
      fact.bid_deadline: { min_confidence: 0.95 }

  thresholds: { base_score: 50, pursue_at: 50, drop_below: 20 }   # 硬条件全满足且无减分即建议投标

  route:
    pursue_candidate:
      notify: { audience: [objective_owner], mode: immediate }
      research: { template: RT-TENDER-ELIG, auto: true }
    review_candidate:
      notify: { audience: [objective_members], mode: digest }
    watch_signal:
      notify: { audience: [objective_members], mode: digest }

  examples:
    - name: 品类区域时限均满足的公开招标
      given:
        fact: { notice_type: tender, method: open_tender, title: 市政给水管网改造工程管材采购,
                location: "330106", budget: { value: 3200000, currency: CNY },
                items: [{ category: CAT-PIPE-PE }], requirements: [],
                bid_deadline: "2026-11-20T09:30:00+08:00", buyer: { org_id: org_b1 } }
        profile: { org_id: org_me, offering_categories: [CAT-PIPE-PE], service_regions: ["330000"],
                   qualification_codes: [], brands: [] }
        lists: { customers: [], blocked: [] }
        now: "2026-11-01T08:00:00+08:00"
      expect: pursue_candidate
    - name: 采购意向进入观察
      given:
        fact: { notice_type: intent, title: 2027 年供水管网更新采购意向, location: "330106",
                items: [{ category: CAT-PIPE-PE }], buyer: { org_id: org_b1 } }
        profile: { org_id: org_me, offering_categories: [CAT-PIPE-PE], service_regions: ["330000"] }
        lists: { customers: [], blocked: [] }
        now: "2026-11-01T08:00:00+08:00"
      expect: watch_signal
    - name: 服务区域外
      given:
        fact: { notice_type: tender, location: "440300", items: [{ category: CAT-PIPE-PE }],
                bid_deadline: "2026-11-20T09:30:00+08:00", buyer: { org_id: org_b2 } }
        profile: { org_id: org_me, offering_categories: [CAT-PIPE-PE], service_regions: ["330000"] }
        lists: { customers: [], blocked: [] }
        now: "2026-11-01T08:00:00+08:00"
      expect: no_signal
