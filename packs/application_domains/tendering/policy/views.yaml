# 视图目录：策略求值前由 detection 组装的只读视图（语义见 docs/03-architecture/11-policy-dsl.md 第 5.1 节）。
#
# fact_types：R1 模板使用的事实视图，是信息领域包领域 Schema 的投影，字段类型以 Schema 为准，本文件不重复定义。
#   source  投影来源 Schema；unit 求值单位（每个项目标包、每条公告、每个标包结果或每份合同求值一次）；when 进入该视图的条件；
#   triggers 触发重新求值的领域事件（缺省为来源事实首次发布的事件）；
#   fields  视图字段 → 来源路径（路径相对 source；project. 前缀表示所属采购项目；lot. 表示当前标包；latest_notice. 表示项目最新一条非更正采购公告；[*] 表示展开；min()/any() 为聚合）。
#   来源字段为空或 null 时，视图中不出现该字段（表达式中 has() 为假，读取为未知）。
#   enrichment.category(标的) 读取 L3 品类分类增强结果（数据架构 3.3）：只保留行业包分类体系、达到增强器发布门槛的品类，
#   展开为品类列表；该字段的证据置信度取所保留品类的最低值、方法记为 model 或 rule，受模板 evidence_policy 约束，
#   不达标时读取为未知。没有可用品类时视图中不出现该字段。
#
# view_items：可按名称引用的关联视图项，声明提供方、类型与新鲜度；组装后挂在 fact.<名称> 路径下，
# 例如 winner.credit_flags 在表达式中为 fact.winner.credit_flags。
#
# profile_fields：模板引用的客户上下文字段。
#

fact_types:
  # 商机视图：A01 按采购项目标包的当前状态求值，不按单条公告求值。公告按原文表达，更正与澄清
  # 是独立公告，由投影器应用到 ProcurementProject（截止时间、标的、预算等为应用全部更正后的值），
  # 因此更正后的截止时间、预算变化会体现在本视图中。同一模板对同一标包只保留一条信号，处置变化以
  # 信号更新记录（11-policy-dsl.md 4.3）。
  tendering.lot_opportunity:
    source: contracts/schemas/domains/procurement/procurement-project.schema.json
    unit: lot                            # 每个项目标包求值一次；信号键为 (模板, project_id, lot_id)
    when: stage in [intent, announced, amended] and (not has(lot.status) or lot.status == open)
    triggers:                            # 触发重新求值的领域事件；逻辑求值时间取事件时间
      - tendering.notice.published.v1
      - tendering.notice.amended.v1
      - tendering.deadline.changed.v1
      - tendering.project.stage_changed.v1
      - tendering.project.linked.v1
      - tendering.project.unlinked.v1
    fields:
      project_id: id
      lot_id: lot.id
      stage: stage
      method: method
      title: title.value
      location: location.code
      budget: "has(lot.budget) ? lot.budget : budget"
      max_price: lot.max_price
      items: lot.items[*]
      categories: enrichment.category(lot.items[*])
      requirements: lot.requirements[*]
      bid_deadline: min(lot.deadlines[type=bid_submission].at.value)
      consortium_allowed: lot.consortium_allowed
      single_source_supplier: latest_notice.single_source_supplier   # 最新一条非更正采购公告（notice_ids 中最后一条）
      buyer: buyer
      org_ids: "[buyer, agency, latest_notice.single_source_supplier].org_id"
  # 采购结果视图：每包每条 bid_result 独立求值。候选人保留 candidate_published 语义；实际中标逐条保留供应商，
  # 不能按 rank=1 选成唯一 winner，rank 可并列。框架第一阶段入围只进入 tendering.framework_shortlist，
  # 不触发 A02 的已成交供货路径；第二阶段成交须有实际中标证据。未公布单家报价时 amount 缺失；
  # 只有 price_kind=total 进入金额，年单价合计、单价、估算和未知含义不代替项目总额。
  # 本地契约检查不证明生产投影器已实现。
  tendering.bid_result:
    source: contracts/schemas/domains/procurement/notice.schema.json
    unit: bid_result                     # 每包每条结果独立求值，不能只取第一名
    when: notice_type == candidate or (notice_type == award and result.is_winner == true and (not has(result.result_kind) or result.result_kind == contract_award))
    fields:
      project_id: project_id
      result_type: "notice_type == candidate ? candidate_published : awarded"
      location: location.code
      items: project.lots[lot_id].items[*]     # 要求侧标的：结果公告常不重复标的，取项目标包的当前标的
      awarded_items: result.awarded_items[*]   # 中标侧明细（中标产品的品牌、型号、单价及计价单位）；原文未列时不出现，不用要求侧标的代替
      categories: enrichment.category(project.lots[lot_id].items[*])
      amount: result.price[price_kind == total] # 年单价合计/单价/未知含义不当项目成交总额
      buyer: buyer
      winner: result.bidder
      candidates: lot.bid_results[*]
      org_ids: "[buyer, result.bidder, result.consortium_members[*]].org_id"
  tendering.framework_shortlist:
    source: contracts/schemas/domains/procurement/notice.schema.json
    unit: bid_result                     # 各入围供应商独立投影，仍非第二阶段成交
    when: notice_type == award and result.result_kind == framework_shortlist
    fields:
      project_id: project_id
      notice_id: id
      lot_key: lot.lot_key
      supplier: result.bidder
      rank: result.rank
      amount: result.price                # 附件未审阅时不出现，不拿最高入围单价补齐
      org_ids: "[buyer, result.bidder, result.consortium_members[*]].org_id"
  tendering.contract_record:
    source: contracts/schemas/domains/procurement/notice.schema.json
    unit: notice
    when: notice_type == contract
    fields:
      project_id: project_id
      location: location.code
      items: project.lots[contract.lot_id].items[*]
      awarded_items: contract.items[*]         # 合同标的明细；原文未列时不出现
      categories: enrichment.category(project.lots[contract.lot_id].items[*])
      amount: contract.amount
      buyer: buyer
      winner: contract.supplier
      org_ids: "[buyer, contract.supplier].org_id"
  investment.construction_permit:
    source: contracts/schemas/domains/investment/record.schema.json
    unit: record
    when: record_type == construction_permit
    fields:
      record_id: id
      project_id: procurement_project_id
      investment_project_id: investment_project_id
      location: location.code
      items: project.lots[*].items[*]    # 经 procurement_project_id 关联的采购项目标的；未关联时不出现
      categories: enrichment.category(project.lots[*].items[*])
      amount: construction_permit.contract_amount
      winner: construction_permit.contractor
      org_ids: "[owner, construction_permit.contractor, construction_permit.designer, construction_permit.supervisor].org_id"
  org.change:
    source: contracts/schemas/domains/organization/change.schema.json
    unit: record
    fields:
      subject: subject
      change_type: change_type
      status_after: status_after
      org_ids: "[subject, org_shareholders_added[*], org_shareholders_removed[*]].org_id"
  org.abnormal:
    source: contracts/schemas/domains/organization/abnormal.schema.json
    unit: record
    fields:
      subject: subject
      abnormal_type: list_type
      resolved: "has(removed_on)"
      org_ids: "[subject].org_id"
  credit.record:
    source: contracts/schemas/domains/credit/record.schema.json
    unit: record
    when: record_type != credit_rating     # 信用评价不作为风险事件进入策略
    fields:
      subject: subject
      record_type: record_type
      role: judgment.role
      amount: amount
      resolved: resolved
      org_ids: "[subject, judgment.counterparties[*]].org_id"

view_items:
  buyer.profile:
    provider: entity-graph.GetOrganization
    type: "{org_id: string, type: enum, region: region_code}"
    freshness: event                     # 随 entity.* 事件更新
  winner.profile:
    provider: entity-graph.GetOrganization
    type: "{org_id: string, type: enum, region: region_code}"
    freshness: event
  winner.credit_flags:
    provider: domain-intelligence.QueryFacts(credit_records_by_org, window=365d)
    type: "list<{record_type: enum, resolved: bool, amount: money}>"
    freshness: event
  winner.history_categories:
    provider: domain-intelligence.GetDomainStatistics(award_categories_by_org, window=3y)
    type: list<category_code>
    freshness: daily
  winner.supplied_brand_owners:
    provider: entity-graph.GraphQuery(brand_owners_supplied_by, window=3y)   # 中标方 —supplied_brand→ 品牌 —brand_owned_by→ 厂商，归属取供应时点有效的边
    type: list<string>                   # 中标方近三年中标/合同明细中出现过的品牌所属组织；不含要求侧指定品牌
    freshness: daily
  winner.trailing_award_total:
    provider: domain-intelligence.GetDomainStatistics(award_total_by_org, window=365d)
    type: money
    freshness: daily
  winner.past_buyer_ids:
    provider: domain-intelligence.GetDomainStatistics(buyers_by_winner, window=3y)
    type: list<string>
    freshness: daily

profile_fields:                          # customer-context.GetContextSnapshot，契约 contracts/schemas/intelligence/context-snapshot.schema.json 的 policy_view
  org_ids: list<string>                  # 我方主体（集团客户的多个法人），排除“我方即中标方/拟定供应商”时任一命中即是；未关联本企业时不出现（未知）
  offering_categories: list<category_code>
  service_regions: list<region_code>
  brands: list<string>                   # 本租户自有或授权的品牌
  entities: map<string, entity_qualifications>
                                         # org_id → 资质状态表（契约 $defs/entity_qualifications）：qualifications 只含有效/过期，
                                         # 待核对代码单列，qualifications_complete 为“资质已录全”声明；资质条件遍历全部 org_ids，缺表的主体为未知
