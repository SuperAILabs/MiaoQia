# 视图目录：策略求值前由 detection 组装的只读视图（语义见 docs/03-architecture/11-policy-dsl.md 第 5.1 节）。
#
# fact_types：R1 模板使用的事实视图，是信息领域包领域 Schema 的投影，字段类型以 Schema 为准，本文件不重复定义。
#   source  投影来源 Schema；unit 求值单位（每条公告、每个标包结果或每份合同求值一次）；when 进入该视图的条件；
#   fields  视图字段 → 来源路径（路径相对 source；project. 前缀表示所属采购项目；[*] 表示展开；min()/any() 为聚合）。
#   来源字段为空或 null 时，视图中不出现该字段（表达式中 has() 为假，读取为未知）。
#
# view_items：可按名称引用的关联视图项，声明提供方、类型与新鲜度；组装后挂在 fact.<名称> 路径下，
# 例如 winner.credit_flags 在表达式中为 fact.winner.credit_flags。
#
# profile_fields：模板引用的客户上下文字段。
#
# 个人信息字段（如公告联系人 contacts）一律不进入视图。

fact_types:
  tendering.notice:
    source: contracts/schemas/domains/procurement/notice.schema.json
    unit: notice
    when: notice_type in [intent, plan, prequalification, tender, negotiation, consultation, inquiry, single_source, framework]
    fields:
      notice_id: id
      project_id: project_id
      notice_type: notice_type
      title: title.value
      method: method
      location: location.code
      budget: budget
      max_price: max_price
      items: lots[*].items[*]
      requirements: lots[*].requirements[*]
      bid_deadline: min(lots[*].deadlines[type=bid_submission].at.value)
      consortium_allowed: any(lots[*].consortium_allowed)
      single_source_supplier: single_source_supplier
      buyer: buyer
      org_ids: "[buyer, agency, single_source_supplier].org_id"
  tendering.bid_result:
    source: contracts/schemas/domains/procurement/notice.schema.json
    unit: lot                            # 结果公告中的每个标包求值一次
    when: notice_type in [candidate, award]
    fields:
      project_id: project_id
      result_type: "notice_type == candidate ? candidate_published : awarded"
      location: location.code
      items: project.lots[lot_id].items[*]     # 结果公告常不重复标的，取项目标包的当前标的
      amount: lot.bid_results[is_winner or rank=1].price
      buyer: buyer
      winner: lot.bid_results[is_winner or rank=1].bidder
      candidates: lot.bid_results[*]
      org_ids: "[buyer, lot.bid_results[*].bidder, lot.bid_results[*].consortium_members[*]].org_id"
  tendering.contract_record:
    source: contracts/schemas/domains/procurement/notice.schema.json
    unit: notice
    when: notice_type == contract
    fields:
      project_id: project_id
      location: location.code
      items: project.lots[contract.lot_id].items[*]
      amount: contract.amount
      buyer: buyer
      winner: contract.supplier
      org_ids: "[buyer, contract.supplier].org_id"
  investment.construction_permit:
    source: contracts/schemas/domains/investment/record.schema.json
    unit: record
    when: record_type == construction_permit
    fields:
      record_id: id
      project_id: procurement_project_id
      investment_project_id: investment_project_id
      location: location.code
      items: project.lots[*].items[*]    # 经 procurement_project_id 关联的采购项目标的；未关联时不出现
      amount: construction_permit.contract_amount
      winner: construction_permit.contractor
      org_ids: "[owner, construction_permit.contractor, construction_permit.designer, construction_permit.supervisor].org_id"
  org.change:
    source: contracts/schemas/domains/organization/change.schema.json
    unit: record
    fields:
      subject: subject
      change_type: change_type
      status_after: status_after
      org_ids: "[subject, org_shareholders_added[*], org_shareholders_removed[*]].org_id"
  org.abnormal:
    source: contracts/schemas/domains/organization/abnormal.schema.json
    unit: record
    fields:
      subject: subject
      abnormal_type: list_type
      resolved: "has(removed_on)"
      org_ids: "[subject].org_id"
  credit.record:
    source: contracts/schemas/domains/credit/record.schema.json
    unit: record
    when: record_type != credit_rating     # 信用评价不作为风险事件进入策略
    fields:
      subject: subject
      record_type: record_type
      role: judgment.role
      amount: amount
      resolved: resolved
      org_ids: "[subject, judgment.counterparties[*]].org_id"

view_items:
  buyer.profile:
    provider: entity-graph.GetOrganization
    type: "{org_id: string, type: enum, region: region_code}"
    freshness: event                     # 随 entity.* 事件更新
  winner.profile:
    provider: entity-graph.GetOrganization
    type: "{org_id: string, type: enum, region: region_code}"
    freshness: event
  winner.credit_flags:
    provider: domain-intelligence.QueryFacts(credit_records_by_org, window=365d)
    type: "list<{record_type: enum, resolved: bool, amount: money}>"
    freshness: event
  winner.history_categories:
    provider: domain-intelligence.GetDomainStatistics(award_categories_by_org, window=3y)
    type: list<category_code>
    freshness: daily
  winner.supplied_brand_owners:
    provider: entity-graph.GetRelationships(supplied_brand, window=3y)
    type: list<string>                   # 中标方项目中出现过的品牌所属组织
    freshness: daily
  winner.trailing_award_total:
    provider: domain-intelligence.GetDomainStatistics(award_total_by_org, window=365d)
    type: money
    freshness: daily
  winner.past_buyer_ids:
    provider: domain-intelligence.GetDomainStatistics(buyers_by_winner, window=3y)
    type: list<string>
    freshness: daily

profile_fields:                          # customer-context.GetContextSnapshot [假设]，以其契约为准
  org_id: string                         # 本租户在公共实体中的组织标识
  offering_categories: list<category_code>
  service_regions: list<region_code>
  qualification_codes: list<string>
  brands: list<string>                   # 本租户自有或授权的品牌
