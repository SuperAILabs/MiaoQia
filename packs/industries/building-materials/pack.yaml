# 行业包清单。格式见 docs/03-architecture/04-extensibility.md 2.1、2.4；定义文件格式 contracts/packs/industry.schema.json，mqc I1–I5 校验。
pack:
  id: IND-BUILDING-MATERIALS
  kind: industry
  version: 0.2.0                 # 草案：建材管材完整样板，推荐值待领域负责人核对（review: proposed）
  platform_api: ">=1.0 <2.0"
  owners: [tendering-domain-team]
  provides:
    taxonomy: categories.yaml          # 品类分类与跨分类映射：scheme industry:building-materials
    vocabulary: vocabulary.yaml        # 产品、规格、标签与品牌词表，品类分类规则
    qualifications: qualifications.yaml  # 能力与资质模板：scheme qual:building-materials
    defaults: defaults.yaml            # 默认排除与关注词表（策略 vocab）
