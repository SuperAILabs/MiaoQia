[project]
name = "miaoqia-evidence"
version = "0.1.0"
description = "evidence 子系统：证据与内容理解（规格见 docs/03-architecture/subsystems/evidence.md）"
requires-python = ">=3.12"
dependencies = ["miaoqia-kernel", "miaoqia-sdk", "miaoqia-acquisition"]

[project.scripts]
mq-evidence-replay = "miaoqia.evidence.replay:main"

[tool.uv.sources]
miaoqia-acquisition = { workspace = true }
miaoqia-kernel = { workspace = true }
miaoqia-sdk = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miaoqia"]
