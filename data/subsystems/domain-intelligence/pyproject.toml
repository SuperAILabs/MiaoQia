[project]
name = "miaoqia-domain-intelligence"
version = "0.1.0"
description = "domain-intelligence 子系统：领域情报（规格见 docs/03-architecture/subsystems/domain-intelligence.md）"
requires-python = ">=3.12"
dependencies = ["miaoqia-kernel", "miaoqia-evidence"]

[project.scripts]
mq-project-backfill = "miaoqia.domain_intelligence.application.backfill:main"

[tool.uv.sources]
miaoqia-kernel = { workspace = true }
miaoqia-evidence = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miaoqia"]
