[project]
name = "miaoqia-acquisition"
version = "0.1.0"
description = "acquisition 子系统：来源采集（规格见 docs/03-architecture/subsystems/acquisition.md）"
requires-python = ">=3.12"
dependencies = ["miaoqia-kernel"]

[tool.uv.sources]
miaoqia-kernel = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miaoqia"]
