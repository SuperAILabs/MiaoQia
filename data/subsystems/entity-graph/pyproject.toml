[project]
name = "miaoqia-entity-graph"
version = "0.1.0"
description = "entity-graph 子系统：实体与关系图谱（规格见 docs/03-architecture/subsystems/entity-graph.md）"
requires-python = ">=3.12"
dependencies = ["miaoqia-kernel"]

[tool.uv.sources]
miaoqia-kernel = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miaoqia"]
