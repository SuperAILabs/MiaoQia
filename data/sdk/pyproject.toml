[project]
name = "miaoqia-sdk"
version = "0.1.0"
description = "信息领域包 SPI：规范化文档访问、字段溯源、中文值解析、语料评测"
requires-python = ">=3.12"
dependencies = [
  "miaoqia-contracts",
  "jsonschema==4.26.0",
  "referencing==0.37.0",
  "pyyaml==6.0.3",
  "lxml==6.0.2",
]

[project.scripts]
mq-corpus = "miaoqia.sdk.corpus:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv.sources]
miaoqia-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miaoqia"]
