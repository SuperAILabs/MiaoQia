# Install as /etc/nginx/conf.d/mq-public.conf on the development VPS.
# The addresses belong to the MiaoQia-owned miaoqia_public network. Cloudflare
# terminates public TLS; the origin certificate paths are deployment-managed.
server {
    listen 80;
    server_name auth.lai.co;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://10.89.14.250:8080;
    }
}

server {
    listen 80;
    server_name fga.lai.co;
    location / {
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://10.89.14.251:8080;
    }
}

server {
    listen 80;
    server_name otel.lai.co;
    client_max_body_size 16m;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:14318;
    }
}

server {
    listen 443 ssl;
    server_name auth.lai.co;
    ssl_certificate /etc/mq-public/tls/origin.crt;
    ssl_certificate_key /etc/mq-public/tls/origin.key;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://10.89.14.250:8080;
    }
}

server {
    listen 443 ssl;
    server_name fga.lai.co;
    ssl_certificate /etc/mq-public/tls/origin.crt;
    ssl_certificate_key /etc/mq-public/tls/origin.key;
    location / {
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://10.89.14.251:8080;
    }
}

server {
    listen 443 ssl;
    server_name otel.lai.co;
    ssl_certificate /etc/mq-public/tls/origin.crt;
    ssl_certificate_key /etc/mq-public/tls/origin.key;
    client_max_body_size 16m;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:14318;
    }
}
