# acquisition 部署单元的进程角色（docs/03-architecture/07-deployment-topology.md 第 2.1 节）。
roles:
  acq-scheduler:            # 按来源的增量采集周期任务（kernel scheduler）；同时消费控制类事件（回填请求、链路探针）
    subsystems: [acquisition]
    jobs: true
  acq-fetcher:
    subsystems: [acquisition]
  acq-browser:
    subsystems: [acquisition]
  acq-admin:
    subsystems: [acquisition]
