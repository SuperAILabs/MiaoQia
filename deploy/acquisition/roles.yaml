# acquisition 部署单元的进程角色（docs/03-architecture/07-deployment-topology.md 第 2.1 节）。
roles:
  acq-scheduler:            # 窗口计划与链路探针
    subsystems: [acquisition]
    jobs: true
  acq-fetcher:
    subsystems: [acquisition]
    consumers: false
    workers: true
  acq-browser:
    subsystems: [acquisition]
    consumers: false
    workers: true
  acq-admin:
    subsystems: [acquisition]
