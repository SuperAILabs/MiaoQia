# platform 部署单元的进程角色（docs/03-architecture/07-deployment-topology.md 第 2.3 节）。
# 子系统必须属于 platform 单元（子系统索引）；tools/dev/gen_local.py --check 校验。
roles:
  api:
    data_scopes: {search: tenant}
    cell: cell-01
    subsystems: [gateway, identity, commerce, governance, customer-context, detection,
                 research, assessment, pursuit, learning, channels, search, ai-platform, operations]
  consumer:
    data_scopes: {search: tenant}
    cell: cell-01
    subsystems: [search, detection, assessment, pursuit, customer-context, learning, channels, commerce, governance, operations]
  workflow-worker:
    data_scopes: {search: tenant}
    cell: cell-01
    subsystems: [research, learning, customer-context, pursuit, governance, search]
  scheduler:                # 周期任务（kernel/scheduler，验收线 R-01）；identity 须本地加载（租户枚举只有本地绑定）
    cell: cell-01
    subsystems: [identity, commerce, customer-context, detection, pursuit, channels, operations]

  # 角色凭据和迁移见 public-search.md。
  public-search-api:
    subsystems: [search]
    data_scopes: {search: public}
  public-search-consumer:
    subsystems: [search]
    data_scopes: {search: public}
  public-search-workflow-worker:
    subsystems: [search]
    data_scopes: {search: public}

# 中继数据库取自子系统索引。境内公共进程通过 sources 显式选择对应的公共子系统。
outbox_relay:
  dsn_template: ${MIAOQIA_RELAY_DSN_TEMPLATE}   # 例如 postgres://outbox_relay:…@pg:5432/{db}
  sources: ${MIAOQIA_RELAY_SOURCES}             # acquisition,evidence,domain-intelligence,entity-graph
