[project]
name = "miaoqia-contract-tools"
version = "0.1.0"
description = "契约检查与三语言代码生成（contracts/ → Go、Python、TypeScript）"
requires-python = ">=3.14"
dependencies = [
  "jsonschema[format-nongpl]==4.26.0",
  "referencing==0.37.0",
  "pyyaml==6.0.3",
  # 0.35.0 runs on Python 3.14 and keeps the generated models unchanged; 0.50+ emits invalid syntax for recursive RootModels.
  "datamodel-code-generator==0.35.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[project.scripts]
mqc = "mqc.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mqc"]
