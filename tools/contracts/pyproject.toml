[project]
name = "miaoqia-contract-tools"
version = "0.1.0"
description = "契约检查与三语言代码生成（contracts/ → Go、Python、TypeScript）"
requires-python = ">=3.12"
dependencies = [
  "jsonschema==4.26.0",
  "referencing==0.37.0",
  "pyyaml==6.0.3",
  "datamodel-code-generator==0.34.0",
]

[project.scripts]
mqc = "mqc.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mqc"]
